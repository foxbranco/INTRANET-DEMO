 try{empresaConfigAtual=await empresaRequest('/api/empresa/imagem/'+tipo,{method:'POST',body:data});empresaPreviews(empresaConfigAtual);empresaAplicar(empresaConfigAtual);if(s)s.textContent='Imagem salva.'}catch(e){if(s)s.textContent=e.message}finally{input.value=''}}
// Textos institucionais: utiliza nome_curto cadastrado, preservando nomes técnicos e produtos.
function empresaAtualizarTextos(d){
 const nome=String(d?.nome_curto||d?.nome||'').trim();
 if(!nome)return;
 const rodape=document.getElementById('empresa-rodape');
 if(rodape)rodape.textContent='Intranet '+nome+' V12 • Conteúdos demonstrativos identificados até a integração dos módulos';
 const raiz=document.getElementById('app');
 if(!raiz)return;
 const iter=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT);
 let no;
 while((no=iter.nextNode())){
  if(!no.parentElement || no.parentElement.closest('script,style,textarea,code'))continue;
  const antes=no.nodeValue;
  // Personalização apenas visual: preserva rotas, APIs e identificadores técnicos.
  const depois=antes
   .replace(/Megavig\s*360°?/gi,()=>nome+' 360°')
   .replace(/(?:Megavig\s+Pulse|Pulse\s+Megavig)/gi,()=> 'Pulse '+nome)
   .replace(/Radar\s+Megavig/gi,()=> 'Radar '+nome)
   .replace(/Megavig/gi,()=>nome);
  if(depois!==antes)no.nodeValue=depois;
 }
 raiz.querySelectorAll('.v12-photo-unavailable').forEach(el=>el.setAttribute('data-empresa-nome',nome.toUpperCase()));
}
function empresaAplicar(d){
 if(!d)return;
 document.documentElement.style.setProperty('--blue',d.cor_principal||'#2477ca');
 // Contraste automatico para cores claras e escuras, sem afetar os dashboards.
 const corMenu=/^#[0-9a-fA-F]{6}$/.test(d.cor_principal||'')?d.cor_principal:'#2477ca';
 const rgb=[1,3,5].map(i=>parseInt(corMenu.slice(i,i+2),16));
 const luminancia=rgb.map(v=>{v/=255;return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0);
 const texto=luminancia>0.36?'#102c47':'#ffffff';
 const fator=luminancia>0.36?0.83:0.72;
 const destaque='#'+rgb.map(v=>Math.round(v*fator).toString(16).padStart(2,'0')).join('');
 document.documentElement.style.setProperty('--empresa-menu-texto',texto);
 document.documentElement.style.setProperty('--empresa-menu-destaque',destaque);
 document.documentElement.style.setProperty('--empresa-menu-borda',texto==='#ffffff'?'#ffffff66':'#102c4755');
 document.title=(d.nome_curto||d.nome||'Intranet')+' | Intranet';
 empresaAtualizarTextos(d);
 const logo=document.getElementById('empresa-logo-header');
 if(logo){
  const nome=d.logo||d.logotipo;
  if(nome){
   empresaImagemBlob(nome).then(url=>{
    if(logo.isConnected && empresaConfigAtual===d){logo.src=url;logo.hidden=false;logo.style.display="";}
   }).catch(()=>{logo.hidden=true;logo.style.display='none';logo.removeAttribute('src');});
  }else{logo.hidden=true;logo.style.display='none';logo.removeAttribute('src');}
 }
 const root=document.getElementById('hero-carousel');
 if(root){
  root.querySelectorAll('.slide-photo').forEach((img,i)=>{
   const nome=Array.isArray(d.banners)?d.banners[i]:null;
   if(!nome){img.hidden=true;img.style.display='none';img.removeAttribute('src');return;}
   empresaImagemBlob(nome).then(url=>{
    if(img.isConnected && empresaConfigAtual===d){img.src=url;img.hidden=false;img.style.display='';}
   }).catch(()=>{img.hidden=true;img.style.display='none';img.removeAttribute('src');});
  });
 }
}
// Todas as telas são reconstruídas ao navegar; reaplica o nome curto e as imagens após cada renderização.
let empresaAtualizacaoPendente=false;
const empresaObservador=new MutationObserver(mudancas=>{
 if(!empresaConfigAtual||empresaAtualizacaoPendente)return;
 if(!mudancas.some(m=>Array.from(m.addedNodes).some(n=>n.nodeType===1)))return;
 empresaAtualizacaoPendente=true;
 queueMicrotask(()=>{empresaAtualizacaoPendente=false;empresaAplicar(empresaConfigAtual);});
});
empresaObservador.observe(document.getElementById('app'),{childList:true,subtree:true});

async function empresaInicializar(){try{empresaConfigAtual=await empresaRequest('/api/empresa/config');empresaAplicar(empresaConfigAtual)}catch(e){console.warn('Configuração da empresa indisponível:',e.message)}}
empresaInicializar();

/* ADMIN POSTOS OPERACIONAIS V12 */
let postosDados=[],postosCarregando=false,postosErro='';
const postosEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function postosApi(url,options={}){
 const t=sessionStorage.getItem('intranet_token');
 const r=await fetch(url,{...options,headers:{Authorization:'Bearer '+t,...(options.headers||{})},cache:'no-store'});
 if(!r.ok){let msg='HTTP '+r.status;try{msg=(await r.json()).detail||msg}catch(e){}throw Error(msg)}return r.json();
}
async function postosCarregar(){if(postosCarregando)return;postosCarregando=true;try{postosDados=await postosApi('/api/postos');postosErro=''}catch(e){postosErro=e.message}finally{postosCarregando=false;const painel=document.getElementById('postos-operacionais-painel');if(painel)painel.outerHTML=postosTela()}}
function postosTela(){
 const linhas=postosDados.map(p=>`<tr><td>${postosEsc(p.centro_custo_nominal==='ADMINISTRATIVO'?'MATRIZ MEGAVIG':p.centro_custo_nominal)}</td><td>${p.funcionarios}</td><td>${postosEsc(p.cidade||'—')}</td><td>${postosEsc(p.precisao_localizacao)}</td><td><button class="btn secondary" onclick="postosEditar(${p.id})">Editar</button></td></tr>`).join('');
 return `<section id="postos-operacionais-painel" class="card"><div class="spaced"><div><h2>Postos Operacionais</h2><p>Endereços, localização e funcionários vinculados automaticamente pelo centro de custo.</p></div><button class="btn secondary" onclick="postosCarregar()">Atualizar</button></div>${postosErro?`<p class="notice">${postosEsc(postosErro)}</p>`:''}<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Posto</th><th>Funcionários</th><th>Cidade</th><th>Localização</th><th>Ação</th></tr></thead><tbody>${linhas||'<tr><td colspan="5">Carregando postos...</td></tr>'}</tbody></table></div><p class="muted">Localização: consulte as coordenadas pelo endereço, confira o marcador e salve somente após a conferência.</p></section>`;
}
function postosEditar(id){
 const p=postosDados.find(x=>x.id===id);if(!p)return;
 document.getElementById('postos-modal')?.remove();
 const campos=[['cliente','Cliente'],['tipo_servico','Tipo de serviço'],['cep','CEP'],['logradouro','Logradouro'],['numero','Número'],['complemento','Complemento'],['bairro','Bairro'],['cidade','Cidade'],['uf','UF'],['latitude','Latitude'],['longitude','Longitude']];
 const form=document.createElement('div');form.className='modal-back postos-overlay';form.id='postos-modal';
 form.innerHTML=`<div class="modal postos-dialog" role="dialog" aria-modal="true" aria-label="Editar posto"><div class="postos-modal-head"><div><h2>${postosEsc(p.centro_custo_nominal==='ADMINISTRATIVO'?'MATRIZ MEGAVIG':p.centro_custo_nominal)}</h2><span>${p.funcionarios} funcionários ativos</span></div><button type="button" class="postos-close" id="postos-fechar-top" aria-label="Fechar">×</button></div><form id="postos-form"><div class="postos-form-scroll"><div class="postos-fields">${campos.map(([k,l])=>`<label>${l}<span class="postos-input-wrap"><input name="${k}" value="${postosEsc(p[k])}" ${['latitude','longitude'].includes(k)?'type="number" step="any"':''} ${k==='cep'?'inputmode="numeric" maxlength="9" autocomplete="postal-code"':''} ${k==='uf'?'maxlength="2"':''}>${k==='cep'?'<button type="button" id="postos-cep" class="postos-cep-btn">Buscar CEP</button>':''}</span></label>`).join('')}<label>Precisão<select name="precisao_localizacao">${['PENDENTE','APROXIMADA','EXATA'].map(v=>`<option ${p.precisao_localizacao===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Status<select name="status">${['ATIVO','INATIVO'].map(v=>`<option ${p.status===v?'selected':''}>${v}</option>`).join('')}</select></label></div><p id="postos-msg" class="postos-msg" role="status" aria-live="polite"></p></div><div class="postos-modal-actions"><button type="button" class="btn secondary" id="postos-geocodificar">Obter coordenadas</button><button type="button" class="btn secondary" id="postos-buscar">Ver no mapa</button><span class="postos-action-spacer"></span><button type="button" class="btn secondary" id="postos-fechar">Cancelar</button><button type="submit" class="btn">Salvar</button></div></form></div>`;
 document.body.appendChild(form);
 const f=form.querySelector('#postos-form');const msg=form.querySelector('#postos-msg');
 const fechar=()=>form.remove();form.querySelector('#postos-fechar').onclick=fechar;form.querySelector('#postos-fechar-top').onclick=fechar;
 form.querySelector('#postos-cep').onclick=async()=>{
  const cep=f.elements.cep.value.replace(/\D/g,'');if(cep.length!==8){msg.textContent='Informe um CEP com 8 números.';return}
  const botao=form.querySelector('#postos-cep');botao.disabled=true;msg.textContent='Consultando CEP...';
  try{const resposta=await fetch('https://viacep.com.br/ws/'+cep+'/json/');if(!resposta.ok)throw Error('Serviço de CEP indisponível');const d=await resposta.json();if(d.erro)throw Error('CEP não encontrado');
   for(const [campo,valor] of Object.entries({logradouro:d.logradouro,bairro:d.bairro,cidade:d.localidade,uf:d.uf,complemento:d.complemento})){if(valor && (campo!=='complemento'||!f.elements[campo].value.trim()))f.elements[campo].value=valor}
   f.elements.cep.value=cep;msg.textContent='Endereço preenchido pelo CEP. Confira número, complemento e localização.';
  }catch(e){msg.textContent='Não foi possível consultar o CEP: '+e.message+'. Preencha o endereço manualmente.'}finally{botao.disabled=false}
 };
 f.elements.cep.addEventListener('blur',()=>{if(f.elements.cep.value.replace(/\D/g,'').length===8&&!f.elements.logradouro.value.trim())form.querySelector('#postos-cep').click()});
 // Geocodificação sob demanda: não consulta em cada digitação nem repete automaticamente.
 form.querySelector('#postos-geocodificar').onclick=async()=>{
  const rua=f.elements.logradouro.value.trim(),numero=f.elements.numero.value.trim(),cidade=f.elements.cidade.value.trim(),uf=f.elements.uf.value.trim().toUpperCase();
  if(!rua||!cidade||!uf){msg.textContent='Preencha logradouro, cidade e UF antes de obter as coordenadas.';return}
  const btn=form.querySelector('#postos-geocodificar');btn.disabled=true;msg.textContent='Consultando coordenadas do endereço...';
  try{
   const query=[numero?rua+', '+numero:rua,f.elements.bairro.value.trim(),cidade,uf,'Brasil'].filter(Boolean).join(', ');
   const params=new URLSearchParams({q:query,format:'jsonv2',limit:'1',countrycodes:'br',addressdetails:'1'});
   const resp=await fetch('https://nominatim.openstreetmap.org/search?'+params.toString(),{headers:{Accept:'application/json'}});
   if(!resp.ok)throw Error('Serviço de localização indisponível (HTTP '+resp.status+')');
   const resultados=await resp.json();if(!Array.isArray(resultados)||!resultados.length)throw Error('Endereço não localizado. Confira os dados ou informe as coordenadas manualmente');
   const local=resultados[0],lat=Number(local.lat),lon=Number(local.lon);

  }catch(err){msg.textContent='Não foi possível obter coordenadas: '+err.message}
  finally{btn.disabled=false}
 };
 form.querySelector('#postos-buscar').onclick=()=>{const q=['logradouro','numero','bairro','cidade','uf','cep'].map(k=>f.elements[k].value.trim()).filter(Boolean).join(', ');if(!q){msg.textContent='Preencha o endereço antes de abrir o mapa.';return}const lat=Number(f.elements.latitude.value),lon=Number(f.elements.longitude.value);const temCoords=f.elements.latitude.value.trim()&&f.elements.longitude.value.trim()&&Number.isFinite(lat)&&Number.isFinite(lon);window.open(temCoords?'https://www.openstreetmap.org/?mlat='+encodeURIComponent(lat)+'&mlon='+encodeURIComponent(lon)+'#map=18/'+encodeURIComponent(lat)+'/'+encodeURIComponent(lon):'https://www.openstreetmap.org/search?query='+encodeURIComponent(q),'_blank','noopener');msg.textContent=temCoords?'Confira se o marcador corresponde ao endereço antes de salvar.':'Confira o endereço no mapa e use “Obter coordenadas”.';};
 // Alterações no endereço invalidam a posição anterior até nova conferência.
 for(const nome of ['cep','logradouro','numero','bairro','cidade','uf']){

 }

}
