/* Prioridade das janelas de cadastro */

/* V11 - Aproveitamento da largura do monitor */
@media (min-width: 1100px) {
    body .container,
    body .wrap,
    body .content-container,
    body .main-container {
        max-width: none !important;
        width: calc(100% - 60px) !important;
        margin-left: auto !important;
        margin-right: auto !important;
    }

    .admin-nav {
        display: flex !important;
        flex-wrap: nowrap !important;
        justify-content: space-between !important;
        gap: 8px !important;
        overflow-x: auto !important;
        align-items: stretch !important;
    }

    .admin-nav button {
        flex: 0 0 auto !important;
        white-space: nowrap !important;
        padding: 12px 10px !important;
        font-size: 14px !important;
    }
}

@media (max-width: 1099px) {
    .admin-nav {
        display: flex !important;
        flex-wrap: nowrap !important;
        overflow-x: auto !important;
        gap: 8px !important;
    }

    .admin-nav button {
        flex-shrink: 0 !important;
        white-space: nowrap !important;
    }
}

async function eadSavePlayerState(state, keepalive=false){
 if(!state||!state.player||state.busy||state.concluido)return;
 let current;try{current=Number(state.player.getCurrentTime())}catch(e){return}
 if(!Number.isFinite(current))return;
 const duration=Math.floor(state.player.getDuration()||0)||state.duracao;
 if(!duration)return;
 const pct=Math.min(100,100*state.seen.size/duration);
 state.busy=true;
 try{
  // Em aula incompleta, nunca persistir como ponto de retomada os segundos finais.
  // Isso nao modifica o percentual efetivamente assistido.
  const finalizado=state.ended&&pct>=95;
  const posicaoGravada=(!finalizado&&duration>10&&current>=duration-10)
   ? 0 : Math.max(0,Math.min(duration,Math.floor(current)));
  const response=await eadRequest('/meus/'+encodeURIComponent(state.cursoId)+'/materiais/'+state.material+'/progresso',{
   method:'PUT',keepalive,headers:{'Content-Type':'application/json'},
   body:JSON.stringify({posicao_segundos:posicaoGravada,percentual_assistido:pct,duracao_real_segundos:duration,segundos_assistidos:[...state.seen].sort((a,b)=>a-b),concluido:finalizado})
  });
  state.concluido=!!response.concluido;
  state.percentual=Number(response.percentual_assistido)||0;
  if(Array.isArray(response.segundos_assistidos)){state.seen=new Set(response.segundos_assistidos);state.watched=state.seen.size;}
  if(state.concluido){const next=document.getElementById('ead-lesson-btn-'+(eadPlayers.indexOf(state)+1));if(next)next.disabled=false;}
  if(response.prova_pendente&&response.aulas_concluidas===response.total_aulas)eadRefreshProva(state.cursoId);
  const el=document.getElementById('ead-status-'+state.material);
  if(el)el.textContent=state.concluido?'✓ Aula concluída':'Progresso assistido: '+Math.floor(state.percentual)+'%';
 }catch(e){const el=document.getElementById('ead-status-'+state.material);if(el)el.textContent='Falha ao salvar progresso: '+e.message}
 finally{state.busy=false}
}

   }
   const material=Number(a.material_id);

   }else if(/\.(mp4|webm|ogg)$/i.test(endereco.pathname)){
    player=`<video controls preload="metadata" src="${eadEsc(url)}" style="width:100%;max-height:440px"></video>`;
   }else player=`<a href="${eadEsc(url)}" target="_blank" rel="noopener noreferrer">Abrir vídeo</a>`;
   return `<article class="ead-lesson" data-ead-index="${i}" style="padding:7px 0;border-top:1px solid #dce5ef;${i===0?'':'display:none;'}"><h3 style="font-size:16px;margin:7px 0">${i+1}. ${eadEsc(a.aula_titulo||a.titulo||'Aula')}</h3>${a.aula_descricao?`<p style="margin:5px 0">${eadEsc(a.aula_descricao)}</p>`:''}${player}<p id="ead-status-${material}" class="ead-note">${concluido?'✓ Aula concluída':percentual?'Progresso salvo: '+Math.round(percentual)+'%':'Aula não concluída'}</p></article>`;
  }).filter(Boolean);
  // Resumo de consulta: usa apenas os dados ja retornados pelo endpoint de conteudo.
  const resumoAulas=itens.map((a,i)=>{
   const nome=eadEsc(a.aula_titulo||a.titulo||'Aula');
   const tipo=eadEsc(a.tipo||a.tipo_material||(a.video_url?'Vídeo':'Material'));
   const pct=Math.max(0,Math.min(100,Math.round(Number(a.percentual_assistido)||0)));
   const situacao=a.concluido?'Concluída':pct?'Em andamento ('+pct+'%)':'Pendente';
   return `<div style="display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid #e5edf5"><span style="font-weight:700;color:#386b9b">${i+1}</span><div><strong>${nome}</strong><div class="muted" style="font-size:12px">${tipo}</div></div><span style="font-size:12px;color:${a.concluido?'#187443':'#59718b'}">${situacao}</span></div>`;
  }).join('');
  const resumoConcluidas=itens.filter(a=>a.concluido).length;
  const resumoHtml=itens.length?`<details open id="ead-resumo-aulas" style="margin:10px 0;padding:10px 14px;border:2px solid #b6d4ee;background:#f7fbff"><summary>Resumo das aulas — ${resumoConcluidas} de ${itens.length} concluídas (somente consulta)</summary><div style="margin-top:8px">${resumoAulas}</div></details>`:'';
  modal(`<div class="ead-course-head"><h2>${eadEsc(x.titulo)}</h2><p>${eadEsc(x.descricao||'')}</p><p><strong>Situação:</strong> ${eadState(x)}</p><div class="ead-actions">${btn('Salvar progresso','eadSaveAll()','primary')}${btn('Fechar','eadCloseModal()','secondary')}</div></div>${resumoHtml}${linhas.length?`<div id="ead-lesson-nav" style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">${itens.map((a,i)=>`<button type="button" class="btn secondary" id="ead-lesson-btn-${i}" onclick="eadSelectLesson(${i})" ${i>0&&!itens.slice(0,i).every(z=>z.concluido)?'disabled':''}>Aula ${i+1}${a.concluido?' ✓':''}</button>`).join('')}</div>`+linhas.join(''):'<p>Este curso ainda não possui aulas disponíveis.</p>'}<div id="ead-prova-area"></div><p class="ead-note">Progresso salvo automaticamente durante a reprodução. Use “Salvar progresso” antes de sair, se desejar.</p></div>`);
  window.eadSelectLesson=function(index){
   const lessons=[...document.querySelectorAll('#modal-root .ead-lesson')];
   if(!lessons[index])return;
   const button=document.getElementById('ead-lesson-btn-'+index);
   if(button?.disabled)return;
   for(const state of eadPlayers){
    try{state.player?.pauseVideo()}catch(e){}
    state.playing=false;state.last=null;
   }
   document.querySelectorAll('#modal-root video').forEach(v=>{try{v.pause()}catch(e){}});
   lessons.forEach((el,i)=>{el.style.display=i===index?'':'none'});
   document.querySelectorAll('[id^=ead-lesson-btn-]').forEach((b,i)=>{b.style.background=i===index?'#2477ca':'';b.style.color=i===index?'white':''});
  };
  window.eadSelectLesson(Math.max(0,itens.findIndex(a=>!a.concluido)));
  const fundo=document.querySelector('#modal-root .modal-back');
  if(fundo)fundo.onclick=(event)=>{event.stopPropagation();};
  const janela=document.querySelector('#modal-root .modal');
  const fundoEad=document.querySelector('#modal-root .modal-back');
  if(fundoEad){fundoEad.style.alignItems='start';fundoEad.style.padding='14px 16px';}
  if(janela){
   janela.style.width='min(1120px, calc(100vw - 32px))';
   janela.style.maxWidth='1120px';
   janela.style.maxHeight='calc(100vh - 28px)';
   janela.style.overflowY='auto';
   janela.style.padding='12px 22px 14px';
   janela.style.margin='0 auto';
  }
  const cabecalho=document.querySelector('#modal-root .ead-course-head');
  if(cabecalho){
   cabecalho.style.margin='0';
   cabecalho.querySelectorAll('h2,p').forEach(el=>{el.style.marginTop='3px';el.style.marginBottom='5px';});
   const acoes=cabecalho.querySelector('.ead-actions');
   if(acoes)acoes.style.margin='6px 0 8px';
  }
  document.querySelectorAll('#modal-root [id^="ead-player-"]').forEach(el=>{
   el.style.width='100%';
   el.style.maxWidth='100%';
   el.style.height='min(48vh,430px)';
   el.style.minHeight='300px';
   el.style.aspectRatio='16 / 9';
   el.style.margin='0 auto';
  });
  document.querySelectorAll('#modal-root .ead-note').forEach(el=>{el.style.margin='5px 0';el.style.fontSize='13px';});
  if(result?.configuracao?.exigir_prova) eadRefreshProva(id);
  if(!youtube.length)return;
  await eadYoutubeApi();
  if(!document.getElementById(youtube[0].el))return;
  for(const item of youtube){
   const state={...item,cursoId:id,player:null,playing:false,last:null,lastTick:null,watched:item.segundos.length,seen:new Set(item.segundos),ended:false,saved:0,busy:false};
   state.player=new YT.Player(item.el,{
    videoId:item.codigo,
    playerVars:{playsinline:1,autoplay:0,origin:location.origin},
    events:{onReady:e=>{
      // Nao faz seek enquanto o YouTube ainda esta carregando.
      state.retomadaAplicada=false;
    },
      onStateChange:e=>{
        const wasPlaying=state.playing;
        state.playing=e.data===YT.PlayerState.PLAYING;
        if(state.playing){
          for(const other of eadPlayers){
            if(other!==state){
              try{other.player?.pauseVideo()}catch(err){}
              other.playing=false;other.last=null;other.lastTick=null;
            }
          }
          if(!state.retomadaAplicada){
            state.retomadaAplicada=true;
            if(state.posicao>0&&!state.concluido){
              const dur=Number(e.target.getDuration())||state.duracao||0;
              const destino=(dur>0 && state.posicao>=dur-10) ? 0 : Math.max(0,Math.min(state.posicao,dur>10?dur-10:state.posicao));
              // Com o player reproduzindo, o seek e feito com carregamento habilitado.
              // Evita seek desnecessario no zero e eventos repetidos na inicializacao.
              if(destino>0.5){
               try{e.target.seekTo(destino,true)}catch(err){console.warn('EAD: falha ao retomar',err)}
              }
            }
          }
          state.last=null;state.lastTick=null;
        }else{
          state.last=null;state.lastTick=null;
          if(e.data===YT.PlayerState.ENDED&&wasPlaying){
            state.ended=true;eadSavePlayerState(state,true);
          }else if(wasPlaying&&e.data===YT.PlayerState.PAUSED){
            eadSavePlayerState(state,true);
          }
        }
      }}
   });
   eadPlayers.push(state);
  }
  eadProgressTimer=setInterval(async()=>{
   for(const state of eadPlayers){
    if(!state.playing||state.concluido)continue;
    let current;try{current=Number(state.player.getCurrentTime())}catch(e){continue}
    if(!Number.isFinite(current))continue;
    const dur=Math.floor(state.player.getDuration()||0)||state.duracao;
    if(!dur)continue;
    const nowTick=performance.now();
    if(state.last!==null&&state.lastTick!==null){
     const delta=current-state.last;
     const elapsed=Math.max(0,(nowTick-state.lastTick)/1000);
     // Aceita atrasos do navegador, mas rejeita saltos manuais no player.
     // Limite absoluto impede contar longos periodos com aba suspensa.
     if(delta>0&&elapsed>0&&elapsed<=8&&delta<=elapsed*1.25+0.75){
      const a=Math.floor(state.last),b=Math.ceil(current);
      for(let sec=a;sec<b&&sec<dur;sec++)if(sec>=0)state.seen.add(sec);
      state.watched=Math.min(dur,state.seen.size);
      state.percentual=100*state.watched/dur;
     }
    }
    state.last=current;
    state.lastTick=nowTick;
    if(state.busy||Date.now()-state.saved<5000)continue;
    state.saved=Date.now();
    await eadSavePlayerState(state,false);
   }
  },1000);
 }catch(e){

 }
}

    area.innerHTML=`<div class="ead-exam-result ${r.aprovado?'is-approved':'is-rejected'}"><div class="ead-result-icon">${r.aprovado?'✓':'!'}</div><div class="ead-result-body"><h3>${r.aprovado?'Parabéns, você foi aprovado!':'Resultado da avaliação'}</h3><div class="ead-result-score"><strong>${r.nota}%</strong><span>Nota obtida<br>Nota mínima: ${r.nota_minima}%</span></div><p>${r.aprovado?'Treinamento concluído com sucesso. Seu certificado está disponível em Meus Cursos.':'Você ainda não atingiu a nota mínima. Tentativas restantes: '+r.tentativas_restantes}</p>${r.aprovado?'':`<button type="button" class="btn" onclick="eadRefreshProva(${Number(id)})">Tentar novamente</button>`}</div></div>`;

let comunicadoSelecionado = null;

async function abrirComunicadoReal(id) {
    let comunicado = comunicadosPublicos.find(
        c => Number(c.id) === Number(id)
    );
    // Caso a Home ainda esteja carregando, buscar a lista diretamente da API.
    if (!comunicado) {
        try {
            const resposta = await fetch('/api/comunicados', {
                headers: { Authorization: 'Bearer ' + sessionStorage.getItem('intranet_token') }
            });
            if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
            const itens = await resposta.json();
            if (!Array.isArray(itens)) throw new Error('Resposta inesperada');
            comunicadosPublicos = itens;
            comunicado = itens.find(c => Number(c.id) === Number(id));
        } catch (erro) {
            console.error('Erro ao abrir comunicado:', erro);
            alert('Não foi possível carregar o comunicado. Tente novamente.');
            return;
        }
    }
    if (!comunicado) {
        alert('Comunicado não encontrado ou indisponível.');
        return;
    }
    comunicadoSelecionado = comunicado;
    page = 'comunicado-detalhe';
    render();
    window.scrollTo(0,0);
    registrarVisualizacaoDetalhe(comunicado);
}

async function registrarVisualizacaoDetalhe(comunicado) {
    try {
        const resposta = await fetch(
            '/api/comunicados/' + comunicado.id + '/visualizacao',
            {
                method: 'POST',
                headers: {
                    Authorization: 'Bearer ' +
                        sessionStorage.getItem('intranet_token')
                }
            }
        );

        if (!resposta.ok) return;

        const dados = await resposta.json();
        comunicado.visualizacoes = dados.visualizacoes;

        if (page === 'comunicado-detalhe' &&
            comunicadoSelecionado?.id === comunicado.id) {
            render();
        }
    } catch (erro) {
        console.error('Visualizacao nao registrada:', erro);
    }
}

let paginaComunicados = 1;
const comunicadosPorPagina = 10;

function atualizarPaginacaoComunicados() {
    const area = document.getElementById('content');
    if (!area || page !== 'comunicados') return;

    const artigos = [...area.querySelectorAll('article.card.news')];
    if (!artigos.length) return;

    const filtrados = artigos.filter(artigo => {
    if (!categoriaComunicados) return true;
    const id = Number(
        artigo.querySelector('button[onclick*="abrirComunicadoReal"]')
            ?.getAttribute('onclick')
            ?.match(/\d+/)?.[0]
    );
    const comunicado = comunicadosPublicos.find(x => Number(x.id) === id);
    return comunicado?.categoria === categoriaComunicados;
});

const totalPaginas = Math.max(1,
    Math.ceil(filtrados.length / comunicadosPorPagina));
    paginaComunicados = Math.min(Math.max(1,paginaComunicados),totalPaginas);

    artigos.forEach((artigo,i) => { const posicao = filtrados.indexOf(artigo);
        artigo.style.setProperty('display',
            posicao >= (paginaComunicados-1)*comunicadosPorPagina &&
            posicao >= 0 && posicao < paginaComunicados*comunicadosPorPagina
                ? 'flex'
                : 'none', 'important');
    });

    let navegacao = document.getElementById('paginacao-comunicados');

    if (!navegacao) {
        navegacao = document.createElement('div');
        navegacao.id = 'paginacao-comunicados';
        navegacao.style.cssText =
            'display:flex;justify-content:center;align-items:center;gap:12px;margin:22px 0;flex-wrap:wrap';

        const coluna = artigos[0].parentElement;
        coluna.appendChild(navegacao);
    }

    if (totalPaginas <= 1) {
        navegacao.innerHTML = '';
        return;
    }

    navegacao.innerHTML = `
        <button class="btn secondary"
            ${paginaComunicados===1?'disabled':''}
            onclick="mudarPaginaComunicados(${paginaComunicados-1})">
            Anterior
        </button>

        <span>Página ${paginaComunicados} de ${totalPaginas}</span>

        <button class="btn secondary"
            ${paginaComunicados===totalPaginas?'disabled':''}
            onclick="mudarPaginaComunicados(${paginaComunicados+1})">
            Próxima
        </button>
    `;
}

function mudarPaginaComunicados(numero) {
    paginaComunicados = numero;
    atualizarPaginacaoComunicados();
    window.scrollTo({top:0,behavior:'smooth'});
}

async function salvarNovoUsuario(event){
    event.preventDefault();

    const formulario = document.getElementById('formNovoUsuario');
    const aviso = document.getElementById('erroNovoUsuario');
    const botao = formulario.querySelector('button[type="submit"]');

    if(botao.disabled) return;

    const dados = Object.fromEntries(new FormData(formulario).entries());

    for(const chave of Object.keys(dados)){
        if(typeof dados[chave]==='string'){
            dados[chave]=dados[chave].trim();
            if(!dados[chave]) dados[chave]=null;
        }
    }

    dados.nivel_acesso = Number(dados.nivel_acesso);
    dados.tipo = Number(dados.tipo);
    dados.ativo = dados.ativo === 'true';

    botao.disabled = true;
    aviso.textContent = '';

    try{
        const usuarioId = formulario.dataset.usuarioId;
        if(usuarioId){
            delete dados.cpf;
        }

        const resposta = await fetch(
            usuarioId ? '/api/usuarios/' + encodeURIComponent(usuarioId) : '/api/usuarios',{
            method: usuarioId ? 'PUT' : 'POST',
            headers:{
                'Content-Type':'application/json',
                'Authorization':'Bearer '+sessionStorage.getItem('intranet_token')
            },
            body:JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        if(!resposta.ok){
            const detalhe = resultado.detail;
            throw new Error(typeof detalhe==='string'
                ? detalhe : JSON.stringify(detalhe || 'Erro ao cadastrar'));
        }

        closeModal();
        await carregarUsuariosReais();
        alert(usuarioId ? 'Usuário atualizado com sucesso!' : 'Usuário cadastrado com sucesso!');

    }catch(erro){
        aviso.textContent = erro.message;
    }finally{
        botao.disabled = false;
    }
}

async function dashAdminApi(caminho, metodo='GET', dados=null) {
    const token = sessionStorage.getItem('intranet_token');

    if (!token) {
        throw new Error('Sessao nao encontrada.');
    }

    const opcoes = {
        method: metodo,
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        }
    };

    if (dados !== null) {
        opcoes.body = JSON.stringify(dados);
    }

    const resposta = await fetch(
        '/api/dashboards/admin' + caminho,
        opcoes
    );

    const texto = await resposta.text();
    let resultado = {};

    try {
        resultado = texto ? JSON.parse(texto) : {};
    } catch(e) {
        resultado = {detail: texto};
    }

    if (!resposta.ok) {
        const detalhe = resultado.detail;

        let mensagem;

        if (Array.isArray(detalhe)) {
            mensagem = detalhe.map(e =>
                `${(e.loc || []).join('.')}: ${e.msg || JSON.stringify(e)}`
            ).join('\n');
        } else if (detalhe && typeof detalhe === 'object') {
            mensagem = JSON.stringify(detalhe, null, 2);
        } else {
            mensagem = String(detalhe || 'Erro na operacao.');
        }

        console.error('Erro API Dashboards:', {
            status: resposta.status,
            resposta: resultado,
            dadosEnviados: dados
        });

        throw new Error('HTTP ' + resposta.status + ': ' + mensagem);
    }

    return resultado;
}

        };

        dashAdminCarregado = true;

    } catch(e) {
        dashAdminErro = e.message;
    } finally {
        dashAdminCarregando = false;
        render();
    }
}

async function dashAdminSalvar(event) {
    event.preventDefault();

    const form = event.target;
    const f = new FormData(form);

    try {
        let caminho = '';
        let metodo = 'POST';
        let dados = {};

        if (dashAdminAba === 'caixinhas') {
            const id = f.get('id');

            caminho = id ? '/caixinhas/' + id : '/caixinhas';
            metodo = id ? 'PUT' : 'POST';

            dados = {
                nome:f.get('nome'),
                descricao:f.get('descricao'),
                icone:f.get('icone'),
                ordem:Number(f.get('ordem') || 0),
                ativo:f.get('ativo') === 'on'
            };

        } else if (dashAdminAba === 'dashboards') {

            const id = f.get('id');
            caminho = id ? '/dashboards/' + id : '/dashboards';
            metodo = id ? 'PUT' : 'POST';

            if (!id) {
                const arquivo = f.get('arquivo');

                if (!(arquivo instanceof File) || !arquivo.name.toLowerCase().match(/\.html?$/)) {
                    throw new Error('Selecione um arquivo HTML válido.');
                }

                const envio = new FormData();
                envio.append('nome', f.get('nome'));
                envio.append('descricao', f.get('descricao') || '');
                envio.append('arquivo', arquivo);

                await dashAdminImportarDashboard(envio);
                dashAdminErro = '';
                await dashAdminCarregar();
                alert('Dashboard importado com sucesso!');
                return;
            }

            const novoArquivo = f.get('arquivo');
            if (novoArquivo instanceof File && novoArquivo.name) {
                if (!/\.html?$/i.test(novoArquivo.name)) throw new Error('Selecione um arquivo HTML válido.');
                const envio = new FormData();
                envio.append('arquivo', novoArquivo);
                // Atualiza o conteúdo sem alterar código, vínculo ou permissões.
                await dashAdminSubstituirHtml(id, envio);
            }

            dados = id ? {
                nome:f.get('nome'),
                descricao:f.get('descricao'),
                ativo:dashAdminDados.dashboards.find(d=>Number(d.id)===Number(id))?.ativo ?? true
            } : {
                nome:f.get('nome'),
                descricao:f.get('descricao'),
                codigo:f.get('codigo')
            };

        } else if (dashAdminAba === 'vinculos') {

            caminho = '/vinculos';

            dados = {
                caixinha_id:Number(f.get('caixinha_id')),
                dashboard_id:Number(f.get('dashboard_id')),
                ordem:Number(f.get('ordem') || 0)
            };

        } else if (dashAdminAba === 'permissoes') {
            caminho = '/permissoes';
            const modalidade = f.get('modalidade');
            dados = {
                vinculo_id: Number(f.get('vinculo_id')),
                modalidade,
                usuario_id: modalidade === 'USUARIO' ? Number(f.get('usuario_id')) : null,
                cargo: modalidade === 'CARGO' ? f.get('cargo') : null,
                departamento: modalidade === 'DEPARTAMENTO' ? f.get('departamento') : null
            };
        }

        await dashAdminApi(caminho, metodo, dados);

        dashAdminErro = '';
        dashAdminCarregado = false;

        alert('Cadastro realizado com sucesso!');

        await dashAdminCarregar();

    } catch(e) {
        alert('Nao foi possivel salvar: ' + e.message);
    }
}

window.dashAdminMoverVinculo = async function(id, direcao) {
    if (window.dashAdminMovendoVinculo) return;

    const atual = dashAdminDados.vinculos.find(
        v => Number(v.id) === Number(id)
    );
    if (!atual) return;

    const grupo = dashAdminDados.vinculos
        .filter(v => Number(v.caixinha_id) === Number(atual.caixinha_id))
        .sort((a,b) =>
            Number(a.ordem) - Number(b.ordem) ||
            Number(a.id) - Number(b.id)
        );

    const indice = grupo.findIndex(v => Number(v.id) === Number(id));
    const destino = indice + direcao;

    if (indice < 0 || destino < 0 || destino >= grupo.length) return;

    // Troca os dashboards de posicao na mesma caixinha
    [grupo[indice], grupo[destino]] =
        [grupo[destino], grupo[indice]];

    window.dashAdminMovendoVinculo = true;

    try {
        // Grava a nova sequencia
        for (let i = 0; i < grupo.length; i++) {
            await dashAdminApi('/vinculos/' + grupo[i].id, 'PUT', {
                ordem: i
            });
        }

        dashAdminCarregado = false;
        await dashAdminCarregar();

    } catch(e) {
        alert('Erro ao reordenar dashboards: ' + e.message);
        dashAdminCarregado = false;
        await dashAdminCarregar();
    } finally {
        window.dashAdminMovendoVinculo = false;
    }
};

    const lista = [...dashAdminDados.caixinhas]
        .sort((a,b) => Number(a.ordem) - Number(b.ordem) || Number(a.id) - Number(b.id));

    const indice = lista.findIndex(c => Number(c.id) === Number(id));
    const destino = indice + direcao;

    if (indice < 0 || destino < 0 || destino >= lista.length) return;

    const atual = lista[indice];
    const vizinha = lista[destino];

    const dados = (c, ordem) => ({
        nome: c.nome,
        descricao: c.descricao || null,
        icone: c.icone || null,
        ordem: ordem,
        ativo: c.ativo
    });

    window.dashAdminMovendoCaixinha = true;

    try {
        // Reorganiza toda a lista para evitar ordens repetidas.
        [lista[indice], lista[destino]] = [lista[destino], lista[indice]];

        for (let i = 0; i < lista.length; i++) {
            await dashAdminApi(
                '/caixinhas/' + lista[i].id,
                'PUT',
                dados(lista[i], i)
            );

    } finally {

 const r=await fetch('/api/eventos-avisos'+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});

 if(!r.ok)throw Error('HTTP '+r.status+': '+(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data)));
 return data;
}

 const box=document.querySelector('.v12-notices');if(!box)return;
 const botoes=document.querySelectorAll('.v12-notice-filters button[data-filtro]');
 botoes.forEach(b=>{const ativo=b.dataset.filtro===eaFiltroMeusAvisos;b.classList.toggle('active',ativo);b.setAttribute('aria-pressed',String(ativo));});

  const prioridade=x=>x.exige_ciencia===true&&eaAvisoPendente(x)?1:0;
  const diferenca=prioridade(b)-prioridade(a);if(diferenca)return diferenca;
  const data=x=>Date.parse(x.publicado_em||x.criado_em||x.inicio||x.data_publicacao||'')||0;
  return data(b)-data(a);
 });
 const porPagina=4,totalPaginas=Math.max(1,Math.ceil(lista.length/porPagina));

 box.innerHTML=visiveis.length?visiveis.map(x=>`<button class="v12-notice" type="button" onclick="eaAbrirAviso(${Number(x.id||x.pid||x.publicacao_id)})"><span class="v12-dot-group" aria-label="${x.exige_ciencia&&eaAvisoPendente(x)?'Ciência obrigatória pendente':'Aviso'}"><span class="v12-red-dot" style="${eaAvisoPendente(x)?'':'background:#6f9d8a'}"></span>${x.exige_ciencia&&eaAvisoPendente(x)?'<span class="v12-red-dot"></span>':''}</span><span>${esc(x.titulo)}${x.exige_ciencia?' · Ciência obrigatória':''}</span></button>`).join(''):'<div class="v12-notice-placeholder">'+(eaFiltroMeusAvisos==='PENDENTES'?'Nenhum aviso pendente.':'Nenhum aviso disponível.')+'</div>';

 }
}

async function carregarPermissoesAdmin(){
    if(nivelAcesso !== 3) return;
    if(permissoesAdminDados.carregando) return;

    permissoesAdminDados.carregando = true;

    try {
        const token = sessionStorage.getItem('intranet_token');
        const headers = {'Authorization': 'Bearer ' + token};

        const urls = [
            '/api/admin/permissoes/usuarios',
            '/api/admin/permissoes/modulos',
            '/api/admin/permissoes/lista'
        ];

        const respostas = await Promise.all(
            urls.map(url => fetch(url, {headers}))
        );

        for(const resposta of respostas){
            if(!resposta.ok) {
                throw new Error('Erro HTTP ' + resposta.status);
            }
        }

        const dados = await Promise.all(
            respostas.map(r => r.json())
        );

        permissoesAdminDados.usuarios = dados[0];
        permissoesAdminDados.modulos = dados[1];
        permissoesAdminDados.permissoes = dados[2];
        permissoesAdminDados.carregado = true;

        if(page === 'admin' && adminTab === 'permissoes-admin'){
            render();
        }

    } catch(e) {
        console.error(e);
        alert('Erro ao carregar permissões: ' + e.message);
    } finally {
        permissoesAdminDados.carregando = false;
    }
}

window.alterarPermissaoAdmin = async function(usuarioId, moduloId, conceder){
    if(nivelAcesso !== 3) return;

    const token = sessionStorage.getItem('intranet_token');

    try {
        const resposta = await fetch(
            '/api/admin/permissoes/' + (conceder ? 'conceder' : 'revogar'),
            {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    usuario_id: usuarioId,
                    modulo_id: moduloId
                })
            }
        );

        if(!resposta.ok){
            const erro = await resposta.json().catch(() => ({}));
            throw new Error(erro.detail || 'Erro HTTP ' + resposta.status);
        }

        await carregarPermissoesAdmin();

    } catch(e){
        alert('Não foi possível alterar a permissão: ' + e.message);
    }
}

function telaPermissoesAdmin(){
    if(nivelAcesso !== 3){
        return '<div class="notice">Acesso não autorizado.</div>';
    }

    if(!permissoesAdminDados.carregado){
        setTimeout(carregarPermissoesAdmin, 0);
        return '<div class="card" style="padding:25px">Carregando permissões...</div>';
    }

    const d = permissoesAdminDados;

    let html = `
        <div class="card" style="padding:24px;margin-top:18px">
            <h2>Permissões Administrativas</h2>
            <p>Autorize funcionários de nível 2 a administrar módulos específicos.</p>
            <p><strong>Nível 3:</strong> acesso total.
            <strong>Nível 1:</strong> não recebe permissões adicionais.</p>
        </div>
    `;

    if(!d.usuarios.length){
        return html + '<div class="card">Nenhum funcionário nível 2 encontrado.</div>';
    }

    for(const usuario of d.usuarios){
        html += `
            <div class="card" style="padding:20px;margin-top:12px">
                <h3>${esc(usuario.nome)}</h3>
                <p>${esc(usuario.departamento || '')}
                ${usuario.cargo ? ' — ' + esc(usuario.cargo) : ''}</p>
        `;

        for(const modulo of d.modulos){
            const registro = d.permissoes.find(p =>
                p.usuario_id === usuario.id &&
                p.modulo_id === modulo.id
            );

            const autorizado = registro?.ativo === true;

            html += `
                <div style="display:flex;align-items:center;
                            justify-content:space-between;
                            gap:12px;padding:12px 0;
                            border-bottom:1px solid #ddd">
                    <span>${esc(modulo.nome)}</span>
                    <button type="button"
                        onclick="alterarPermissaoAdmin(${usuario.id},${modulo.id},${!autorizado})">
                        ${autorizado ? 'Revogar acesso' : 'Conceder acesso'}
                    </button>
                </div>
            `;
        }

        html += '</div>';
    }

    return html;
}

const geAPI = '/api/admin/gestores-equipes';
let geUsuarios = [];
let geVinculos = [];
let geCarregado = false;
let geGestorSelecionado = sessionStorage.getItem('geGestorSelecionado') || '';

async function geRequisicao(rota, metodo='GET', dados=null){
    const token = sessionStorage.getItem('intranet_token');
    const resposta = await fetch(geAPI + rota, {
        method: metodo,
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        },
        ...(dados ? {body: JSON.stringify(dados)} : {})
    });

    if(!resposta.ok){
        const erro = await resposta.json().catch(()=>({}));
        throw new Error(
            typeof erro.detail === 'string'
                ? erro.detail
                : 'Erro HTTP ' + resposta.status
        );
    }
    return resposta.json();
}

async function geCarregar(){
    try {
        const [usuarios, vinculos] = await Promise.all([
            geRequisicao('/usuarios'),
            geRequisicao('/vinculos')
        ]);
        geUsuarios = usuarios;
        geVinculos = vinculos;
        geCarregado = true;
        render();
    } catch(e){
        geCarregado = true;
        alert('Erro ao carregar Gestores e Equipes: ' + e.message);
        render();
    }
}

window.geFiltrarFuncionarios = function(texto){
    geBuscaFuncionario = texto;
    geFuncionarioSelecionado = '';

    const caixa = document.getElementById('geResultadosBusca');
    const escolhido = document.getElementById('geFuncionarioEscolhido');

    if(!caixa) return;
    if(escolhido) escolhido.textContent = '';

    const busca = geNormalizarNome(texto.trim());

    if(busca.length < 2){
        caixa.innerHTML = '';
        caixa.style.display = 'none';
        return;
    }

    const gestorId = Number(
        document.getElementById('geSelectGestor')?.value || 0
    );

    const encontrados = geUsuarios
        .filter(u =>
            Number(u.id) !== gestorId &&
            geNormalizarNome(u.nome).includes(busca)
        )
        .slice(0, 30);

    caixa.innerHTML = encontrados.length
        ? encontrados.map(u =>
            `<button type="button"
                onclick="geEscolherFuncionario(${Number(u.id)})">
                <strong>${esc(u.nome)}</strong>
<small style="display:block;color:#64748b;font-size:12px;margin-top:3px">
    Cargo: ${esc(u.cargo || 'Não informado')} |
    Depto: ${esc(u.departamento || 'Não informado')} |
    CC: ${esc(u.centro_custo || 'Não informado')}
</small>
            </button>`
          ).join('')
        : '<div class="ge-sem-resultado">Nenhum usuário encontrado.</div>';

    caixa.style.display = 'block';
};

    if(!usuario) return;

    geFuncionarioSelecionado = String(usuario.id);

    const campo = document.getElementById('geBuscaNome');
    const caixa = document.getElementById('geResultadosBusca');

window.geSalvarVinculo = async function(){
    const gestorId = Number(
        document.getElementById('geSelectGestor')?.value ||
        geGestorSelecionado
    );

    const funcionarioId = Number(geFuncionarioSelecionado);

    if(!gestorId || !funcionarioId){
        alert('Selecione o gestor e o funcionário.');
        return;
    }

    if(gestorId === funcionarioId){
        alert('Um usuário não pode ser gestor de si mesmo.');
        return;
    }

    const atual = geVinculos.find(v =>
        Number(v.funcionario_id) === funcionarioId
    );

    if(atual && Number(atual.gestor_id) !== gestorId){
        const anterior = geUsuarios.find(u =>
            Number(u.id) === Number(atual.gestor_id)
        );

        if(!confirm(
            'Este usuário já está vinculado a ' +
            (anterior?.nome || 'outro gestor') +
            '. Deseja transferi-lo para o gestor selecionado?'
        )) return;
    }

    try {
        await geRequisicao('/vincular', 'POST', {
            funcionario_id: funcionarioId,
            gestor_id: gestorId
        });

        geGestorSelecionado = String(gestorId);
        geFuncionarioSelecionado = '';

        await geCarregar();

    } catch(e){
        alert('Erro ao salvar vínculo: ' + e.message);
    }
};
window.geVincular = async function(funcionarioId){
    const seletor = document.getElementById('geSelectGestor');
    const gestorId = seletor?.value || geGestorSelecionado;

    if(!gestorId){
        alert('Selecione primeiro um gestor.');
        return;
    }

    geGestorSelecionado = gestorId;
    try {
        await geRequisicao('/vincular', 'POST', {
            funcionario_id: Number(funcionarioId),
            gestor_id: Number(gestorId)
        });
        await geCarregar();
    } catch(e){
        alert(e.message);
    }
};

window.geConfirmar = function(titulo, mensagem, textoBotao='Confirmar'){
    return new Promise(resolve => {
        const fundo = document.createElement('div');
        fundo.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px';

        const janela = document.createElement('div');
        janela.style.cssText = 'background:white;border-radius:12px;padding:25px;width:100%;max-width:420px;box-shadow:0 15px 45px rgba(0,0,0,.2)';

        const tituloEl = document.createElement('h3');
        tituloEl.textContent = titulo;

        const mensagemEl = document.createElement('p');
        mensagemEl.textContent = mensagem;

        const botoes = document.createElement('div');
        botoes.style.cssText = 'display:flex;justify-content:flex-end;gap:10px;margin-top:22px';

        const cancelar = document.createElement('button');
        cancelar.textContent = 'Cancelar';

        const confirmar = document.createElement('button');
        confirmar.textContent = textoBotao;
        confirmar.style.cssText = 'background:#0b2948;color:white;border:0;border-radius:7px;padding:10px 18px';

        cancelar.style.cssText = 'border:1px solid #cbd5e1;background:white;border-radius:7px;padding:10px 18px';

        const fechar = valor => {
            fundo.remove();
            resolve(valor);
        };

        cancelar.onclick = () => fechar(false);
        confirmar.onclick = () => fechar(true);

        botoes.append(cancelar, confirmar);
        janela.append(tituloEl, mensagemEl, botoes);
        fundo.appendChild(janela);
        document.body.appendChild(fundo);
    });
};

function treinEditorTemAlteracoes(form){
 if(!form)return false;
 return [...form.elements].some(e=>{
  if(!e.name || e.disabled)return false;
  if(e.type==='checkbox'||e.type==='radio')return e.checked!==e.defaultChecked;
  if(e.tagName==='SELECT'){
   const original=[...e.options].find(o=>o.defaultSelected)||e.options[0];
   return e.value!==(original?.value??'');
  }
  return e.value!==e.defaultValue;
 });
}

 }
 treinEditorAba=aba;

function treinPresencialAlternar(modalidade){
 const horarios=document.getElementById('trein-presencial-horarios');
 const total=document.getElementById('trein-presencial-total');
 if(horarios)horarios.style.display=modalidade==='PRESENCIAL'?'grid':'none';

function treinPresencialCalcular(){
 const f=document.getElementById('trein-admin-form');if(!f)return;
 const inicio=f.elements.hora_inicio?.value, fim=f.elements.hora_fim?.value;
 const saida=document.getElementById('trein-presencial-total');
 if(!inicio||!fim)return;
 const converter=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
 const intervalo=Number(f.elements.intervalo_min.value||0);
 const duracao=converter(fim)-converter(inicio)-intervalo;
 if(!Number.isFinite(intervalo)||intervalo<0||duracao<=0){if(saida)saida.textContent='Confira os horários e o intervalo.';return}
 f.elements.carga_horaria_min.value=duracao;
 if(saida)saida.textContent='Carga calculada: '+Math.floor(duracao/60)+'h'+String(duracao%60).padStart(2,'0')+'min';
}

async function treinAdminSalvarAula(ev){
  ev.preventDefault();
  const form=ev.currentTarget;
  const botao=form.querySelector('[type=submit]');
  const msg=document.getElementById('trein-aula-msg');

  if(!treinEditorCurso?.id){
    msg.textContent='Salve primeiro o curso.';
    return;
  }

  const dados={
    titulo:form.elements.titulo.value.trim(),
    descricao:form.elements.descricao.value.trim(),
    video_url:form.elements.video_url.value.trim(),
    duracao_minutos:Number(form.elements.duracao_minutos.value)
  };

  if(!Number.isInteger(dados.duracao_minutos)||dados.duracao_minutos<1){
    msg.textContent='Informe uma duração válida.';
    return;
  }

  botao.disabled=true;
  msg.textContent='Salvando aula...';

  try{
    const aulaId=form.elements.aula_id.value;
    const resultado=await eadRequest(
      '/admin/cursos/'+encodeURIComponent(treinEditorCurso.id)+'/aulas'+(aulaId?'/'+encodeURIComponent(aulaId):''),
      {
        method:aulaId?'PUT':'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(dados)
      }
    );
    const editando=!!form.elements.aula_id.value;
    form.reset();
    await treinAdminListarAulas();
    treinAdminAlternarFormulario(false);
    msg.textContent=editando?'Aula atualizada.':'Aula cadastrada.';
    // Após salvar, consulta a duração real pelo player oficial do YouTube.
    // O valor digitado é apenas provisório até a confirmação dos metadados.
    const videoId=treinYTId(dados.video_url);
    if(videoId){
      const aulaSalva=treinAdminAulasAtuais.find(a=>
        (aulaId&&Number(a.id)===Number(aulaId)) ||
        (!aulaId&&treinYTId(a.video_url||'')===videoId));
      if(aulaSalva){
        msg.textContent='Aula salva. Identificando automaticamente a duração do YouTube...';
        await treinAdminIdentificarDuracao(Number(aulaSalva.id));
      }else{
        msg.textContent='Aula salva. Use “Identificar duração” para confirmar o tempo do vídeo.';
      }
    }
  }catch(e){
    msg.textContent='Erro ao salvar: '+(e.message||e);
  }finally{
    botao.disabled=false;
  }
}

async function treinAdminListarAulas(){
 const area=document.getElementById('trein-aulas-lista');
 if(!area||!treinEditorCurso?.id)return;
 area.textContent='Carregando aulas...';
 try{
  const aulas=await eadRequest('/admin/cursos/'+encodeURIComponent(treinEditorCurso.id)+'/aulas');
  if(!Array.isArray(aulas)||!aulas.length){area.innerHTML='<p class="trein-aulas-vazio">Nenhuma aula cadastrada. Clique em + Adicionar aula.</p>';return;}
  treinAdminAulasAtuais=aulas;
  area.innerHTML=aulas.map((a,i)=>{
   const url=String(a.video_url||'');
   let seguro=false;
   try{const u=new URL(url);seguro=u.protocol==='https:';}catch(e){}
   const link=seguro?`<a class="btn secondary trein-aula-assistir" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Assistir</a>`:'';
   const duracao=a.duracao_segundos==null?'Duração não informada':Number(a.duracao_segundos)===60?'1min (verificar duração)':Math.floor(Number(a.duracao_segundos)/60)+'min '+String(Number(a.duracao_segundos)%60).padStart(2,'0')+'s';
   return `<div class="trein-aula-item"><span class="trein-aula-num">${i+1}</span><div class="trein-aula-info"><strong>${esc(a.titulo)}</strong><small>Vídeo · ${duracao}</small></div><div class="trein-aula-acoes">${link}${treinYTId(url)?`<button type="button" class="btn secondary trein-aula-assistir" onclick="treinAdminIdentificarDuracao(${Number(a.id)})">Identificar duração</button>`:""}<button type="button" class="btn secondary trein-aula-assistir" onclick="treinAdminEditarAula(${Number(a.id)})">Editar</button><button type="button" class="btn danger trein-aula-assistir" onclick="treinAdminExcluirAula(${Number(a.id)})">Excluir</button></div></div>`;
  }).join('');
 }catch(e){area.textContent='Erro ao carregar aulas: '+(e.message||e);}
}
// Identifica a duração real pelo player oficial do YouTube (sem chave de API).
// Alguns vídeos só disponibilizam metadados depois que a reprodução começa.
let treinYTCarregamento=null;
function treinYTId(url){
 try{const u=new URL(url);const h=u.hostname.toLowerCase().replace(/^www\./,'');
 if(h==='youtu.be')return /^[\w-]{11}$/.test(u.pathname.slice(1))?u.pathname.slice(1):null;
 if(['youtube.com','m.youtube.com','youtube-nocookie.com'].includes(h)){
 const v=u.searchParams.get('v')||(u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/)||[])[1];
 return /^[\w-]{11}$/.test(v||'')?v:null;
 }}catch(e){}return null;
}

 if(dados!==undefined){op.headers['Content-Type']='application/json';op.body=JSON.stringify(dados)}

 return d;
}

function avalDesenharRadar(){
 const root=document.getElementById('aval-radar-svg'),sel=document.getElementById('aval-radar-part');
 if(!root||!sel)return;
 const rows=(window.avalRadarDados||[]).filter(r=>String(r.participante_id)===sel.value);
 const unique=[...new Map(rows.map(r=>[r.criterio_id,r])).values()];
 if(unique.length<3){root.innerHTML='<p class="muted">O Radar precisa de pelo menos três itens cadastrados.</p>';return}
 const n=unique.length,cx=360,cy=172,R=112;
 const point=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
 const poly=arr=>arr.map((v,i)=>point(i,v).join(',')).join(' ');
 let s='<svg viewBox="0 0 720 355" role="img" aria-label="Radar de desempenho" style="display:block;width:100%;height:auto">';
 for(let v=20;v<=100;v+=20)s+=`<polygon points="${poly(unique.map(()=>v))}" fill="none" stroke="#d5dfea"/>`;
 unique.forEach((r,i)=>{
   const [x,y]=point(i,100),[tx,ty]=point(i,154);
   const words=String(r.titulo||'').split(/\s+/),lines=[''];
   for(const word of words){const last=lines.length-1;if((lines[last]+' '+word).trim().length>23&&lines[last]&&lines.length<3)lines.push(word);else lines[last]+=(lines[last]?' ':'')+word}
   const anchor=tx<cx-20?'end':tx>cx+20?'start':'middle';
   const firstY=ty-(lines.length-1)*7;
   s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#d5dfea"/><text x="${tx}" y="${firstY}" font-size="12" text-anchor="${anchor}" fill="#17314d">${lines.map((line,j)=>`<tspan x="${tx}" dy="${j?15:0}">${avalEsc(line)}</tspan>`).join('')}</text>`;
 });
 s+=`<polygon points="${poly(unique.map(r=>Number(r.meta_radar)||0))}" fill="#d8a332" fill-opacity=".10" stroke="#bd8721" stroke-width="2" stroke-dasharray="5 4"/>`;
 const legenda=['<span style="color:#bd8721">━━ Meta</span>'];
 for(const [tipo,cor,nome] of [['GESTOR','#2679c6','Gestor'],['AUTOAVALIACAO','#25845b','Autoavaliação']]){
  const values=unique.map(k=>rows.find(r=>r.criterio_id===k.criterio_id&&r.avaliador_tipo===tipo)?.resultado_radar);
  if(values.every(v=>v==null))continue;
  legenda.push(`<span style="color:${cor}">━━ ${nome}</span>`);
  if(values.some(v=>v==null)){values.forEach((v,i)=>{if(v!=null){const [x,y]=point(i,Number(v));s+=`<circle cx="${x}" cy="${y}" r="5" fill="${cor}"/>`}});continue}
  s+=`<polygon points="${poly(values.map(Number))}" fill="${cor}" fill-opacity=".12" stroke="${cor}" stroke-width="2.5"/>`;
 }
 root.innerHTML=s+'</svg><p style="text-align:center;font-size:13px;margin:0 0 6px">'+legenda.join(' &nbsp; ')+'</p>';
}
window.avalDesenharRadar=avalDesenharRadar;

function avalRadarRelatorio(itens,modalidade){
 const rows=itens.filter(x=>x.gestor||x.auto);if(rows.length<3)return '<p class="muted">Radar disponível quando houver pelo menos três critérios.</p>';
 const n=rows.length,W=900,H=660,cx=450,cy=320,R=220,rad=i=>-Math.PI/2+2*Math.PI*i/n;
 const pos=(i,v,rr=R)=>[cx+rr*(Number(v)/100)*Math.cos(rad(i)),cy+rr*(Number(v)/100)*Math.sin(rad(i))];
 const pts=vals=>vals.map((v,i)=>pos(i,v).map(z=>z.toFixed(1)).join(',')).join(' ');
 let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar comparativo de gestor, autoavaliação, média e valor esperado" style="display:block;width:100%;height:auto;min-height:500px;max-height:720px">`;
 for(let k=1;k<=5;k++)svg+=`<polygon points="${pts(rows.map(()=>k*20))}" fill="none" stroke="#d5e0ec" stroke-width="1"/>`;
 rows.forEach((r,i)=>{let [x,y]=pos(i,100),[tx,ty]=pos(i,127);svg+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#d5e0ec"/>`;let t=String(r.titulo||'').slice(0,26);svg+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" fill="#24415e" font-size="13" font-weight="600">${avalEsc(t)}</text>`});
 const series=[{nome:'Esperado',cor:'#202020',val:rows.map(x=>x.esperadoRadar),dash:'6 4'},{nome:'Gestor',cor:'#2477ca',val:rows.map(x=>x.gestorRadar),dash:''}];
 if(Number(modalidade)===180){series.push({nome:'Autoavaliação',cor:'#e59b29',val:rows.map(x=>x.autoRadar),dash:''},{nome:'Média (merge)',cor:'#28946b',val:rows.map(x=>x.mediaRadar),dash:''})}
 for(const item of series){if(item.val.some(v=>v==null))continue;svg+=`<polygon points="${pts(item.val)}" fill="${item.cor}" fill-opacity="${item.dash?0:'.06'}" stroke="${item.cor}" stroke-width="2.6" ${item.dash?'stroke-dasharray="6 4"':''}/>`;item.val.forEach((v,i)=>{let [x,y]=pos(i,v);svg+=`<circle cx="${x}" cy="${y}" r="3" fill="${item.cor}"/>`})}
 svg+='</svg>';return `<div style="margin-top:22px;border-top:1px solid #dce5ef;padding-top:15px"><h3 style="margin:0 0 8px">Gráfico Radar — Comparativo</h3><div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px">${series.map(z=>`<span><span style="display:inline-block;width:18px;border-top:3px ${z.dash?'dashed':'solid'} ${z.cor};vertical-align:middle;margin-right:5px"></span>${z.nome}</span>`).join('')}</div>${svg}<p class="muted" style="font-size:11px">Competências convertidas de 1–5 para escala 0–100. Indicadores numéricos: 100 quando a meta foi atingida e 0 caso contrário. A média representa gestor e autoavaliação com pesos iguais.</p></div>`;
}

function avalRenderMeus(){
 const el=document.getElementById('aval-meus');if(!el)return;
 // Avaliações 90° não geram autoavaliação: o funcionário recebe um cartão de relatório.
 const originais=avalListaMeus||[];
 const meusIds=new Set(originais.map(a=>Number(a.participante_id)));
 const somenteRelatorios=(avalRelatorios||[])
  .filter(r=>r.papel==='FUNCIONARIO'&&Number(r.modalidade)===90&&!meusIds.has(Number(r.participante_id)))
  .map(r=>({participante_id:r.participante_id,funcionario_id:r.funcionario_id,
   funcionario_nome:r.funcionario_nome,nome:r.ciclo_nome,modalidade:90,
   tipo:'RELATORIO',avaliacao_status:r.ciente_em?'CIENCIA_CONFIRMADA':r.liberado_em?'CONCLUIDA':'PENDENTE',
   relatorio_somente:true}));
 const dados=[...originais,...somenteRelatorios];
 const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const status=v=>norm(v).replace(/\s+/g,'_');
 const ciclos=[...new Set(dados.map(a=>String(a.nome)))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 const gestores=[...new Set(dados.map(a=>String(a.gestor_nome||'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 const op=(v,t,at)=>`<option value="${avalEsc(v)}" ${at===v?'selected':''}>${avalEsc(t)}</option>`;
 const fil=dados.filter(a=>{
  const r=a.relatorio_somente?(avalRelatorios||[]).find(x=>Number(x.participante_id)===Number(a.participante_id)):avalRelatorioDe(a);
  const f=avalFiltroMeus;
  return (!f.busca||norm(a.funcionario_nome).includes(norm(f.busca)))
   &&(f.status==='TODOS'||status(a.avaliacao_status)===status(f.status))
   &&(f.tipo==='TODOS'||a.tipo===f.tipo||(a.relatorio_somente&&f.tipo==='GESTOR'))
   &&(f.ciclo==='TODOS'||a.nome===f.ciclo)
   &&(f.auto==='TODOS'||(a.tipo==='GESTOR'&&Number(a.modalidade)===180&&status(a.autoavaliacao_status||'NAO_DISPONIVEL')===status(f.auto)))
   &&(!f.modalidade||f.modalidade==='TODOS'||Number(a.modalidade)===Number(f.modalidade))
   &&(!f.relatorio||f.relatorio==='TODOS'||(r&&avalSituacaoRelatorio(r)===f.relatorio))
   &&(!f.gestor||f.gestor==='TODOS'||String(a.gestor_nome||'')===f.gestor);
 });
 const qtd=chave=>dados.filter(a=>status(a.avaliacao_status)===chave).length;
 const f=avalFiltroMeus;
 const controles=`<div class="aval-meus-resumo"><button type="button" class="aval-resumo-btn ${f.status==='TODOS'?'ativo':''}" onclick="avalAlterarFiltroMeus('status','TODOS')"><b>${dados.length}</b> Total</button><button type="button" class="aval-resumo-btn ${f.status==='PENDENTE'?'ativo':''}" onclick="avalAlterarFiltroMeus('status','PENDENTE')"><b>${qtd('pendente')}</b> Pendentes</button><button type="button" class="aval-resumo-btn ${f.status==='EM_ANDAMENTO'?'ativo':''}" onclick="avalAlterarFiltroMeus('status','EM_ANDAMENTO')"><b>${qtd('em_andamento')}</b> Em andamento</button><button type="button" class="aval-resumo-btn ${f.status==='CONCLUIDA'?'ativo':''}" onclick="avalAlterarFiltroMeus('status','CONCLUIDA')"><b>${qtd('concluida')}</b> Concluídas</button></div><div class="aval-meus-filtros"><label>Funcionário<input id="aval-filtro-busca" type="search" placeholder="Pesquisar funcionário" value="${avalEsc(f.busca)}" oninput="avalAlterarFiltroMeus('busca',this.value)"></label><label>Status<select onchange="avalAlterarFiltroMeus('status',this.value)">${op('TODOS','Todos',f.status)}${op('PENDENTE','Pendente',f.status)}${op('EM_ANDAMENTO','Em andamento',f.status)}${op('CONCLUIDA','Concluída',f.status)}</select></label><label>Tipo<select onchange="avalAlterarFiltroMeus('tipo',this.value)">${op('TODOS','Todos',f.tipo)}${op('GESTOR','Pelo gestor',f.tipo)}${op('AUTOAVALIACAO','Autoavaliação',f.tipo)}</select></label><label>Modalidade<select onchange="avalAlterarFiltroMeus('modalidade',this.value)">${op('TODOS','Todas',f.modalidade||'TODOS')}${op('90','90°',f.modalidade||'TODOS')}${op('180','180°',f.modalidade||'TODOS')}</select></label><label>Ciclo<select onchange="avalAlterarFiltroMeus('ciclo',this.value)">${op('TODOS','Todos',f.ciclo)}${ciclos.map(c=>op(c,c,f.ciclo)).join('')}</select></label></div><details class="aval-filtros-avancados"><summary>Mais filtros</summary><div class="aval-meus-filtros aval-filtros-extra"><label>Autoavaliação 180°<select onchange="avalAlterarFiltroMeus('auto',this.value)">${op('TODOS','Todas',f.auto)}${op('PENDENTE','Pendente',f.auto)}${op('EM_ANDAMENTO','Em andamento',f.auto)}${op('CONCLUIDA','Concluída',f.auto)}${op('NAO_DISPONIVEL','Não disponível',f.auto)}</select></label><label>Relatório<select onchange="avalAlterarFiltroMeus('relatorio',this.value)">${op('TODOS','Todos',f.relatorio||'TODOS')}${['Aguardando conclusão','Aguardando liberação','Liberado','Ciência confirmada'].map(v=>op(v,v,f.relatorio||'TODOS')).join('')}</select></label>${gestores.length?`<label>Gestor<select onchange="avalAlterarFiltroMeus('gestor',this.value)">${op('TODOS','Todos',f.gestor||'TODOS')}${gestores.map(v=>op(v,v,f.gestor||'TODOS')).join('')}</select></label>`:''}</div></details><p class="muted" style="font-size:12px;margin:0 0 12px">Exibindo ${fil.length} de ${dados.length} avaliações.</p>`;
 const cards=fil.map(a=>{
  const r=a.relatorio_somente?(avalRelatorios||[]).find(x=>Number(x.participante_id)===Number(a.participante_id)):avalRelatorioDe(a);
  if(a.relatorio_somente)return `<article class="card aval-card-v4" data-aval-status="${avalEsc(a.avaliacao_status)}" data-aval-relatorio="${r?avalEsc(avalSituacaoRelatorio(r)):''}"><span class="tag">Relatório da avaliação 90°</span><h3>${avalEsc(a.nome)} · 90°</h3><p><b>${avalEsc(a.funcionario_nome)}</b></p><p class="aval-relatorio-status"><b>Relatório:</b> ${avalEsc(avalSituacaoRelatorio(r))}</p>${avalAcoesRelatorio(r)}</article>`;
  const auto=a.tipo==='GESTOR'&&Number(a.modalidade)===180?`<p class="aval-auto-situacao"><b>Autoavaliação:</b> ${avalEsc(a.autoavaliacao_status||'Não disponível')}</p>`:'';
  const rel=r?`<p class="aval-relatorio-status"><b>Relatório:</b> ${avalEsc(avalSituacaoRelatorio(r))}</p>`:'';
  return `<article class="card aval-card-v4" data-aval-status="${avalEsc(a.avaliacao_status)}" data-aval-relatorio="${r?avalEsc(avalSituacaoRelatorio(r)):''}"><span class="tag">${a.tipo==='GESTOR'?'Avaliação pelo gestor':'Autoavaliação'}</span><h3>${avalEsc(a.nome)} · ${avalEsc(a.modalidade)}°</h3><p><b>${avalEsc(a.funcionario_nome)}</b></p><p>${avalData(a.data_inicio)} a ${avalData(a.data_fim)}</p><p><strong>${avalEsc(a.avaliacao_status)}</strong></p>${auto}${rel}<div class="aval-card-acoes"><button type="button" class="btn secondary" onclick="avalAbrirMinha(${Number(a.avaliacao_id)})">${a.avaliacao_status==='CONCLUIDA'?'Consultar avaliação':'Responder'}</button></div>${avalAcoesRelatorio(r)}</article>`;
 }).join('');
 el.innerHTML=controles+(fil.length?`<div class="grid aval-grid-v4">${cards}</div>`:'<div class="empty">Nenhuma avaliação encontrada para os filtros selecionados.</div>');
}
function avalAlterarFiltroMeus(chave,valor){avalFiltroMeus[chave]=valor;if(chave==='auto'&&valor!=='TODOS'){avalFiltroMeus.status='TODOS';avalFiltroMeus.tipo='GESTOR';}avalRenderMeus();if(chave==='busca'){const novo=document.getElementById('aval-filtro-busca');if(novo){novo.focus();try{novo.setSelectionRange(valor.length,valor.length)}catch(e){}}}}
async function avalCarregarMeus(){const el=document.getElementById('aval-meus');if(!el)return;try{[avalListaMeus,avalRelatorios]=await Promise.all([avalApi('/meus'),avalApi('/relatorios')]);avalRenderMeus()}catch(e){el.innerHTML='<div class="notice">'+avalEsc(e.message)+'</div>'}}
const avalGuiaNotas=`<details class="aval-guia-notas" open><summary>Entenda as notas de 1 a 5 e as metas <span style="font-weight:400">(clique para recolher)</span></summary><div class="aval-guia-conteudo"><div><b>1 — Muito abaixo do esperado:</b> desempenho muito inferior ao necessário.</div><div><b>2 — Abaixo do esperado:</b> precisa melhorar em pontos importantes.</div><div><b>3 — Atende ao esperado:</b> cumpre o padrão definido.</div><div><b>4 — Acima do esperado:</b> supera o padrão com frequência.</div><div><b>5 — Excelente:</b> desempenho excepcional e consistente.</div><p><b>Meta da competência:</b> é a nota mínima esperada para aquele item (por exemplo, 3). Notas 1 e 2 exigem comentário ao concluir.</p><p><b>Indicador numérico:</b> informe o resultado real, não uma nota de 1 a 5. Exemplo: meta de absenteísmo &lt; 3%; resultado de 2% atinge a meta, mas 4% não. O sistema registra 100 quando atinge e 0 quando não atinge.</p></div></details>`;
async function avalAbrirMinha(id){try{const d=await avalApi('/meus/'+id);const a=d.avaliacao,fechada=a.status==='CONCLUIDA';modal(`<h2>${a.tipo==='GESTOR'?'Avaliação do gestor':'Autoavaliação'}</h2>${avalGuiaNotas}<form id="aval-respostas-form" onsubmit="avalSalvarMinhas(event,${id})">${d.criterios.map(k=>`<div class="card" data-aval-item="${k.id}" data-tipo="${k.tipo}" style="margin-bottom:12px"><b>${avalEsc(k.titulo)}</b> <span class="tag">${k.tipo==='META'?'Indicador numérico':'Competência'}</span><p>${avalEsc(k.descricao||'')}</p>${k.tipo==='META'?`<p>Meta: <b>${avalEsc(k.operador_meta||'>=')} ${avalNum(k.meta_valor)} ${avalEsc(k.meta_unidade||'')}</b></p><p style="font-size:12px;color:#526b82;margin:4px 0 8px">Informe o valor real apurado por você. O sistema compara com a meta e registra 100 se atingida ou 0 se não atingida. Funcionário e gestor preenchem separadamente. <b>Se a meta não for atingida, o comentário será obrigatório para concluir.</b></p><label>Resultado alcançado<input type="number" step="any" min="0" name="resultado_${k.id}" value="${k.resultado_alcancado??''}" ${fechada?'disabled':''}></label>${k.percentual_atingimento!=null?`<p><strong>${Number(k.percentual_atingimento)===100?'✓ Meta atingida':'✗ Meta não atingida'}</strong></p>`:''}`:`<p>Nota mínima esperada: <b>${k.competencia_meta??3}</b></p><label>Nota (1 a 5)<select name="nota_${k.id}" ${fechada?'disabled':''}><option value="">Selecione</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(k.nota)===n?'selected':''}>${n} — ${['Muito abaixo do esperado','Abaixo do esperado','Atende ao esperado','Acima do esperado','Excelente'][n-1]}</option>`).join('')}</select></label>`}<label>Comentário<textarea name="comentario_${k.id}" ${fechada?'disabled':''}>${avalEsc(k.comentario||'')}</textarea></label></div>`).join('')}${fechada?'<p class="tag">Avaliação concluída</p>':`<div class="row"><button class="btn" type="submit">Salvar rascunho</button><button class="btn secondary" type="button" onclick="avalConcluirMinha(${id})">Concluir avaliação</button></div>`}<button type="button" class="btn secondary" onclick="closeModal()">Fechar</button></form>`)}catch(e){avalMsg(e)}}
async function avalSalvarMinhas(e,id){e.preventDefault();try{await avalEnviarRespostas(id);closeModal();avalCarregarMeus();avalAviso('Respostas salvas.')}catch(x){avalMsg(x)}}
async function avalEnviarRespostas(id){const form=document.getElementById('aval-respostas-form');if(!form)throw Error('Formulário não encontrado');const f=new FormData(form),ids=[...form.querySelectorAll('[data-aval-item]')].map(e=>Number(e.dataset.avalItem));const respostas=ids.map(k=>({criterio_id:k,nota:f.get('nota_'+k)?Number(f.get('nota_'+k)):null,comentario:String(f.get('comentario_'+k)||''),resultado_alcancado:f.has('resultado_'+k)&&f.get('resultado_'+k)!==''?Number(f.get('resultado_'+k)):null}));return avalApi('/meus/'+id+'/respostas','PUT',{respostas})}
async function avalConcluirMinha(id){const form=document.getElementById('aval-respostas-form');if(form){for(const item of form.querySelectorAll('[data-aval-item][data-tipo=CRITERIO]')){const n=Number(item.querySelector('select[name^=nota_]')?.value);const c=item.querySelector('textarea[name^=comentario_]');if((n===1||n===2)&&!c?.value.trim()){avalAviso('Justifique as notas 1 e 2 antes de concluir.','erro');c?.focus();return;}}}if(form){for(const item of form.querySelectorAll('[data-aval-item][data-tipo=META]')){const input=item.querySelector('input[name^=resultado_]');const comentario=item.querySelector('textarea[name^=comentario_]');const valor=input?.value.trim();if(valor!==''&&valor!=null){const texto=item.querySelector('p')?.textContent||'';const match=texto.match(/Meta:\s*(>=|<=|>|<|=)\s*([\d.,]+)/);if(match){const alvo=Number(match[2].replace(',','.'));const n=Number(valor);const op=match[1];const atingida=op==='>='?n>=alvo:op==='>'?n>alvo:op==='<='?n<=alvo:op==='<'?n<alvo:n===alvo;if(!atingida&&!comentario?.value.trim()){avalAviso('Justifique a meta não atingida antes de concluir.','erro');comentario?.focus();return;}}}}}if(!await avalConfirm('Concluir esta avaliação? Não será possível editar depois.'))return;try{await avalEnviarRespostas(id);await avalApi('/meus/'+id+'/concluir','POST');closeModal();avalCarregarMeus();avalAviso('Avaliação concluída.')}catch(e){avalMsg(e)}}

// Importacao de funcionarios - modulo isolado, somente validacao
function telaImportacaoFuncionarios(){
    return `<section class="card" style="margin-top:18px">
      <h2>Importação de Funcionários</h2>
      <p class="muted">Selecione o Excel oficial (máximo de 2.000 funcionários).</p>
      <div class="notice">Valide o Excel antes de confirmar. A gravação só acontece após confirmação explícita.</div>
      <div class="toolbar">
        <input id="imp-arquivo" type="file" accept=".xlsx" aria-label="Arquivo Excel" onchange="window._impHash=null;window._impArquivo=null;document.getElementById('imp-confirmar').style.display='none'">
        <button class="btn" onclick="validarImportacaoFuncionarios()">Validar Excel</button>
        <button id="imp-confirmar" class="btn" style="display:none" onclick="confirmarImportacaoFuncionarios()">Confirmar importação</button>
      </div>
      <div id="imp-resultado" aria-live="polite">Aguardando arquivo.</div>
      <div style="margin-top:22px">
        <div class="spaced"><h3>Histórico de importações</h3><button class="btn secondary" onclick="carregarHistoricoImportacoes()">Atualizar histórico</button></div>
        <div id="imp-historico">Clique em Atualizar histórico para consultar as últimas 50 importações.</div>
      </div>
    </section>`;
}
async function validarImportacaoFuncionarios(){
    const arquivo=document.getElementById('imp-arquivo')?.files?.[0];
    const destino=document.getElementById('imp-resultado');
    if(!arquivo){destino.textContent='Selecione um arquivo .xlsx.';return;}
    const token=sessionStorage.getItem('intranet_token');
    if(!token){destino.textContent='Sessão expirada. Entre novamente.';return;}
    const dados=new FormData();dados.append('arquivo',arquivo);
    window._impHash=null;window._impArquivo=null;
    document.getElementById('imp-confirmar').style.display='none';
    destino.textContent='Validando arquivo...';
    try{
        const resposta=await fetch('/api/admin/importacao-funcionarios/validar',{
            method:'POST',headers:{Authorization:'Bearer '+token},body:dados
        });
        const resultado=await resposta.json();
        if(!resposta.ok)throw new Error(typeof resultado.detail==='string'?resultado.detail:'Erro de validação');
        const erros=resultado.erros||[];
        window._impErros=erros;
        if(resultado.total>0 && resultado.rejeitados===0 && resultado.hash_validado && resultado.pode_confirmar){
          window._impHash=resultado.hash_validado;window._impArquivo=arquivo;
          document.getElementById('imp-confirmar').style.display='';
        }
        destino.innerHTML=`<div class="grid" style="margin:16px 0">
          <div class="card"><h3>${Number(resultado.total)||0}</h3><p>Linhas analisadas</p></div>
          <div class="card"><h3>${Number(resultado.validos)||0}</h3><p>Válidas</p></div>
          <div class="card"><h3>${Number(resultado.rejeitados)||0}</h3><p>Rejeitadas</p></div>
          <div class="card"><h3>${Number(resultado.novos)||0}</h3><p>Novos</p></div>
          <div class="card"><h3>${Number(resultado.atualizar)||0}</h3><p>Para atualizar</p></div>
          <div class="card"><h3>${Number(resultado.sem_alteracoes)||0}</h3><p>Sem alterações</p></div>
          </div><p class="notice">${esc(resultado.mensagem||'Validação concluída, sem gravação.')}</p>
          <div style="margin:12px 0"><h3>Alterações identificadas</h3>
          <div style="max-height:240px;overflow:auto"><table style="width:100%;text-align:left"><thead><tr><th>Funcionário</th><th>Campo</th><th>Atual</th><th>Excel</th></tr></thead><tbody>
          ${(resultado.detalhes_alteracoes||[]).flatMap(p=>(p.alteracoes||[]).map(a=>`<tr><td>${esc(p.nome)}</td><td>${esc(a.campo)}</td><td>${esc(a.anterior)}</td><td>${esc(a.novo)}</td></tr>`)).join('')||'<tr><td colspan="4">Nenhuma alteração identificada.</td></tr>'}
          </tbody></table></div></div>
          <div class="spaced"><h3>Ocorrências (${erros.length})</h3>
          <button class="btn secondary" onclick="baixarErrosImportacao()">Baixar erros (CSV)</button></div>
          <div style="max-height:380px;overflow:auto"><table style="width:100%;text-align:left">
          <thead><tr><th>Linha</th><th>CPF</th><th>Campo</th><th>Problema</th></tr></thead><tbody>
          ${erros.map(e=>`<tr><td>${Number(e.linha)||0}</td><td>${esc(e.cpf)}</td><td>${esc(e.campo)}</td><td>${esc(e.mensagem)}</td></tr>`).join('')||'<tr><td colspan="4">Nenhum erro.</td></tr>'}
          </tbody></table></div>`;
    }catch(e){destino.textContent='Falha: '+e.message;}
}
async function confirmarImportacaoFuncionarios(){
    const arquivo=document.getElementById('imp-arquivo')?.files?.[0];
    const hash=window._impHash;
    const destino=document.getElementById('imp-resultado');
    if(!arquivo || arquivo!==window._impArquivo || !hash){alert('Valide novamente o arquivo antes de confirmar.');return;}
    if(!confirm('ATENÇÃO: esta operação vai gravar os funcionários no banco e atualizar os vínculos de gestores. Deseja confirmar a importação?'))return;
    const botao=document.getElementById('imp-confirmar');
    botao.disabled=true;botao.textContent='Importando...';
    try{
      const dados=new FormData();dados.append('arquivo',arquivo);dados.append('hash_validado',hash);
      const token=sessionStorage.getItem('intranet_token');
      const resposta=await fetch('/api/admin/importacao-funcionarios/confirmar',{method:'POST',headers:{Authorization:'Bearer '+token},body:dados});
      const resultado=await resposta.json();
      if(!resposta.ok)throw new Error(typeof resultado.detail==='string'?resultado.detail:'Falha na importação');
      destino.textContent='Importação concluída: '+resultado.inseridos+' novos, '+resultado.atualizados+' atualizados, '+resultado.sem_alteracoes+' sem alterações e '+resultado.vinculos_criados+' vínculos de gestores criados.';
      window._impHash=null;window._impArquivo=null;
      botao.style.display='none';
      carregarHistoricoImportacoes();
    }catch(e){alert('Importação não concluída: '+e.message);}
    finally{botao.disabled=false;botao.textContent='Confirmar importação';}
}
async function carregarHistoricoImportacoes(){
    const destino=document.getElementById('imp-historico');
    if(!destino)return;
    destino.textContent='Consultando histórico...';
    try{
      const token=sessionStorage.getItem('intranet_token');
      const resposta=await fetch('/api/admin/importacao-funcionarios/historico',{headers:{Authorization:'Bearer '+token}});
      const dados=await resposta.json();
      if(!resposta.ok)throw new Error(typeof dados.detail==='string'?dados.detail:'Erro ao consultar histórico');
      const linhas=dados.historico||[];
      if(!linhas.length){destino.textContent='Nenhuma importação registrada.';return;}

     if(!r.ok)throw new Error('HTTP '+r.status);
     const dados=await r.json();
     const nascimento=Array.isArray(dados.nascimento)?dados.nascimento:[];
     const empresa=Array.isArray(dados.empresa)?dados.empresa:[];
     if(nascimento.length||(v12DataAteHoje(iso)&&empresa.length))dias.add(dia);
    }catch(e){falhas++;}
   })());
  }
  await Promise.all(tarefas);
  if(req!==v12BirthMonthRequestId)return;
 }
 if(falhas===0)v12BirthMonthCache.set(chave,{dias});
 if(req===v12BirthMonthRequestId&&calendarVisible.getFullYear()===ano&&calendarVisible.getMonth()+1===mes){
  // Mesmo com falhas, exibe apenas os dias efetivamente confirmados.
  if(falhas)v12BirthMonthCache.set(chave,{dias});
  calendarDraw();
 }
}

async function carregarFotosAniversariantes(requestId){
 const token=sessionStorage.getItem('intranet_token');
 if(!token)return;
 const imgs=Array.from(document.querySelectorAll('#v12-birth-content img[data-foto-aniversariante]'));
 await Promise.all(imgs.map(async img=>{
  const id=img.dataset.fotoAniversariante;
  try{
   let url=cacheFotosUsuarios.get(id);
   if(!url){
    const r=await fetch('/api/admin/usuarios/'+encodeURIComponent(id)+'/foto',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(!r.ok)return;
    const blob=await r.blob();
    if(!blob.type.startsWith('image/'))return;
    url=URL.createObjectURL(blob);
    cacheFotosUsuarios.set(id,url);
   }
   if(requestId!==v12BirthdayRequestId||!img.isConnected)return;
   img.onload=()=>{img.hidden=false;const initials=img.nextElementSibling;if(initials)initials.hidden=true;};
   img.onerror=()=>{img.hidden=true;};
   img.src=url;
  }catch(e){console.warn('Foto do aniversariante indisponivel:',id,e);}
 }));
}

const cacheFotosUsuarios = new Map();

async function carregarFotosGridUsuarios(){
    const token = sessionStorage.getItem('intranet_token');
    if(!token) return;

    const imagens = document.querySelectorAll(
        'img[data-foto-usuario]'
    );

    await Promise.all(Array.from(imagens).map(async img => {
        const id = img.dataset.fotoUsuario;
        if(!id) return;

        try {
            if(cacheFotosUsuarios.has(id)){
                img.src = cacheFotosUsuarios.get(id);
                return;
            }

            const resposta = await fetch(
                '/api/admin/usuarios/' + encodeURIComponent(id) + '/foto',
                {
                    headers: {'Authorization': 'Bearer ' + token},
                    cache: 'no-store'
                }
            );

            if(!resposta.ok) return;

            const blob = await resposta.blob();
            if(!blob.type.startsWith('image/')) return;

            const url = URL.createObjectURL(blob);
            cacheFotosUsuarios.set(id, url);
            img.src = url;

        } catch(erro) {
            console.error('Erro ao carregar foto do usuário:', id, erro);
        }
    }));
}

            if(p.tipo === 'NOTA_1_5' || p.tipo === 'NOTA_0_10'){

                    <label><input type="radio" name="${nome}" value="false"> Não</label>

            }
            else if(p.tipo === 'ESCOLHA_UNICA' || p.tipo === 'MULTIPLA_ESCOLHA'){
                const alternativas = p.alternativas || [];
                const tipoInput = p.tipo === 'ESCOLHA_UNICA' ? 'radio' : 'checkbox';

                campo = alternativas.map(a =>
                    `<label style="display:block;margin:12px 0">
                        <input type="${tipoInput}" name="${nome}"

                    placeholder="Digite sua resposta"></textarea>`;
            }
            else {

            }

            return `<div class="pesq-pergunta">
                <h3>${indice + 1}. ${titulo}${obrigatoria}</h3>

            'ESCOLHA_UNICA','MULTIPLA_ESCOLHA','TEXTO'
        ];

        const habilitado = perguntas.length > 0 &&
            perguntas.every(p =>
                tiposValidos.includes(p.tipo) &&
                (!['ESCOLHA_UNICA','MULTIPLA_ESCOLHA'].includes(p.tipo) ||

async function enviarPesquisaColaborador(id){
    const botao = document.querySelector('.pesq-form-actions .pesq-action:not(.secondary)');
    const respostas = [];

    try {
        if(botao && botao.disabled) return;

        const pesquisa = await requisicaoPesquisas('/api/pesquisas/' + id);

        for(const pergunta of pesquisa.perguntas || []){
            const nome = 'pergunta_' + Number(pergunta.id);
            let valor = null;

            if(['NOTA_1_5','NOTA_0_10','ESCOLHA_UNICA'].includes(pergunta.tipo)){
                const selecionada = document.querySelector(
                    'input[name="' + nome + '"]:checked'
                );
                if(selecionada) valor = Number(selecionada.value);
            }
            else if(pergunta.tipo === 'SIM_NAO'){
                const selecionada = document.querySelector(
                    'input[name="' + nome + '"]:checked'
                );
                if(selecionada) valor = selecionada.value === 'true';
            }
            else if(pergunta.tipo === 'MULTIPLA_ESCOLHA'){
                const selecionadas = document.querySelectorAll(
                    'input[name="' + nome + '"]:checked'
                );
                if(selecionadas.length){
                    valor = Array.from(selecionadas).map(el => Number(el.value));
                }
            }
            else if(pergunta.tipo === 'TEXTO'){
                const campo = document.querySelector(
                    'textarea[name="' + nome + '"]'
                );
                if(campo && campo.value.trim()){
                    valor = campo.value.trim();
                }
            }
            else {
                throw new Error('Tipo de pergunta não reconhecido.');
            }

            if(valor === null){
                if(pergunta.obrigatoria){
                    throw new Error('Responda todas as perguntas obrigatórias.');
                }
                continue;
            }

            respostas.push({
                pergunta_id: Number(pergunta.id),
                valor
            });
        }

        if(!respostas.length){
            throw new Error('Informe pelo menos uma resposta antes de enviar.');
        }

        if(botao) botao.disabled = true;

        await requisicaoPesquisas(
            '/api/pesquisas/' + id + '/enviar',
            'POST',
            {respostas}
        );

        closeModal();
        avalAviso('Pesquisa respondida com sucesso!');

        if(typeof carregarPesquisasColaborador === 'function'){
            await carregarPesquisasColaborador();
        }
    }
    catch(erro){
        avalAviso('Não foi possível enviar: ' + erro.message, 'erro');
        if(botao) botao.disabled = false;
    }
}

function tokenPesquisas(){
    const token = sessionStorage.getItem('intranet_token');
    if(!token) throw new Error('Sua sessão expirou. Entre novamente na intranet.');
    return token;
}

async function requisicaoPesquisas(url, metodo='GET', corpo=null){
    const headers = {'Authorization':'Bearer '+tokenPesquisas()};
    const op = {method:metodo, headers};
    if(corpo !== null){
        headers['Content-Type'] = 'application/json';
        op.body = JSON.stringify(corpo);
    }
    const resp = await fetch(url, op);
    const texto = await resp.text();
    let dados = {};
    try { dados = texto ? JSON.parse(texto) : {}; } catch(_) { dados = {detail:texto}; }
    if(!resp.ok){
        const detalhe = dados.detail || dados.message || ('Erro HTTP '+resp.status);
        throw new Error(typeof detalhe === 'string' ? detalhe : JSON.stringify(detalhe));
    }
    return dados;
}
