async function criarPesquisaPeloFormulario(event){
    event.preventDefault();
    const form = event.currentTarget;
    const botao = document.getElementById('btnCriarPesquisa');
    const feedback = document.getElementById('feedbackNovaPesquisa');
    const fd = new FormData(form);
    const titulo = String(fd.get('titulo') || '').trim();
    if(!titulo){ feedback.textContent='Informe o título da pesquisa.'; return; }
    const inicio = String(fd.get('inicio_em') || '');
    const fim = String(fd.get('encerramento_em') || '');
    if(inicio && fim && new Date(fim) <= new Date(inicio)){
        feedback.textContent='A data de encerramento deve ser posterior à data de início.';
        return;
    }
    const payload = {
        titulo,
        descricao: String(fd.get('descricao') || '').trim() || null,
        anonima: fd.get('anonima') === 'true',
        enviar_whatsapp: fd.has('enviar_whatsapp'),
        inicio_em: inicio ? new Date(inicio).toISOString() : null,
        encerramento_em: fim ? new Date(fim).toISOString() : null
    };
    botao.disabled = true;
    feedback.textContent = 'Salvando no PostgreSQL...';
    try{
        const resultado = await requisicaoPesquisas('/api/pesquisas','POST',payload);
        pesquisaAdminAtual = resultado.id;
        pesquisaOrdemAtual = 1;
        pesquisaPerguntasAdicionadas = 0;
        pesquisaPublicoAdicionado = false;
        abrirEditorPerguntasPesquisa(resultado.id, titulo);
        carregarPesquisasAdmin();
    }catch(erro){
        feedback.textContent = 'Não foi possível criar: '+erro.message;
        botao.disabled = false;
    }
}


function mostrarPerguntasRascunho(perguntas){
    const formulario = document.getElementById('formPerguntaPesquisa');
    if(!formulario) return;

    const anterior = document.getElementById('pesqPerguntasExistentes');
    if(anterior) anterior.remove();

    const tipos = {
        NOTA_1_5: 'Nota de 1 a 5',
        NOTA_0_10: 'Nota de 0 a 10',
        ESCOLHA_UNICA: 'Escolha unica',
        MULTIPLA_ESCOLHA: 'Multipla escolha',
        TEXTO: 'Texto livre',
        SIM_NAO: 'Sim / Nao'
    };

    const lista = [...perguntas].sort((a,b) =>
        Number(a.ordem) - Number(b.ordem)
    );

    const bloco = document.createElement('div');
    bloco.id = 'pesqPerguntasExistentes';
    bloco.style.cssText = 'margin:18px 0;padding:16px;background:#f0f6fd;border-radius:10px';

    bloco.innerHTML = `
        <h3 style="margin:0 0 12px">
            Perguntas cadastradas (${lista.length})
        </h3>
        ${lista.length ? lista.map((p,i) => `
            <div style="background:white;padding:12px;border:1px solid #dce5ef;border-radius:8px;margin-bottom:9px">
                <strong>${i+1}. ${escaparTextoPesquisa(p.enunciado)}</strong>
                <p style="margin:6px 0;font-size:12px">
                    ${escaparTextoPesquisa(tipos[p.tipo] || p.tipo)}
                    — Ordem: ${Number(p.ordem)}
                    — ${p.obrigatoria ? 'Obrigatoria' : 'Opcional'}
                </p>
                ${(p.alternativas || []).length ? `
                    <ul style="margin:6px 0;padding-left:22px">
                        ${p.alternativas.map(a => `<li>${escaparTextoPesquisa(a.texto)}</li>`).join('')}
                    </ul>
                ` : ''}
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
                    <button type="button" class="pesq-action secondary"
                        onclick="editarPerguntaRascunho(${Number(p.id)})">
                        Editar
                    </button>
                    <button type="button" class="pesq-action secondary"
                        style="color:#b42318;border-color:#efcaca"
                        onclick="excluirPerguntaRascunho(${Number(p.id)})">
                        Excluir
                    </button>
                </div>
            </div>
        `).join('') : '<p>Nenhuma pergunta cadastrada.</p>'}
    `;

    formulario.parentNode.insertBefore(bloco, formulario);
}

async function editarPerguntaRascunho(id){
    try{
        const pesquisa = await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}`
        );

        if(pesquisa.status !== 'RASCUNHO'){
            alert('Apenas rascunhos podem ser editados.');
            return;
        }

        const pergunta = (pesquisa.perguntas || []).find(
            p => Number(p.id) === Number(id)
        );

        if(!pergunta){
            alert('Pergunta nao encontrada.');
            return;
        }

        const enunciado = prompt(
            'Edite o enunciado da pergunta:',
            pergunta.enunciado
        );

        if(enunciado === null) return;

        if(!enunciado.trim()){
            alert('O enunciado nao pode ficar vazio.');
            return;
        }

        const ordemTexto = prompt(
            'Informe a ordem da pergunta:',
            String(pergunta.ordem)
        );

        if(ordemTexto === null) return;

        const ordem = Number(ordemTexto);

        if(!Number.isInteger(ordem) || ordem < 1){
            alert('Informe uma ordem valida.');
            return;
        }

        await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}/perguntas/${id}`,
            'PUT',
            {enunciado: enunciado.trim(), ordem}
        );

        const atualizado = await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}`
        );

        mostrarPerguntasRascunho(atualizado.perguntas || []);

        pesquisaPerguntasAdicionadas = (atualizado.perguntas || []).length;
        pesquisaOrdemAtual = Math.max(
            0,
            ...(atualizado.perguntas || []).map(p => Number(p.ordem) || 0)
        ) + 1;

        const contador = document.getElementById('pesqPerguntasContador');
        if(contador) contador.textContent = pesquisaPerguntasAdicionadas + ' cadastrada(s)';

        alert('Pergunta atualizada com sucesso!');

    }catch(erro){
        alert('Nao foi possivel editar a pergunta: ' + erro.message);
    }
}

async function excluirPerguntaRascunho(id){
    if(!confirm('Deseja realmente excluir esta pergunta e suas alternativas?'))
        return;

    try{
        await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}/perguntas/${id}`,
            'DELETE'
        );

        const atualizado = await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}`
        );

        mostrarPerguntasRascunho(atualizado.perguntas || []);

        pesquisaPerguntasAdicionadas = (atualizado.perguntas || []).length;
        pesquisaOrdemAtual = Math.max(
            0,
            ...(atualizado.perguntas || []).map(p => Number(p.ordem) || 0)
        ) + 1;

        const contador = document.getElementById('pesqPerguntasContador');
        if(contador) contador.textContent = pesquisaPerguntasAdicionadas + ' cadastrada(s)';

        alert('Pergunta excluida com sucesso!');

    }catch(erro){
        alert('Nao foi possivel excluir: ' + erro.message);
    }
}

async function continuarRascunhoPesquisa(id){
    try{
        const p = await requisicaoPesquisas('/api/pesquisas/'+id);
        if(p.status !== 'RASCUNHO'){alert('Esta pesquisa não está mais em rascunho.');return;}
        pesquisaAdminAtual = id;
        pesquisaPerguntasAdicionadas = (p.perguntas || []).length;
        pesquisaOrdemAtual = Math.max(0,...(p.perguntas || []).map(q=>Number(q.ordem)||0))+1;
        pesquisaPublicoAdicionado = Array.isArray(p.publico) && p.publico.length > 0;
        abrirEditorPerguntasPesquisa(id,p.titulo);

        const identificacao = document.getElementById('identificacaoRascunhoPesquisa');
        const statusIdentificacao = document.getElementById('pesqIdentificacaoStatus');

        if(identificacao){
            identificacao.value = p.anonima ? 'true' : 'false';
        }
        const whatsappRascunho = document.getElementById('whatsappRascunhoPesquisa');
        if(whatsappRascunho) whatsappRascunho.checked = !!p.enviar_whatsapp;

        if(statusIdentificacao){
            statusIdentificacao.textContent = p.anonima ? 'Anônima' : 'Identificada';
        }
        mostrarPerguntasRascunho(p.perguntas || []);
        const n=document.getElementById('pesqPerguntasContador');
        if(n)n.textContent=pesquisaPerguntasAdicionadas+' cadastrada(s)';
        const f=document.getElementById('feedbackPublicoPesquisa');
        if(f)f.textContent=pesquisaPublicoAdicionado
            ? 'Público recuperado. Você pode alterar a seleção e salvar novamente.'
            : 'Defina o público antes de publicar.';
        if(pesquisaPublicoAdicionado){
            const tipo = p.publico[0].tipo;
            const seletor = document.getElementById('tipoPublicoPesquisa');
            if(seletor) seletor.value = tipo;
            const status = document.getElementById('pesqPublicoStatus');
            if(status) status.textContent = 'Definido';
            const valores = p.publico.map(item => item.valor).filter(v => v !== null);
            carregarOpcoesPublicoPesquisa().then(() => {
                document.querySelectorAll('#listaValoresPublico input[name="valoresPublico"]').forEach(input => {
                    input.checked = valores.includes(input.value);
                });
            });
        }
    }catch(e){alert('Não foi possível abrir o rascunho: '+e.message);}
}

async function adicionarPerguntaPeloFormulario(event){
    event.preventDefault();
    const form = event.currentTarget;
    const fd = new FormData(form);
    const tipo = String(fd.get('tipo'));
    const alternativas = String(fd.get('alternativas') || '').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    const feedback = document.getElementById('feedbackPerguntaPesquisa');
    const botao = document.getElementById('btnAdicionarPergunta');
    const payload = {
        enunciado: String(fd.get('enunciado') || '').trim(),
        tipo,
        ordem: Number(fd.get('ordem')),
        alternativas
    };
    botao.disabled = true;
    feedback.textContent = 'Salvando pergunta...';
    try{
        await requisicaoPesquisas(`/api/pesquisas/${pesquisaAdminAtual}/perguntas`,'POST',payload);

        const atualizado = await requisicaoPesquisas(`/api/pesquisas/${pesquisaAdminAtual}`);
        mostrarPerguntasRascunho(atualizado.perguntas || []);

        pesquisaPerguntasAdicionadas = (atualizado.perguntas || []).length;
        pesquisaOrdemAtual = Math.max(0,...(atualizado.perguntas || []).map(p=>Number(p.ordem)||0))+1;

        document.getElementById('pesqPerguntasContador').textContent = pesquisaPerguntasAdicionadas+' cadastrada(s)';
        feedback.textContent = 'Pergunta adicionada com sucesso.';
        form.reset();
        form.elements.ordem.value = pesquisaOrdemAtual;
        alternativasPerguntaVisibilidade();
    }catch(erro){
        feedback.textContent = 'Não foi possível adicionar: '+erro.message;
    }finally{ botao.disabled = false; }
}

async function adicionarPublicoPeloFormulario(event){
    event.preventDefault();

    const tipo = document.getElementById('tipoPublicoPesquisa').value;
    const feedback = document.getElementById('feedbackPublicoPesquisa');
    const botao = document.getElementById('btnAdicionarPublico');

    const valores = tipo === 'TODOS'
        ? []
        : [...document.querySelectorAll(
            '#listaValoresPublico input[name="valoresPublico"]:checked'
          )].map(input => input.value);

    if(tipo !== 'TODOS' && valores.length === 0){
        feedback.textContent = 'Selecione pelo menos uma opção.';
        return;

    botao.disabled = true;
    feedback.textContent = 'Salvando público...';

    try {

}

async function carregarPesquisasAdmin(){
    const lista = document.getElementById('pqAdminList');
    if(!lista || page !== 'admin' || adminTab !== 'pesquisas') return;
    try{
        const dados = await requisicaoPesquisas('/api/pesquisas/admin');
        const contagem = {PUBLICADA:0,RASCUNHO:0,AGENDADA:0,ENCERRADA:0,ARQUIVADA:0};
        dados.forEach(p=>{ if(contagem[p.status] !== undefined) contagem[p.status]++; });
        const cards = dados.map(p=>{
            const status = String(p.status || 'RASCUNHO');
            const classe = status==='PUBLICADA'?'published':status==='AGENDADA'?'scheduled':status==='ENCERRADA'?'closed':'draft';
            const privacidade = p.anonima ? '🔒 Anônima' : 'Identificada';
            const dataFim = p.encerramento_em ? new Date(p.encerramento_em).toLocaleDateString('pt-BR') : '';
            const meta = [status,privacidade,dataFim ? 'Encerra em '+dataFim : 'Sem prazo final'].map(esc).join('');
            return `<article class="pesq-admin-item" data-status="${esc(status)}"><div><h3>${esc(p.titulo)}</h3><p class="pesq-admin-desc">Pesquisa #${p.id}</p><div class="pesq-admin-meta"><span class="pesq-admin-pill ${classe}">${esc(status)}</span><span class="pesq-admin-pill">${privacidade}</span>${dataFim?`<span class="pesq-admin-pill">Encerra em ${dataFim}</span>`:''}</div></div><div class="pesq-admin-actions">${status==='RASCUNHO'?`<button type="button" onclick="continuarRascunhoPesquisa(${p.id})">Editar / Publicar</button><button type="button" style="color:#b42318;border-color:#efcaca" onclick="excluirPesquisaAdmin(${p.id})">Excluir pesquisa</button>`:`<span class="pesq-admin-pill">${esc(status)}</span>`}<button type="button" onclick="abrirPainelPesquisa(${p.id})">Detalhes / Resultados</button>${(status==='PUBLICADA'||status==='AGENDADA')?`<button type="button" style="color:#b42318;border-color:#efcaca" onclick="encerrarPesquisaAdmin(${p.id})">Encerrar</button>`:''}${p.enviar_whatsapp && (status==='PUBLICADA'||status==='AGENDADA') && !Number(p.links_gerados) ? `<button type="button" onclick="abrirLinksPesquisa(${p.id})">Gerar links WhatsApp</button>` : ''}${p.enviar_whatsapp && Number(p.links_gerados)>0 ? `<button type="button" onclick="abrirLinksPesquisa(${p.id})">Links WhatsApp (${Number(p.links_gerados)})</button>` : ''}</div></article>`;
        }).join('');
        lista.innerHTML = cards || '<div class="pesq-admin-item"><div><h3>Nenhuma pesquisa cadastrada</h3><p class="pesq-admin-desc">Clique em “Nova pesquisa” para começar.</p></div></div>';
        const stats = document.querySelectorAll('.pesq-admin-stat b');
        const vals = [dados.length,contagem.PUBLICADA,contagem.RASCUNHO,contagem.AGENDADA,contagem.ENCERRADA];
        stats.forEach((el,i)=>{ if(vals[i] !== undefined) el.textContent=String(vals[i]).padStart(2,'0'); });
        const note = document.getElementById('pqAdminFeedback');
        if(note) note.textContent = 'Dados carregados do PostgreSQL principal.';
        ativarFiltrosPesquisas(); if(page==='home'){carregarPendenciasTreinamentosHome();carregarPendenciasPesquisasHome();carregarPendenciasAvaliacoesHome();carregarComunicadosHome();eaCarregarMeus();}if(page==='pesquisas')carregarPesquisasColaborador();
    }catch(erro){
        lista.innerHTML = `<div class="pesq-admin-item"><div><h3>Não foi possível carregar as pesquisas</h3><p class="pesq-admin-desc">${esc(erro.message)}</p></div></div>`;
        const note = document.getElementById('pqAdminFeedback');
        if(note) note.textContent = 'Falha ao consultar a API.';
    }
}

let linksPesquisaCache = {};
function copiarLinkPesquisa(uid){
  const link=linksPesquisaCache[uid]?.link;
  if(!link){alert('URL do link indisponível. Configure a URL pública em ADMIN > Empresa.');return;}
  if(navigator.clipboard && window.isSecureContext){navigator.clipboard.writeText(link).then(()=>alert('Link copiado.')).catch(()=>prompt('Copie o link:',link));}
  else prompt('Copie o link:',link);
}
function compartilharLinkPesquisa(uid){
  const item=linksPesquisaCache[uid];
  if(!item?.link){alert('Configure a URL pública antes de compartilhar.');return;}
  window.open('https://wa.me/?text='+encodeURIComponent(item.mensagem),'_blank','noopener');
}

function ativarFiltrosPesquisas(){
 const uf=[...document.querySelectorAll('[data-pq-user-filter]')];if(uf.length){const labels={all:'Todas as pesquisas',pending:'Pesquisas pendentes',answered:'Pesquisas respondidas',expired:'Pesquisas não respondidas'};uf.forEach(b=>b.addEventListener('click',()=>{const f=b.dataset.pqUserFilter;uf.forEach(x=>{x.classList.toggle('selected',x===b);x.querySelector('.selected-note').textContent=x===b?'● Filtro selecionado':''});let n=0;document.querySelectorAll('#pqUserCards .pesq-user-card').forEach(c=>{const show=f==='all'||c.dataset.status===f;c.hidden=!show;if(show)n++});document.getElementById('pqUserListTitle').textContent=labels[f];document.getElementById('pqUserCount').textContent=n+(n===1?' pesquisa':' pesquisas')}));}
 const area = document.getElementById('app');

 if(area && !area.dataset.pqAdminFiltrosAtivos){
    area.dataset.pqAdminFiltrosAtivos = '1';

    const aplicarFiltroAdmin = () => {
        const busca = document.getElementById('pqAdminSearch');
        const seletor = document.getElementById('pqAdminStatus');
        const lista = document.getElementById('pqAdminList');

        if(!busca || !seletor || !lista) return;

        const termo = busca.value.trim().toLocaleLowerCase('pt-BR');
        const status = seletor.value;

        document.querySelectorAll('[data-pq-admin-filter]').forEach(botao => {
            botao.classList.toggle(
                'active',
                botao.dataset.pqAdminFilter === status
            );
        });

        lista.querySelectorAll('.pesq-admin-item').forEach(cartao => {
            const correspondeStatus =
                status === 'all' || cartao.dataset.status === status;

            const correspondeBusca =
                cartao.innerText.toLocaleLowerCase('pt-BR').includes(termo);

            cartao.hidden = !(correspondeStatus && correspondeBusca);
        });
    };

    area.addEventListener('click', evento => {
        const botao = evento.target.closest('[data-pq-admin-filter]');
        if(!botao || !area.contains(botao)) return;

        const seletor = document.getElementById('pqAdminStatus');
        if(!seletor) return;

        seletor.value = botao.dataset.pqAdminFilter;
        aplicarFiltroAdmin();
    });

    area.addEventListener('input', evento => {
        if(evento.target.id === 'pqAdminSearch'){
            aplicarFiltroAdmin();
        }
    });

    area.addEventListener('change', evento => {
        if(evento.target.id === 'pqAdminStatus'){
            aplicarFiltroAdmin();
        }
    });
 }
}

async function carregarDashboardsUsuario(){
 if(dashUsuarioCarregando)return;
 dashUsuarioCarregando=true;
 try{
  const token=sessionStorage.getItem("intranet_token");
  if(!token)throw new Error("Sessao nao encontrada");
  const headers={Authorization:"Bearer "+token};
  const resposta=await fetch("/api/dashboards/caixinhas",{headers});
  if(!resposta.ok)throw new Error("Erro ao consultar permissoes: "+resposta.status);
  const dados=await resposta.json();
  const caixinhas=Array.isArray(dados)?dados:(dados.caixinhas||[]);
  dashUsuarioCaixinhas=await Promise.all(caixinhas.map(async c=>{
   const r=await fetch("/api/dashboards/caixinhas/"+c.id+"/dashboards",{headers});
   if(!r.ok)throw new Error("Erro ao consultar dashboards: "+r.status);
   const d=await r.json();
   return {...c,dashboards:Array.isArray(d)?d:(d.dashboards||[])};
  }));
  dashUsuarioErro="";
 }catch(e){dashUsuarioErro=e.message;dashUsuarioCaixinhas=[];}
 finally{dashUsuarioCarregando=false;if(page==="dashboards")render();}
}

// BRIDGE UNIVERSAL: intercepta fetch dos dashboards isolados e encaminha pela sessao da Intranet.
(function instalarBridgeUniversal(){
    if (window.__intranetBridgeInstalada) return;
    window.__intranetBridgeInstalada = true;
    window.addEventListener('message', async function(evento) {
        const iframe = document.querySelector('iframe[data-dashboard-rota]');
        if (!iframe || evento.source !== iframe.contentWindow) return;
        const msg = evento.data;
        if (msg && msg.tipo === 'MEGAVIG_360_ALTERAR_VISAO') {
            // O iframe isolado solicita a troca; somente o backend decide quais visoes sao autorizadas.
            const visao = String(msg.visao || '');
            if (!['pessoal', 'equipe', 'empresa'].includes(visao)) return;
            if (!/^\/api\/dashboards\/visualizar\/[a-f0-9]{32}$/.test(iframe.dataset.dashboardRota || '')) return;
            await carregarIframeDashboard(visao);
            return;
        }
        if (!msg || msg.tipo !== 'INTRANET_DASH_FETCH' || !msg.id) return;
        try {
            const url = new URL(String(msg.url || ''), window.location.origin);
            // A Bridge so encaminha APIs de dashboards. Cada endpoint continua responsavel
            // por validar usuario, permissao e dados no backend.
            const metodo = String(msg.method || 'GET').toUpperCase();
            const pulsePermitido = /^\/api\/pulse\/(catalogo|execucoes|automacoes(?:\/\d+(?:\/(?:ativar|pausar))?)?)$/.test(url.pathname)
                && ((metodo === 'GET' && (url.pathname === '/api/pulse/catalogo' || url.pathname === '/api/pulse/automacoes'))
                    || (metodo === 'POST' && url.pathname === '/api/pulse/automacoes')
                    || (metodo === 'PUT' && /^\/api\/pulse\/automacoes\/\d+$/.test(url.pathname))
                    || (metodo === 'DELETE' && /^\/api\/pulse\/automacoes\/\d+$/.test(url.pathname))
                    || (metodo === 'POST' && /^\/api\/pulse\/automacoes\/\d+\/(ativar|pausar)$/.test(url.pathname))
                    || (metodo === 'GET' && url.pathname === '/api/pulse/execucoes'));
            const dashPermitido = url.pathname.startsWith('/api/dashboards/');
            if (url.origin !== window.location.origin || !(dashPermitido || pulsePermitido)) {
                throw new Error('Rota nao autorizada pela Bridge');
            }
            const token = sessionStorage.getItem('intranet_token');
            if (!token) throw new Error('Sessao da Intranet nao encontrada');
            const headers = new Headers();
            if (msg.headers && typeof msg.headers === 'object' &&
                String(msg.headers['content-type'] || msg.headers['Content-Type'] || '').toLowerCase() === 'application/json') {
                headers.set('Content-Type', 'application/json');
            }
            const rotaDashboard = iframe.dataset.dashboardRota;
            if (!rotaDashboard) throw new Error('Dashboard sem identificacao');
            headers.set('X-Intranet-Dashboard-Route', rotaDashboard);
            headers.set('Authorization', 'Bearer ' + token);
            const resposta = await fetch(url.pathname + url.search, {
                method: String(msg.method || 'GET').toUpperCase(),
                headers,
                body: msg.body == null ? undefined : msg.body,
                cache: 'no-store',
                credentials: 'same-origin'
            });
            const corpo = await resposta.text();
            iframe.contentWindow.postMessage({
                tipo: 'INTRANET_DASH_FETCH_RESULT', id: msg.id,
                status: resposta.status, ok: resposta.ok,
                corpo, contentType: resposta.headers.get('content-type') || 'text/plain'
            }, '*');
        } catch (erro) {
            iframe.contentWindow.postMessage({
                tipo: 'INTRANET_DASH_FETCH_RESULT', id: msg.id,
                status: 0, ok: false, erro: erro.message || 'Falha na Bridge'
            }, '*');
        }
    });
})();

async function carregarIframeDashboard(visao = null) {
    const iframe = document.querySelector('iframe[data-dashboard-rota]');
    if (!iframe) return;
    const rota = iframe.dataset.dashboardRota;
    if (!rota.startsWith('/api/dashboards/visualizar/')) {
        iframe.src = rota;
        return;
    }
    const token = sessionStorage.getItem('intranet_token');
    try {
        const rotaComVisao = visao ? rota + '?visao=' + encodeURIComponent(visao) : rota;
        const resposta = await fetch(rotaComVisao, {
            headers: { Authorization: 'Bearer ' + token },
            cache: 'no-store'
        });
        if (!resposta.ok) throw new Error('Acesso negado ou dashboard indisponivel: ' + resposta.status);
        const html = await resposta.text();
        // Shim universal: dashboards importados podem continuar usando fetch('/api/...').
        // A chamada sai do iframe por postMessage e a Intranet injeta a autenticacao.
        // Apenas o mapa operacional pode consultar os recursos publicos do OpenFreeMap.
        const permitirOpenFreeMap = html.includes('<!-- MEGAVIG_MAPA_OPERACOES_DADOS -->') ||
          (html.includes('id="megavig-mapa-dados"') && html.includes('id="maplibre"'));
        const bridgeShim = `<script>
        // Compatibilidade de sessionStorage para HTML isolado
        (() => {
          const dados = new Map();
          const storage = {
            getItem: k => k === 'intranet_token' ? 'bridge-managed' : (dados.has(k) ? dados.get(k) : null),
            setItem: (k,v) => dados.set(String(k),String(v)),
            removeItem: k => dados.delete(String(k)),
            clear: () => dados.clear(),
            key: i => Array.from(dados.keys())[i] ?? null,
            get length() { return dados.size; }
          };
          Object.defineProperty(window, 'sessionStorage', {
            configurable: true,
            value: storage
          });
        })();
        (() => {
          const pendentes = new Map(); let seq = 0;
          const fetchNativo = window.fetch.bind(window);
          const permitirMapa = ${permitirOpenFreeMap};
          window.addEventListener('message', e => {
            const m=e.data; if(!m || m.tipo!=='INTRANET_DASH_FETCH_RESULT' || !pendentes.has(m.id)) return;
            const p=pendentes.get(m.id); pendentes.delete(m.id);
            if(m.status===0){p.reject(new TypeError(m.erro||'Falha na Bridge'));return;}
            p.resolve(new Response(m.corpo,{status:m.status,headers:{'Content-Type':m.contentType||'text/plain'}}));
          });
          window.fetch = (input, init={}) => {
            const raw = typeof input==='string' ? input : (input && input.url) || String(input);
            const url = new URL(raw, 'https://intranet.invalid');
            // O MapLibre precisa buscar estilo, tiles vetoriais, sprites e fontes.
            // Liberacao restrita ao dashboard de operacoes e ao dominio OpenFreeMap.
            if (permitirMapa && url.protocol === 'https:' && url.hostname === 'tiles.openfreemap.org')
              return fetchNativo(input, init);
            if(url.origin !== 'https://intranet.invalid' || !(url.pathname.startsWith('/api/dashboards/') || url.pathname.startsWith('/api/pulse/')))
              return Promise.reject(new TypeError('Acesso externo bloqueado no dashboard'));
            const id='req-'+(++seq);
            const method=(init.method || (input && input.method) || 'GET').toUpperCase();
            const headers={};
            const h=new Headers(init.headers || (input && input.headers) || {});
            h.forEach((v,k)=>{if(k.toLowerCase()!=='authorization')headers[k]=v;});
            const body=init.body !== undefined ? init.body : undefined;
            return new Promise((resolve,reject)=>{
              pendentes.set(id,{resolve,reject});
              parent.postMessage({tipo:'INTRANET_DASH_FETCH',id,url:url.pathname+url.search,method,headers,body},'*');
              setTimeout(()=>{if(pendentes.has(id)){pendentes.delete(id);reject(new Error('Tempo esgotado na Bridge'));}},30000);
            });
          };
        })();
        <\/script>`;
        iframe.setAttribute('sandbox', 'allow-scripts');
        // Identidade visual enviada ao iframe sem expor credenciais.
        const nomeEmpresaDashboard = String(empresaConfigAtual?.nome_curto || empresaConfigAtual?.nome || 'Intranet').trim();
        const identidadeDashboard = '<script>window.__INTRANET_EMPRESA_NOME=' + JSON.stringify(nomeEmpresaDashboard).replace(/</g, '\u003c') + ';<\/script>';
        iframe.srcdoc = bridgeShim + identidadeDashboard + html;
    } catch (erro) {
        iframe.srcdoc = '<p>NÃ£o foi possÃ­vel carregar o dashboard.</p>';
        console.error(erro);
    }
}

        const info = await resp.json();
        clearGlobalSearch();
        if (/\.(pdf|png|jpe?g)$/i.test(info.nome_arquivo || '')) {
            window.visualizarArquivoDocumento(x.documentoId, x.paginaDocumento);
            return;
        }
        go('documentos');
        await destacarDocumentoPesquisa(info.titulo_id, info.tipo_id, x.documentoId);
        const alvo = document.querySelector('#content [data-documento-id="' + x.documentoId + '"]');
        const aviso = document.createElement('div');

        aviso.setAttribute('role','status');

        aviso.querySelector('button').onclick = () => aviso.remove();
        const destino = document.querySelector('#content') || document.getElementById('app');
        if (destino) destino.prepend(aviso);
        if (alvo) alvo.scrollIntoView({behavior:'smooth',block:'center'});
    } catch (erro) { alert(erro.message); }
}

async function destacarDocumentoPesquisa(tituloId, tipoId, documentoId) {
    const esperar = async (localizar, tentativas = 80) => {
        for (let n = 0; n < tentativas; n++) {
            const elemento = localizar();
            if (elemento) return elemento;
            await new Promise(resolve => setTimeout(resolve, 100));
        }
        return null;
    };

    const area = await esperar(() =>
        document.querySelector('#content details[data-titulo-id="' +
            tituloId + '"]')
    );

    if (!area) return;

    area.open = true;

    const subpasta = await esperar(() =>
        area.querySelector('details[data-tipo-id="' + tipoId + '"]')
    );

    if (!subpasta) return;

    subpasta.open = true;

    const documento = await esperar(() =>
        subpasta.querySelector('[data-documento-id="' +
            documentoId + '"]')
    );

    if (!documento) return;

    documento.style.background = '#fff3bf';
    documento.style.borderRadius = '5px';
    documento.style.padding = '4px 6px';

    documento.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
    });
}

  const mensagem = document.getElementById('profile-photo-message');

  if(!arquivo || !preview) return;

  if(!['image/jpeg','image/png','image/webp'].includes(arquivo.type) ||
     arquivo.size > 2 * 1024 * 1024){
    input.value = '';
    mensagem.textContent = 'Selecione JPG, PNG ou WebP de até 2 MB.';
    return;
  }

  const url = URL.createObjectURL(arquivo);
  const imagem = document.createElement('img');
  imagem.alt = 'Pré-visualização da foto';
  imagem.style.cssText = 'width:100%;height:100%;object-fit:cover';

  imagem.onload = () => URL.revokeObjectURL(url);
  imagem.onerror = () => {
    URL.revokeObjectURL(url);
    mensagem.textContent = 'Não foi possível visualizar a imagem.';
  };

  imagem.src = url;
  preview.replaceChildren(imagem);
  mensagem.textContent = 'Foto selecionada. Clique em Salvar foto.';
}

function iconeFormatoDocumentoV12(nome) {
    const ext = String(nome || '').split('.').pop().toLowerCase();
    if (ext === 'pdf') return ['PDF', '#c62828'];
    if (['xls','xlsx','xlsm','csv','ods'].includes(ext)) return ['XLS', '#18794e'];
    if (['doc','docx','odt','rtf'].includes(ext)) return ['DOC', '#2563a6'];
    if (['ppt','pptx','odp'].includes(ext)) return ['PPT', '#c45c25'];
    if (['png','jpg','jpeg','webp','gif'].includes(ext)) return ['IMG', '#7755a6'];
    if (['zip','rar','7z'].includes(ext)) return ['ZIP', '#756244'];
    return ['ARQ', '#64748b'];
}
function preencherNomeDocumentoV12(elemento, arquivo) {

window.visualizarArquivoDocumento = async function(arquivoId, pagina = 1) {
    const novaJanela = window.open('about:blank', '_blank');
    if (!novaJanela) { alert('Permita a abertura de janelas para visualizar documentos.'); return; }
    novaJanela.document.title = 'Visualizando documento';
    novaJanela.document.body.textContent = 'Carregando documento...';
    try {
        const token = sessionStorage.getItem('intranet_token');
        const resposta = await fetch('/api/documentos-arquivos/' + arquivoId + '/visualizar', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!resposta.ok) throw new Error('Erro ao abrir documento');
        const blob = await resposta.blob();
        const tipo = blob.type.toLowerCase();
        if (!['application/pdf', 'image/png', 'image/jpeg'].includes(tipo)) throw new Error('Visualização disponível somente para PDF, PNG ou JPG.');
        const endereco = URL.createObjectURL(blob);
        if (tipo.startsWith('image/')) {
            const docImagem = novaJanela.document;
            docImagem.open();
            docImagem.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Visualizar imagem</title><style>body{margin:0;background:#293544;display:grid;place-items:center;min-height:100vh}img{max-width:98vw;max-height:98vh;object-fit:contain}</style></head><body><img alt="Documento"></body></html>');
            docImagem.close();
            docImagem.querySelector('img').src = endereco;
            novaJanela.addEventListener('pagehide', () => URL.revokeObjectURL(endereco), {once:true});
            return;
        }
        const paginaInicial = Math.max(1, parseInt(pagina, 10) || 1);
        // PDF.js renderiza a página solicitada diretamente, sem depender do visualizador de blob do Chrome.
        const doc = novaJanela.document;
        doc.open();
        doc.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Documento - Página ${paginaInicial}</title>
<style>body{margin:0;background:#525659;font:14px Arial,sans-serif;color:white}header{position:sticky;top:0;z-index:2;background:#263746;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:12px}button,a{border:0;border-radius:5px;padding:8px 12px;background:#e7eef6;color:#18314a;text-decoration:none;cursor:pointer}button:disabled{opacity:.45;cursor:default}#status{min-width:100px;text-align:center}main{text-align:center;padding:18px}canvas{max-width:100%;height:auto;background:white;box-shadow:0 3px 15px #2227}#msg{padding:30px}</style></head><body>
<header><button id="prev">◀ Anterior</button><span id="status">Carregando...</span><button id="next">Próxima ▶</button><a id="download" target="_blank" rel="noopener">Abrir PDF original</a></header>
<main><div id="msg">Carregando visualizador...</div><canvas id="pdfcanvas"></canvas></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>
</body></html>`);
        doc.close();
        const init = () => {
            const pdfjs = novaJanela.pdfjsLib;
            if (!pdfjs) {
                doc.getElementById('msg').textContent = 'Visualizador indisponível. Use Abrir PDF original.';
                return;
            }
            pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            let pdf, atual = paginaInicial, ocupada = false;
            const status = doc.getElementById('status');
            const canvas = doc.getElementById('pdfcanvas');
            const msg = doc.getElementById('msg');
            const anterior = doc.getElementById('prev');
            const proxima = doc.getElementById('next');
            const desenhar = async (numero) => {
                if (ocupada || !pdf) return;
                ocupada = true;
                try {
                    const paginaPdf = await pdf.getPage(numero);
                    const escala = Math.min(1.7, Math.max(0.8, (novaJanela.innerWidth - 40) / paginaPdf.getViewport({scale:1}).width));
                    const viewport = paginaPdf.getViewport({scale:escala});
                    canvas.width = Math.ceil(viewport.width);
                    canvas.height = Math.ceil(viewport.height);
                    await paginaPdf.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
                    atual = numero;
                    status.textContent = 'Página ' + atual + ' de ' + pdf.numPages;
                    anterior.disabled = atual <= 1;
                    proxima.disabled = atual >= pdf.numPages;
                    msg.hidden = true;
                } catch(e) { msg.hidden = false; msg.textContent = 'Não foi possível exibir a página: ' + e.message; }
                finally { ocupada = false; }
            };
            anterior.onclick = () => desenhar(atual - 1);
            proxima.onclick = () => desenhar(atual + 1);
            pdfjs.getDocument({url:endereco}).promise.then(resultado => {
                pdf = resultado;
                desenhar(Math.min(paginaInicial, pdf.numPages));
            }).catch(e => { msg.textContent = 'Erro ao carregar PDF: ' + e.message; });
        };
        const original = doc.getElementById('download');
        original.href = endereco + '#page=' + paginaInicial;
        const script = doc.querySelector('script[src]');
        if (novaJanela.pdfjsLib) init();
        else {
            script.addEventListener('load', init);
            script.addEventListener('error', () => { doc.getElementById('msg').textContent = 'PDF.js não carregou. Clique em Abrir PDF original.'; });
        }
        novaJanela.addEventListener('pagehide', () => URL.revokeObjectURL(endereco), {once:true});
    } catch (erro) { novaJanela.close(); alert(erro.message); }
};

window.carregarArvoreConsulta = async function() {
    const area = document.getElementById('content');
    if (!area) return;

    area.textContent = 'Carregando documentos...';

    const headers = {
        Authorization: 'Bearer ' + sessionStorage.getItem('intranet_token')
    };

    async function consultar(url) {
        const resposta = await fetch(url, { headers });
        if (!resposta.ok) {
            throw new Error('Falha na consulta: HTTP ' + resposta.status);
        }
        return resposta.json();
    }

    try {
        const titulos = await consultar('/api/documentos-titulos');

        if (!area.isConnected) return;

        area.replaceChildren();

        if (!titulos.length) {
            area.textContent = 'Nenhum documento disponível.';
            return;
        }

        for (const titulo of titulos) {
            const pasta = document.createElement('details');
            pasta.dataset.tituloId = String(titulo.id);
            pasta.style.padding = '3px 8px';
            pasta.style.marginBottom = '2px';
            pasta.style.border = '1px solid #ddd';
            pasta.style.borderRadius = '8px';

            const nome = document.createElement('summary');
            nome.style.cursor = 'pointer';
            nome.style.fontWeight = '600'; nome.style.fontSize = '13px'; nome.style.lineHeight = '20px';
            // Quantidade total de documentos do título (inclui todos os tipos internos).
            const totalDocs = Number(titulo.total_documentos);
            nome.textContent = '📁 ' + titulo.nome;
            if (Number.isFinite(totalDocs) && totalDocs >= 0) {
                const contador = document.createElement('span');
                contador.textContent = ' (' + totalDocs + ' ' + (totalDocs === 1 ? 'doc' : 'docs') + ')';
                contador.style.color = '#58718d';
                contador.style.fontSize = '11px';
                contador.style.fontWeight = '500';
                nome.appendChild(contador);
            }

            const tiposArea = document.createElement('div');
            tiposArea.style.padding = '2px 0 0 14px';

            pasta.append(nome, tiposArea);
            area.appendChild(pasta);

            pasta.addEventListener('toggle', async () => {
                if (!pasta.open || pasta.dataset.carregado) return;

                tiposArea.textContent = 'Carregando...';

                try {
                    const tipos = await consultar(
                        '/api/documentos-tipos?titulo_id=' +
                        encodeURIComponent(titulo.id)
                    );

                    tiposArea.replaceChildren();

                    if (!tipos.length) {
                        tiposArea.textContent = 'Nenhum tipo cadastrado.';
                    }

                    for (const tipo of tipos) {
                        const subpasta = document.createElement('details');

                        subpasta.style.marginBottom = '2px';

                        const subtitulo = document.createElement('summary');
                        subtitulo.style.cursor = 'pointer'; subtitulo.style.fontSize = '13px'; subtitulo.style.lineHeight = '20px';

                        arquivosArea.style.padding = '1px 0 0 14px';

                        subpasta.append(subtitulo, arquivosArea);
                        tiposArea.appendChild(subpasta);

                        subpasta.addEventListener('toggle', async () => {
                            if (!subpasta.open || subpasta.dataset.carregado) return;

                            arquivosArea.textContent = 'Carregando arquivos...';

                            try {
                                const arquivos = await consultar(
                                    '/api/documentos-arquivos?tipo_id=' +
                                    encodeURIComponent(tipo.id)
                                );

                                arquivosArea.replaceChildren();

                                if (!arquivos.length) {
                                    arquivosArea.textContent = 'Nenhum arquivo disponível.';
                                }

                                arquivos.forEach(arquivo => {
                                    const linha = document.createElement('div');
                                    linha.dataset.documentoId = String(arquivo.id);
                                    linha.style.display = 'flex';
                                    linha.style.alignItems = 'center';
                                    linha.style.justifyContent = 'space-between';

                                    baixar.onclick = async () => {

                                                '/api/documentos-arquivos/' + arquivo.id + '/download',
                                                {
                                                    headers: {
                                                        Authorization: 'Bearer ' +
                                                            sessionStorage.getItem('intranet_token')

                                            );

                                            if (!resposta.ok) {

<script>
function abrirNovoComunicado(comunicado = null) {
    if (document.getElementById('modalNovoComunicado')) return;

    const editando = !!comunicado;
    const modal = document.createElement('div');

    modal.id = 'modalNovoComunicado';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';

    modal.innerHTML = `
        <div style="background:white;border-radius:14px;padding:28px;width:100%;max-width:750px;max-height:90vh;overflow-y:auto;color:#102b49">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <h2>${editando ? 'Editar Comunicado' : 'Novo Comunicado'}</h2>
                <button type="button" onclick="document.getElementById('modalNovoComunicado').remove()">Fechar</button>
            </div>
            <form id="formNovoComunicado">
                <p><label>Título *</label><input name="titulo" required maxlength="200" style="width:100%;padding:12px"></p>
                <p><label>Categoria *</label>
                    <select name="categoria" required style="width:100%;padding:12px">
                        <option value="Comunicados Internos">Comunicados Internos</option>
                        <option value="Recursos Humanos">Recursos Humanos</option>
                        <option value="Eventos">Eventos</option>
                        <option value="Treinamentos">Treinamentos</option>
                        <option value="Informativos">Informativos</option>
                    </select>
                </p>
                <p><label>Resumo</label><textarea name="resumo" rows="2" style="width:100%;padding:12px"></textarea></p>
                <p><label>Conteúdo *</label><textarea name="conteudo" rows="6" required style="width:100%;padding:12px"></textarea></p>
                <p>
                    <label>Imagem do comunicado</label>
                    <input type="file" id="imagemComunicado" accept="image/jpeg,image/png,image/webp"
                        style="width:100%;padding:12px"
                        onchange="visualizarImagemComunicado(this)">
                    <small>JPG, PNG ou WebP — máximo 5 MB</small>
                    <img id="previewImagemComunicado"
                        style="display:none;max-width:100%;max-height:220px;margin-top:12px;border-radius:8px">
                </p>
                <p><label>Início da publicação</label><input name="data_inicio" type="datetime-local"></p>
                <p><label>Fim da publicação</label><input name="data_fim" type="datetime-local"></p>
                <p><label><input name="destaque" type="checkbox"> Destacar comunicado</label></p>
                <p><label><input name="comunicado_do_mes" type="checkbox"> Comunicado do Mês</label></p>
                <div style="display:flex;gap:12px;justify-content:flex-end">
                    <button type="button" class="btn secondary" onclick="document.getElementById('modalNovoComunicado').remove()">Cancelar</button>
                    <button type="submit" class="btn">${editando ? 'Salvar Alterações' : 'Salvar Rascunho'}</button>
                </div>
            </form>
        </div>`;

    document.body.appendChild(modal);

    if (editando) {
        const form = document.getElementById('formNovoComunicado');

        form.dataset.comunicadoId = comunicado.id;
        form.dataset.imagemAtual = comunicado.imagem_url || '';
        form.dataset.publicado = String(!!comunicado.publicado);
        form.dataset.ativo = String(!!comunicado.ativo);
        form.dataset.destaque = String(!!comunicado.destaque);

        form.elements.titulo.value = comunicado.titulo || '';
        form.elements.categoria.value = comunicado.categoria || 'Comunicados Internos';
        form.elements.resumo.value = comunicado.resumo || '';
        form.elements.conteudo.value = comunicado.conteudo || '';
        form.elements.data_inicio.value = converterDataComunicado(comunicado.data_inicio);
        form.elements.data_fim.value = converterDataComunicado(comunicado.data_fim);
        form.elements.destaque.checked = !!comunicado.destaque;
        form.elements.comunicado_do_mes.checked = !!comunicado.comunicado_do_mes;
        form.dataset.permitirCurtidas = String(!!comunicado.permitir_curtidas);
        form.dataset.permitirComentarios = String(!!comunicado.permitir_comentarios);

        if (comunicado.imagem_url) {
            const preview = document.getElementById('previewImagemComunicado');
            preview.src = comunicado.imagem_url;
            preview.style.display = 'block';
        }
    }
}

function converterDataComunicado(valor) {
    if (!valor) return '';
    const data = new Date(valor);
    return new Date(data.getTime() - data.getTimezoneOffset() * 60000)
        .toISOString().slice(0,16);
}

function editarComunicado(id) {
    const comunicado = comunicadosAdmin.find(c => Number(c.id) === Number(id));

    if (!comunicado) {
        alert('Comunicado não encontrado.');
        return;
    }

    abrirNovoComunicado(comunicado);
}

<script>
document.addEventListener('submit', async function(event) {
    if (event.target.id !== 'formNovoComunicado') return;

    event.preventDefault();

    const form = event.target;
    const botao = form.querySelector('button[type="submit"]');
    const dados = new FormData(form);
    const id = form.dataset.comunicadoId;

    const payload = {
        titulo: dados.get('titulo'),
        categoria: dados.get('categoria'),
        resumo: dados.get('resumo') || '',
        conteudo: dados.get('conteudo'),
        imagem_url: '',
        anexo_url: '',
        destinatarios: ['TODOS'],
        destaque: dados.has('destaque'),
        permitir_curtidas: form.dataset.permitirCurtidas === 'true',
        permitir_comentarios: form.dataset.permitirComentarios === 'true',
        data_inicio: dados.get('data_inicio') || null,
        data_fim: dados.get('data_fim') || null,
        publicado: id ? form.dataset.publicado === 'true' : false,
        ativo: id ? form.dataset.ativo === 'true' : true,
        comunicado_do_mes: dados.has('comunicado_do_mes'),
        mes_referencia: dados.has('comunicado_do_mes') ? new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0') + '-01' : null
    };

    if (payload.comunicado_do_mes && (!payload.mes_referencia || !payload.publicado || !payload.ativo)) {
        alert('Para definir o Comunicado do Mês, utilize um comunicado já publicado e ativo.');
        return;
    }

    if (payload.data_inicio && payload.data_fim &&
        payload.data_fim < payload.data_inicio) {
        alert('A data final deve ser posterior à data inicial.');
        return;
    }

    botao.disabled = true;

    try {
        const imagem = document.getElementById('imagemComunicado')?.files[0];

        if (imagem) {
            botao.textContent = 'Enviando imagem...';

            const formularioImagem = new FormData();
            formularioImagem.append('arquivo', imagem);

            const respostaImagem = await fetch(
                '/api/admin/comunicados/upload-imagem',
                {
                    method: 'POST',
                    headers: {
                        Authorization: 'Bearer ' + sessionStorage.getItem('intranet_token')
                    },
                    body: formularioImagem
                }
            );

            if (!respostaImagem.ok) {
                throw new Error('Falha no upload: HTTP ' + respostaImagem.status +
                    ' - ' + await respostaImagem.text());
            }

            const resultadoImagem = await respostaImagem.json();
            payload.imagem_url = resultadoImagem.imagem_url;
        }

        botao.textContent = 'Salvando...';

        const resposta = await fetch(
            id ? '/api/admin/comunicados/' + encodeURIComponent(id)
               : '/api/admin/comunicados',
            {
                method: id ? 'PUT' : 'POST',
                headers: {
                    Authorization: 'Bearer ' + sessionStorage.getItem('intranet_token'),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }
        );

        if (!resposta.ok) {
            throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
        }

        document.getElementById('modalNovoComunicado').remove();

        await carregarComunicadosAdmin();

        alert(id ? 'Comunicado atualizado com sucesso!' :
                    'Comunicado salvo como rascunho!');

    } catch (erro) {
        alert('Erro ao salvar comunicado: ' + erro.message);
    } finally {
        botao.disabled = false;
    }
});
</script>
<script>
function visualizarImagemComunicado(input) {
    const arquivo = input.files[0];
    const preview = document.getElementById('previewImagemComunicado');

    if (!arquivo) {
        preview.removeAttribute('src');
        preview.style.display = 'none';
        return;
    }

    if (!['image/jpeg','image/png','image/webp'].includes(arquivo.type)) {
        alert('Selecione uma imagem JPG, PNG ou WebP.');
        input.value = '';
        return;
    }

    if (arquivo.size > 5 * 1024 * 1024) {
        alert('A imagem deve ter no máximo 5 MB.');
        input.value = '';
        return;
    }

    const leitor = new FileReader();
    leitor.onload = () => {
        preview.src = leitor.result;
        preview.style.display = 'block';
    };
    leitor.readAsDataURL(arquivo);
}
</script>

<script>
async function alterarStatusComunicado(id, acao) {
    const comunicado = comunicadosAdmin.find(c => Number(c.id) === Number(id));
    if (!comunicado) return alert('Comunicado não encontrado.');

    const publicar = acao === 'publicar';

    if (!confirm(publicar
        ? 'Deseja publicar este comunicado?'
        : 'Deseja desativar este comunicado?')) return;

    const payload = {
        titulo: comunicado.titulo,
        categoria: comunicado.categoria,
        resumo: comunicado.resumo || '',
        conteudo: comunicado.conteudo,
        imagem_url: comunicado.imagem_url || '',
        anexo_url: comunicado.anexo_url || '',
        destinatarios: ['TODOS'],
        destaque: !!comunicado.destaque,
        permitir_curtidas: !!comunicado.permitir_curtidas,
        permitir_comentarios: !!comunicado.permitir_comentarios,
        data_inicio: comunicado.data_inicio || null,
        data_fim: comunicado.data_fim || null,
        publicado: publicar ? true : !!comunicado.publicado,
        ativo: publicar ? true : false
    };

    try {
        const resposta = await fetch('/api/admin/comunicados/' + id, {
            method: 'PUT',
            headers: {
                Authorization: 'Bearer ' + sessionStorage.getItem('intranet_token'),
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        if (!resposta.ok) {
            throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
        }

        await carregarComunicadosAdmin();
        alert(publicar ? 'Comunicado publicado!' : 'Comunicado desativado!');

    } catch (erro) {
        alert('Erro: ' + erro.message);
    }
}
</script>

<script>

    const destino = document.getElementById('galeria-real');

    window.liberarImagensGaleria();

    try {
        const imagens = await window.carregarGaleriaPublicada();

        if (!document.getElementById('galeria-real')) return;

        atual.querySelector('#form-novo-video').onsubmit = async function(evento) {
            evento.preventDefault();

            const formulario = evento.currentTarget;
            const botao = formulario.querySelector('button[type="submit"]');

            const dados = {
                titulo: formulario.elements.titulo.value.trim(),
                embed_html: formulario.elements.embed_html.value.trim()
            };

            if (!dados.titulo || !dados.embed_html) {
                alert('Preencha o título e o link ou código Embed.');
                return;
            }

            botao.disabled = true;

            try {
                const resposta = await fetch('/api/videos', {
                    method: 'POST',
                    headers: {
                        Authorization: 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                if (!resposta.ok) {
                    throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
                }

                alert('Vídeo cadastrado com sucesso.');
                await window.carregarVideosAdmin();

            } catch (erro) {
                alert('Erro ao cadastrar vídeo: ' + erro.message);
            } finally {
                botao.disabled = false;
            }
        };

        atual.onclick = async function(evento) {
            const botao = evento.target.closest('button[data-acao]');
            if (!botao || !atual.contains(botao)) return;

            const video = videos.find(item =>
                Number(item.id) === Number(botao.dataset.id)
            );

            if (!video) return;

            const acao = botao.dataset.acao;

            try {
                if (acao === 'editar') {
                    const titulo = prompt('Novo título:', video.titulo);
                    if (titulo === null) return;

                    const embed = prompt(
                        'Cole o link ou código Embed do Instagram:',
                        video.instagram_url
                    );

                    if (embed === null) return;

                    if (!titulo.trim() || !embed.trim()) {
                        alert('Título e Embed são obrigatórios.');
                        return;
                    }

                    const resposta = await fetch('/api/videos/' + video.id, {
                        method: 'PUT',
                        headers: {
                            Authorization: 'Bearer ' + token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            titulo: titulo.trim(),
                            embed_html: embed.trim(),
                            publicado: video.publicado
                        })
                    });

                    if (!resposta.ok) {
                        throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
                    }

                } else if (acao === 'publicar') {
                    const novaSituacao = !video.publicado;

                    if (!confirm('Deseja ' + (novaSituacao ? 'publicar' : 'ocultar') + ' este vídeo?')) return;

                    const resposta = await fetch('/api/videos/' + video.id, {
                        method: 'PUT',
                        headers: {
                            Authorization: 'Bearer ' + token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            titulo: video.titulo,
                            embed_html: video.instagram_url,
                            publicado: novaSituacao
                        })
                    });

                    if (!resposta.ok) {
                        throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
                    }

                } else if (acao === 'subir' || acao === 'descer') {
                    const indice = videos.findIndex(item =>
                        Number(item.id) === Number(video.id)
                    );

                    const posicao = indice + 1 + (acao === 'subir' ? -1 : 1);

                    if (posicao < 1 || posicao > videos.length) return;

                    const resposta = await fetch('/api/videos/' + video.id + '/ordem', {
                        method: 'PUT',
                        headers: {
                            Authorization: 'Bearer ' + token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ posicao })
                    });

                    if (!resposta.ok) {
                        throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
                    }

                } else if (acao === 'excluir') {
                    if (!confirm('Deseja excluir o vídeo "' + video.titulo + '"?')) return;

                    const resposta = await fetch('/api/videos/' + video.id, {
                        method: 'DELETE',
                        headers: {
                            Authorization: 'Bearer ' + token
                        }
                    });

                    if (!resposta.ok) {
                        throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
                    }
                }

                await window.carregarVideosAdmin();

            } catch (erro) {
                alert('Erro ao executar ação: ' + erro.message);
            }
        };

    } catch (erro) {
        const atual = document.getElementById('videos-admin');

        if (atual) {

<script id="AJUSTE_ROLAGEM_DASH_V12">
(function(){
  function ajustar(){
    const frame = document.getElementById('frameDash');
    if (!frame) return;

    try {
      const doc = frame.contentDocument;
      if (!doc || !doc.body) return;

      doc.documentElement.style.overflow = 'hidden';
      doc.body.style.overflow = 'hidden';

      const altura = Math.max(
        doc.body.scrollHeight,
        doc.documentElement.scrollHeight
      );

      frame.style.height = (altura + 24) + 'px';
      frame.style.overflow = 'hidden';
      frame.setAttribute('scrolling','no');
    } catch(e) {
      console.warn('Nao foi possivel ajustar o iframe',e);
    }
  }

  document.addEventListener('load', function(e){
    if(e.target && e.target.id === 'frameDash'){
      ajustar();
      setTimeout(ajustar,300);
      setTimeout(ajustar,1000);
    }
  },true);

  document.addEventListener('click', function(e){
    if(e.target.closest('.aba-dashboard')){
      setTimeout(ajustar,300);
      setTimeout(ajustar,900);
    }
  });

  window.addEventListener('resize',ajustar);

  setInterval(function(){
    if(document.getElementById('frameDash')) ajustar();
  },1500);
})();
</script>

// Funcoes independentes do escopo interno do aplicativo.
const treinProvaEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function treinProvaRequest(path, options={}){
 const token=sessionStorage.getItem('intranet_token');
 if(!token)throw new Error('Sessão expirada. Entre novamente.');
 const response=await fetch('/api/treinamentos'+path,{...options,headers:{Authorization:'Bearer '+token,...(options.headers||{})},cache:'no-store'});
 if(!response.ok){let msg='HTTP '+response.status;try{const data=await response.json();msg=typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data)}catch(_){}throw new Error(msg)}
 return response.json();
}
// EAD V12 - Prova objetiva real no PostgreSQL.
let treinProvaQuestoes=[];
async function treinProvaListar(){
 const el=document.getElementById('trein-prova-lista');if(!el||!window.treinEditorCurso?.id)return;
 try{
  const dados=await treinProvaRequest('/admin/cursos/'+window.treinEditorCurso.id+'/avaliacao');
  treinProvaQuestoes=dados.questoes||[];
  el.innerHTML=treinProvaQuestoes.length?treinProvaQuestoes.map((q,i)=>`<div class="trein-editor-example"><div class="spaced"><strong>${i+1}. ${treinProvaEsc(q.enunciado)}</strong><div class="trein-acoes"><button type="button" class="btn secondary" onclick="window.treinProvaFormulario(${Number(q.id)})">Editar</button><button type="button" class="btn danger" onclick="window.treinProvaExcluir(${Number(q.id)})">Excluir</button></div></div>${q.alternativas.map((a,j)=>`<div style="font-size:13px;margin-top:5px;color:${a.correta?'#187443':'#526b82'}">${String.fromCharCode(65+j)}. ${treinProvaEsc(a.texto)} ${a.correta?'✓ Correta':''}</div>`).join('')}</div>`).join(''):'<div class="trein-editor-example">Nenhuma questão cadastrada. Clique em Nova questão.</div>';
 }catch(e){el.textContent='Erro ao consultar avaliação: '+e.message}
}
function treinProvaFormulario(id){
 const f=document.getElementById('trein-prova-form');if(!f)return;
 f.reset();f.elements.id.value='';
 const q=treinProvaQuestoes.find(x=>Number(x.id)===Number(id));
 if(q){f.elements.id.value=q.id;f.elements.enunciado.value=q.enunciado;q.alternativas.forEach((a,i)=>{if(i<4)f.elements['alt'+i].value=a.texto});f.elements.correta.value=String(q.alternativas.findIndex(a=>a.correta));}
 f.hidden=false;f.scrollIntoView({block:'nearest',behavior:'smooth'});
}
async function treinProvaSalvar(ev){
 if(ev)ev.preventDefault();
 const f=document.getElementById('trein-prova-form');
 const msg=document.getElementById('trein-prova-msg');
 if(!f||!msg){alert('Formulário de avaliação não encontrado.');return;}
 const campo=n=>f.querySelector('[name="'+n+'"]');
 const id=campo('id').value;
 const enunciado=campo('enunciado').value.trim();
 const alternativas=[0,1,2,3].map(i=>campo('alt'+i).value.trim());
 if(enunciado.length<5){msg.textContent='Informe o enunciado com pelo menos 5 caracteres.';campo('enunciado').focus();return;}
 const vazio=alternativas.findIndex(x=>!x);
 if(vazio>=0){msg.textContent='Preencha a alternativa '+String.fromCharCode(65+vazio)+'.';campo('alt'+vazio).focus();return;}
 const dados={enunciado,alternativas,correta_indice:Number(campo('correta').value)};
 const botao=f.querySelector('button[onclick^="treinProvaSalvar"]');
 if(botao)botao.disabled=true;
 msg.textContent='Salvando questão...';
 try{
  if(!window.treinEditorCurso?.id)throw Error('Curso não identificado.');
  await treinProvaRequest('/admin/cursos/'+window.treinEditorCurso.id+'/avaliacao/questoes'+(id?'/'+id:''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});
  f.hidden=true;msg.textContent='Questão salva no banco.';await treinProvaListar();
 }catch(e){msg.textContent='Erro ao salvar: '+(e.message||String(e));}
 finally{if(botao)botao.disabled=false;}
}
async function treinProvaExcluir(id){
 if(!confirm('Excluir esta questão da prova?'))return;
 const msg=document.getElementById('trein-prova-msg');
 try{await treinProvaRequest('/admin/cursos/'+window.treinEditorCurso.id+'/avaliacao/questoes/'+id,{method:'DELETE'});msg.textContent='Questão excluída.';await treinProvaListar();}catch(e){msg.textContent='Erro: '+e.message}
}
window.treinProvaRequest=treinProvaRequest;window.treinProvaListar=treinProvaListar;window.treinProvaFormulario=treinProvaFormulario;window.treinProvaSalvar=treinProvaSalvar;window.treinProvaExcluir=treinProvaExcluir;
</script>

<script id="trein-presencial-turmas-v12">
async function treinTurmasCarregar(){
 const el=document.getElementById('trein-turmas-lista');if(!el||!treinEditorCurso?.id)return;
 try{
 const id=treinEditorCurso.id;
 const turmas=await eadRequest('/admin/cursos/'+id+'/turmas');
 el.innerHTML=turmas.length?turmas.map(t=>`<div class="card" style="margin:10px 0;padding:12px">
 <strong>${esc(String(t.data_curso).slice(0,10))} — ${esc(t.local||'')}</strong>
 <p class="muted">${esc(String(t.inicio||'').slice(0,5))} às ${esc(String(t.fim||'').slice(0,5))} · Instrutor: ${esc(t.instrutor_nome||'')} · ${Number(t.inscritos||0)} inscritos</p>
 <span class="tag" style="margin-left:8px">${esc(t.status||'')}</span>
 <button class="btn secondary" type="button" onclick="treinTurmaParticipantes(${Number(t.id)})">Participantes e presença</button>
 <div id="trein-turma-participantes-${Number(t.id)}"></div></div>`).join(''):'<p class="muted">Nenhuma turma cadastrada.</p>';
 }catch(e){el.textContent='Erro: '+e.message}
}
async function treinTurmaSalvar(ev){
 ev.preventDefault();const f=ev.currentTarget,m=document.getElementById('trein-turma-msg');
 const dados=Object.fromEntries(new FormData(f).entries());
 if(dados.fim<=dados.inicio){m.textContent='Término deve ser posterior ao início.';return}
 m.textContent='Salvando...';
 try{await eadRequest('/admin/cursos/'+treinEditorCurso.id+'/turmas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});f.reset();m.textContent='Turma salva no PostgreSQL.';await treinTurmasCarregar()}
 catch(e){m.textContent='Erro: '+e.message}
}
async function treinTurmaParticipantes(turma){
 const id=treinEditorCurso.id,el=document.getElementById('trein-turma-participantes-'+turma);if(!el)return;
 el.textContent='Carregando funcionários...';
 try{
 const [funcionarios,participantes]=await Promise.all([eadRequest('/admin/funcionarios'),eadRequest('/admin/cursos/'+id+'/turmas/'+turma+'/participantes')]);
 const inscritos=new Set(participantes.map(p=>Number(p.usuario_id)));
 const disponiveis=funcionarios.filter(u=>!inscritos.has(Number(u.id)));
 el.innerHTML=`<div class="trein-turma-painel">
 <div class="trein-turma-titulo"><strong>Adicionar participantes</strong><span>${disponiveis.length} disponíveis</span></div>
 <input type="search" id="trein-turma-busca-${turma}" placeholder="Buscar por nome, cargo ou centro de custo..." oninput="treinTurmaFiltrar(${turma})" autocomplete="off" style="width:100%;margin:8px 0">
 <div class="trein-turma-opcoes" id="trein-turma-opcoes-${turma}">
 ${disponiveis.map(u=>`<label class="trein-turma-opcao" data-nome="${esc([u.nome,u.cargo,u.centro_custo].join(' ').toLocaleLowerCase('pt-BR'))}"><input type="checkbox" class="trein-turma-selecao-${turma}" value="${Number(u.id)}"><span class="trein-turma-dados"><b>${esc(u.nome||'')}</b><small>${esc(u.cargo||'Cargo não informado')} · CC: ${esc(u.centro_custo||'—')}</small></span></label>`).join('')||'<p class="muted">Todos os funcionários já estão inscritos.</p>'}
 </div><div class="trein-turma-acoes"><span id="trein-turma-contagem-${turma}">0 selecionados</span><button class="btn" type="button" onclick="treinTurmaIncluir(${turma})">Adicionar à turma</button></div></div>
 <div class="trein-turma-titulo" style="margin-top:15px"><strong>Participantes inscritos (${participantes.length})</strong><span>Controle de presença</span></div>
 <div class="trein-turma-inscritos">${participantes.map(p=>`<label class="trein-turma-inscrito"><span class="trein-turma-dados"><b>${esc(p.nome||'')}</b><small>${esc(p.cargo||'Cargo não informado')} · CC: ${esc(p.centro_custo||'—')}</small></span><span class="trein-turma-presenca"><select aria-label="Presença de ${esc(p.nome||'participante')}" onchange="treinTurmaPresenca(${turma},${Number(p.participante_id)},this)" style="width:115px;padding:5px;font-size:12px"><option value="" ${p.presente==null?'selected':''}>Não registrada</option><option value="true" ${p.presente===true?'selected':''}>Presente</option><option value="false" ${p.presente===false?'selected':''}>Ausente</option></select></span></label>`).join('')||'<p class="muted">Nenhum participante inscrito.</p>'}</div>
 <div class="trein-turma-acoes" style="margin-top:14px"><span>Após o encerramento, as presenças não poderão ser alteradas.</span><button class="btn" type="button" id="trein-encerrar-${turma}" onclick="treinTurmaEncerrar(${turma})">Encerrar turma</button></div>
 <p id="trein-turma-estado-${turma}" role="status"></p>`;
 const lista=await eadRequest('/admin/cursos/'+id+'/turmas');
 const info=lista.find(x=>Number(x.id)===Number(turma));
 if(info?.status!=='AGENDADO'){
   el.querySelectorAll('input,button').forEach(x=>x.disabled=true);
   const btn=document.getElementById('trein-encerrar-'+turma);if(btn)btn.textContent='Turma '+(info?.status||'indisponível');
 }
 el.querySelectorAll('.trein-turma-opcao input').forEach(c=>c.addEventListener('change',()=>treinTurmaContar(turma)));
 }catch(e){el.textContent='Erro: '+e.message}
}
function treinTurmaContar(turma){
 const n=document.querySelectorAll('.trein-turma-selecao-'+turma+':checked').length;
 const el=document.getElementById('trein-turma-contagem-'+turma);if(el)el.textContent=n+' selecionado'+(n===1?'':'s');
}
function treinTurmaFiltrar(turma){
 const termo=(document.getElementById('trein-turma-busca-'+turma)?.value||'').toLocaleLowerCase('pt-BR').trim();
 document.querySelectorAll('#trein-turma-opcoes-'+turma+' .trein-turma-opcao').forEach(el=>{el.hidden=!el.dataset.nome.includes(termo)});
}
async function treinTurmaIncluir(turma){
 const m=document.getElementById('trein-turma-estado-'+turma);
 const usuario_ids=[...document.querySelectorAll('.trein-turma-selecao-'+turma+':checked')].map(o=>Number(o.value));
 if(!usuario_ids.length){alert('Selecione pelo menos um funcionário.');return}
 try{await eadRequest('/admin/cursos/'+treinEditorCurso.id+'/turmas/'+turma+'/participantes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario_ids})});await treinTurmaParticipantes(turma);await treinTurmasCarregar()}
 catch(e){if(m)m.textContent='Erro: '+e.message}
}
async function treinTurmaEncerrar(turma){
 const id=treinEditorCurso.id;
 if(!confirm('Encerrar esta turma? Funcionários presentes serão concluídos; ausentes permanecerão pendentes. A operação será registrada em auditoria e bloqueará novas alterações de presença.'))return;
 const btn=document.getElementById('trein-encerrar-'+turma);if(btn)btn.disabled=true;
 try{
  const r=await eadRequest('/admin/cursos/'+id+'/turmas/'+turma+'/encerrar',{method:'POST'});
  alert('Turma encerrada. Concluídos: '+r.concluidos+'. Ausentes pendentes: '+r.ausentes_pendentes+'.');
  await treinTurmasCarregar();await treinTurmaParticipantes(turma);
 }catch(e){alert('Não foi possível encerrar: '+e.message);if(btn)btn.disabled=false}
}
async function treinTurmaPresenca(turma,participante,check){
 const m=document.getElementById('trein-turma-estado-'+turma);
 if(check.value==='')return;
 const anterior=check.dataset.anterior??'';
 try{await eadRequest('/admin/cursos/'+treinEditorCurso.id+'/turmas/'+turma+'/participantes/'+participante+'/presenca',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({presente:check.value==='true'})});check.dataset.anterior=check.value;if(m)m.textContent='Presença registrada.'}
 catch(e){if(m)m.textContent='Erro: '+e.message;await treinTurmaParticipantes(turma)}
}
</script>
<script>
// Configuração corporativa V12: somente nível 3 altera; leitura autenticada.
let empresaConfigAtual=null;
function empresaApiHeaders(){
 const token=sessionStorage.getItem('intranet_token')||localStorage.getItem('intranet_token')||localStorage.getItem('token')||sessionStorage.getItem('token');
 return token?{'Authorization':'Bearer '+token}:{};
}
async function empresaRequest(url,options={}){
 // Reutiliza o token da sessão existente quando disponível.
 const headers={...empresaApiHeaders(),...(options.headers||{})};
 const r=await fetch(url,{...options,headers});
 if(!r.ok){let e;try{e=await r.json()}catch{}throw new Error(e?.detail||'Erro HTTP '+r.status)}
 return r.json();
}

rong>Imagem ${n}</strong><img id="empresa-prev-banner${n}" style="width:100%;height:95px;object-fit:cover;background:#edf3f9;border-radius:8px"><input type="file" accept="image/png,image/jpeg,image/webp" style="width:100%" onchange="empresaUpload(this,'banner${n}')"></div>`).join('')}</div><p class="muted">Formatos JPG, PNG ou WebP, até 5 MB por imagem.</p><div class="row"><button class="btn" type="submit">Salvar dados da empresa</button><span id="empresa-status" role="status"></span></div></form></div>`}
async function empresaCarregarTela(){
 if(!document.getElementById('empresa-form'))return;

async function empresaSalvarCor(){
 const f=document.getElementById('empresa-form');if(!f)return;
 const hex=document.getElementById('empresa-cor-hex');const cor=(hex?.value||f.elements.cor_principal.value).trim();
 const status=document.getElementById('empresa-status');
 if(!/^#[0-9a-fA-F]{6}$/.test(cor)){if(status)status.textContent='Informe uma cor válida, exemplo: #2477ca';return;}
 f.elements.cor_principal.value=cor;
 if(status)status.textContent='Salvando cor...';
 const dados=Object.fromEntries(new FormData(f));dados.ativo=dados.ativo==='true';
 try{
  const salvo=await empresaRequest('/api/empresa/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});
  empresaConfigAtual=salvo;
  const confirmada=await empresaRequest('/api/empresa/config');
  empresaConfigAtual=confirmada;
  if(confirmada.cor_principal?.toLowerCase()!==cor.toLowerCase()){

   return;
  }

 }catch(e){if(status)status.textContent='Erro ao salvar cor: '+e.message;}

async function empresaSalvar(ev){ev.preventDefault();const s=document.getElementById('empresa-status');s.textContent='Salvando...';const f=ev.target;
 const d=Object.fromEntries(new FormData(f));d.ativo=d.ativo==='true';const hex=document.getElementById('empresa-cor-hex');if(hex&&/^#[0-9a-fA-F]{6}$/.test(hex.value.trim()))d.cor_principal=hex.value.trim();try{empresaConfigAtual=await empresaRequest('/api/empresa/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});s.textContent='Dados salvos com sucesso.';empresaAplicar(empresaConfigAtual)}catch(e){s.textContent=e.message}}
