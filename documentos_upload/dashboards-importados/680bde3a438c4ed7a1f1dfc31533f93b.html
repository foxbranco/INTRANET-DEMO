<body>
<main>
<header>
<h1>Resultados das Pesquisas</h1>
<p>Intranet Corporativa | Indicadores e resultados consolidados</p>
</header>

<section class="filtros">
<label for="pesquisa"><strong>Selecione uma pesquisa</strong></label>
<div style="margin-top:9px">
<select id="pesquisa"><option value="">Carregando pesquisas...</option></select>
</div>
</section>

<section class="indicadores">
<div class="cartao"><div class="rotulo">Questionários enviados</div><div class="numero" id="participantes">—</div></div>
<div class="cartao"><div class="rotulo">Respostas registradas</div><div class="numero" id="respostas">—</div></div>
<div class="cartao"><div class="rotulo">Situação</div><div id="situacao" style="font-size:19px;font-weight:bold;margin-top:12px">—</div></div>
</section>

<div id="mensagem"></div>
<section id="perguntas" class="perguntas"></section>
</main>

<script>
const API='/api/dashboards/pesquisas';
const seletor=document.getElementById('pesquisa');
const area=document.getElementById('perguntas');

function token(){
  return sessionStorage.getItem('intranet_token') ||
         parent.sessionStorage.getItem('intranet_token') || '';
}

async function consultar(caminho){
  const resposta=await fetch(API+caminho,{
    headers:{Authorization:'Bearer '+token()}
  });
  if(!resposta.ok)throw Error('Erro HTTP '+resposta.status);
  return resposta.json();
}

function elemento(tag,classe,texto){
  const e=document.createElement(tag);
  if(classe)e.className=classe;
  if(texto!==undefined)e.textContent=String(texto);
  return e;
}

function desenharDistribuicao(container, distribuicao, basePercentual){
  const entradas = Object.entries(distribuicao || {});
  const soma = entradas.reduce((s, [,v]) => s + Number(v), 0);
  const total = basePercentual === undefined ? soma : basePercentual;

  if (!soma || !total) {
    container.appendChild(
      elemento('div','vazio','Aguardando respostas')
    );
    return;
  }

  for (const [nome, valor] of entradas) {
    const percentual = 100 * Number(valor) / total;
    const linha = elemento('div','linha');
    const topo = elemento('div','linha-topo');

    topo.appendChild(elemento('span','',nome));
    topo.appendChild(
      elemento('strong','',
        valor + ' (' + percentual.toFixed(1) + '%)'
      )
    );

    const trilho = elemento('div','trilho');
    const barra = elemento('div','barra');

    barra.style.width = Math.min(100,percentual) + '%';

    trilho.appendChild(barra);
    linha.append(topo,trilho);
    container.appendChild(linha);
  }
}

function desenharPergunta(pergunta){
  const cartao = elemento('article','cartao');

  cartao.appendChild(
    elemento('h3','',pergunta.enunciado)
  );

  cartao.appendChild(
    elemento('div','rotulo',
      pergunta.total + ' resposta(s)')
  );

  if (pergunta.tipo === 'TEXTO') {
    cartao.appendChild(
      elemento('div','media',pergunta.comentarios || 0)
    );
    cartao.appendChild(
      elemento('div','rotulo',
        'Comentários registrados — conteúdo não exibido')
    );
  }
  else {
    if (pergunta.tipo.startsWith('NOTA_') &&
        pergunta.media !== null &&
        pergunta.media !== undefined) {

      const maximo = pergunta.tipo === 'NOTA_1_5' ? 5 : 10;

      cartao.appendChild(
        elemento('div','media',
          'Média: ' + pergunta.media + ' / ' + maximo)
      );
    }

    if (pergunta.tipo === 'MULTIPLA_ESCOLHA') {
      desenharDistribuicao(
        cartao,
        pergunta.distribuicao,
        pergunta.total
      );
    }
    else {
      desenharDistribuicao(
        cartao,
        pergunta.distribuicao
      );
    }
  }

  return cartao;
}

async function carregarResultado(id){
  area.replaceChildren();
  document.getElementById('mensagem').replaceChildren();
  if(!id)return;

  try{
    const dados=await consultar('/'+encodeURIComponent(id));
    document.getElementById('participantes').textContent=dados.participantes;
    document.getElementById('respostas').textContent=dados.total_respostas;
    document.getElementById('situacao').textContent=dados.status;

    if(dados.protegido){
      document.getElementById('mensagem').appendChild(
        elemento('div','aviso',dados.mensagem)
      );
      return;
    }

    for(const pergunta of dados.perguntas){
      area.appendChild(desenharPergunta(pergunta));
    }

    if(!dados.perguntas.length){
      area.appendChild(elemento('div','vazio','Nenhuma pergunta cadastrada'));
    }
  }catch(erro){
    document.getElementById('mensagem').appendChild(
      elemento('div','aviso','Não foi possível carregar os resultados: '+erro.message)
    );
  }
}

async function iniciar(){
  try{
    const pesquisas=await consultar('/lista');
    seletor.replaceChildren();
    for(const p of pesquisas){
      const opcao=document.createElement('option');
      opcao.value=p.id;
      opcao.textContent=p.titulo;
      seletor.appendChild(opcao);
    }
    if(pesquisas.length)await carregarResultado(pesquisas[0].id);
    else seletor.appendChild(elemento('option','','Nenhuma pesquisa cadastrada'));
  }catch(erro){
    seletor.replaceChildren();
    seletor.appendChild(elemento('option','','Erro ao carregar pesquisas'));
    document.getElementById('mensagem').appendChild(
      elemento('div','aviso','Não foi possível acessar a API: '+erro.message)
    );
  }
}

seletor.addEventListener('change',()=>carregarResultado(seletor.value));
iniciar();
</script>
<script id="organizar-cabecalho-pesquisas">
(function(){
  function organizar(){
    const cabecalho = document.querySelector('header');
    const filtros = document.querySelector('.filtros');

    if (!cabecalho || !filtros) return;
    if (cabecalho.contains(filtros)) return;

    cabecalho.appendChild(filtros);
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', organizar);
  } else {
    organizar();
  }
})();
</script>
</body>
