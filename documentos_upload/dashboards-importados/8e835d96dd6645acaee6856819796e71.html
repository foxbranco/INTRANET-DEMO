</style></head><body><header class="top"><div><div class="eyebrow">INTELIGÊNCIA CORPORATIVA · MEGAVIG</div><h1>Megavig 360°</h1><div class="subtitle">Pessoas · Documentos · Engajamento · Desenvolvimento</div></div><div class="topright"><div>● Dados atualizados ao abrir</div><button class="megavig-email-btn" id="megavig360-email-btn" type="button">✉ Enviar PDF para meu e-mail</button><div class="megavig-email-msg" id="megavig360-email-msg" role="status" aria-live="polite" hidden></div></div></header><main id="content"></main><!-- MEGAVIG_360_USUARIO --><!-- MEGAVIG_360_DADOS --><script>

(function(){const n=document.getElementById('megavig360-dados'),root=document.getElementById('content');let d={};if(n){try{d=JSON.parse(n.textContent)}catch(e){}}const get=k=>Object.prototype.hasOwnProperty.call(d,k)&&d[k]!==null&&Number.isFinite(Number(d[k]))?Number(d[k]):null;const fmt=v=>v===null?'—':v.toLocaleString('pt-BR',{maximumFractionDigits:1});const metric=(label,key,note='',accent='#2b85b9')=>{const v=get(key);return `<div class="metric" style="--accent:${accent}"><div class="label">${label}</div><div class="value ${v===null?'missing':''}">${fmt(v)}</div><div class="note">${v===null?'Aguardando integração':note}</div></div>`};const section=(num,title,subtitle,body)=>`<section class="section"><div class="sectionhead"><h2>${title}</h2><span class="desc">${subtitle}</span></div>${body}</section>`;const grid=(items,cl='')=>`<div class="metrics ${cl}">${items.join('')}</div>`;const line=(label,key)=>`<div class="status"><span>${label}</span><b>${fmt(get(key))}</b></div>`;

// Anéis concêntricos: externo esperado (azul), interno obtido (roxo), escala 0–100.

const loginsMes=Array.isArray(d.intranet_logins_mensal)?d.intranet_logins_mensal:[];
const serieLogins=nomes.map((nome,i)=>({nome,...(loginsMes.find(x=>Number(x.mes)===i+1)||{})}));
const validosLogins=serieLogins.filter(x=>typeof x.logins==='number'&&Number.isFinite(x.logins));
const maiorLogin=Math.max(1,...validosLogins.map(x=>x.logins));
const eixoLogin=Math.max(4,Math.ceil(maiorLogin/4)*4);
const posYLogin=v=>148-(v/eixoLogin)*117;
const pontosLogin=serieLogins.map((x,i)=>({x:63+i*68, y:posYLogin(x.logins), v:x.logins, ok:typeof x.logins==='number'&&Number.isFinite(x.logins), nome:x.nome}));
const pontosValidos=pontosLogin.filter(x=>x.ok);
const linhaLogin=pontosValidos.length?`<polyline fill="none" stroke="#d32f2f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="${pontosValidos.map(x=>`${x.x},${x.y}`).join(' ')}"/>`:'';
const barrasLogin=linhaLogin+pontosLogin.map(x=>`${x.ok?`<circle cx="${x.x}" cy="${x.y}" r="5" fill="#d32f2f"><title>${x.nome}: ${x.v} logins</title></circle>`:''}<text x="${x.x}" y="169" text-anchor="middle" font-size="12" fill="#385875">${x.nome}</text>`).join('');
const linhasLogin=[0,1,2,3,4].map(i=>{const v=Math.round(eixoLogin*i/4),yy=posYLogin(v);return `<line x1="45" y1="${yy}" x2="840" y2="${yy}" stroke="#e3eaf1"/><text x="38" y="${yy+4}" text-anchor="end" font-size="11" fill="#6a7d91">${v}</text>`}).join('');
const cardEng=root.querySelectorAll('.section')[2];
if(cardEng){
 const area=document.createElement('div');area.className='eng-historico';
 area.innerHTML=validosLogins.length?`<div class="historico-info">Acessos à Intranet por mês · ${new Date().getFullYear()}</div><div class="chart-wrap"><svg role="img" aria-label="Linha vermelha de logins mensais na Intranet" viewBox="0 0 860 182" xmlns="http://www.w3.org/2000/svg">${linhasLogin}${barrasLogin}</svg></div><div class="chart-note">Logins bem-sucedidos; mês atual até hoje. Índice: funcionários ativos distintos com login no ano ÷ funcionários ativos.</div>`:'<div class="historico-info">Série de logins ainda não disponível na API V15.</div>';
 cardEng.appendChild(area);
}


// Horas dos cursos com conclusão no mês, contando cada curso uma vez por mês.
const cardTrein=[...root.querySelectorAll('.section')].find(el=>el.querySelector('h2')?.textContent.trim()==='Treinamentos');
if(cardTrein){
 const horasMes=Array.isArray(d.treinamentos_horas_mensal)?d.treinamentos_horas_mensal:[];
 const serieHoras=nomes.map((nome,i)=>({nome,...(horasMes.find(x=>Number(x.mes)===i+1)||{})}));
 const validas=serieHoras.filter(x=>typeof x.horas==='number'&&Number.isFinite(x.horas));
 const area=document.createElement('div');area.className='trein-historico';
 if(validas.length){
  const maxHoras=Math.max(1,...validas.map(x=>x.horas));
  const escala=Math.max(1,Math.ceil(maxHoras*10)/10);
  const barraX=40, barraMax=270, topo=10, passo=19;
  const linhas=[0,0.25,0.5,0.75,1].map(f=>{const x=barraX+barraMax*f;return `<line x1="${x}" y1="8" x2="${x}" y2="240" stroke="#e3eaf1" stroke-width="1"/><text x="${x}" y="255" font-size="10" fill="#6a7d91" text-anchor="middle">${fmt(escala*f)}</text>`}).join('');
  const barras=serieHoras.map((x,i)=>{const y=topo+i*passo,ok=typeof x.horas==='number'&&Number.isFinite(x.horas);const largura=ok?Math.max(0,barraMax*x.horas/escala):0;return `<text x="3" y="${y+11}" font-size="11" fill="#385875">${x.nome}</text>${ok?`<rect x="${barraX}" y="${y+1}" width="${largura}" height="12" rx="2" fill="#17965b"><title>${x.nome}: ${fmt(x.horas)} horas realizadas</title></rect>`:''}`}).join('');
  area.innerHTML=`<div class="historico-info">Horas de treinamento realizadas</div><div class="chart-wrap"><svg viewBox="0 0 320 263" role="img" aria-label="Barras horizontais de horas de treinamento realizadas por mês">${linhas}${barras}</svg></div>`;
 }else area.innerHTML='<div class="historico-info">Histórico mensal de horas ainda não disponível. Verifique a API e as datas de conclusão.</div>';
 cardTrein.appendChild(area);
}

})();

// Megavig Pulse: central extensivel. Configuracoes persistidas via API.
(function(){
 const root=document.getElementById('content');if(!root)return;
 const nivel=Number(window.MEGAVIG_PULSE_NIVEL);
 if(![1,2,3].includes(nivel))return;
 const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 if(nivel===1){const card=document.createElement('section');card.className='section pulse-demo pulse-empresa-logo';card.innerHTML='<div class="pulse-logo-holder"></div>';const logo=window.MEGAVIG_PULSE_LOGO;if(logo){const img=document.createElement('img');img.src=logo;img.alt='Logotipo oficial da Megavig';card.querySelector('.pulse-logo-holder').appendChild(img);}root.appendChild(card);return;}
 // O iframe isolado usa o fetch autenticado da Bridge da Intranet; nunca recebe o token.
 async function api(path,method='GET',data){const r=await fetch('/api/pulse'+path,{method,headers:data?{'Content-Type':'application/json'}:{},...(data?{body:JSON.stringify(data)}:{})});let x={};try{x=await r.json()}catch(e){}if(!r.ok)throw Error(x.detail||'HTTP '+r.status);return x;}
 const panel=document.createElement('section');panel.className='section pulse-demo';panel.innerHTML='<div class="pulse-header"><div class="pulse-brand"><div class="pulse-logo">◉</div><div class="pulse-name">Megavig Pulse <span class="pulse-ai-label">(minhas automações)</span></div></div></div><div id="pulse-subscriptions" class="pulse-subscriptions"></div><div class="pulse-bottom"><button type="button" class="pulse-config-btn" id="pulse-open">⚙ Configurar Pulse</button></div>';root.appendChild(panel);
 const list=panel.querySelector('#pulse-subscriptions');let itens=[],catalogo=[],editando=null;
 const modal=document.createElement('div');modal.className='pulse-modal';modal.hidden=true;
 modal.innerHTML='<div class="pulse-dialog" role="dialog" aria-modal="true" aria-labelledby="pulse-title"><h2 id="pulse-title">Configurar Megavig Pulse</h2><p>Relatorios e alertas permitidos para seu perfil</p><div class="pulse-fields"><label>Tipo de automação<select id="pulse-type"></select></label><label>Relatório ou alerta<select id="pulse-kind"></select></label><label>Frequência<select id="pulse-freq"><option value="DIARIO">Todos os dias</option><option value="UTEIS">Dias úteis</option><option value="SEMANAL">Semanal</option><option value="MENSAL">Mensal</option><option value="EVENTO">Quando ocorrer evento</option></select></label><label>Horário<input id="pulse-hour" type="time" value="08:00"></label><label>Canal<select id="pulse-channel"><option value="EMAIL">E-mail corporativo</option><option value="INTRANET">Notificação na Intranet</option></select></label></div><p class="pulse-preview" id="pulse-notice">Agendamentos são armazenados no servidor. Após salvar, clique em Ativar. Envios dependem do motor de execução habilitado no servidor. Apenas o Megavig 360° por e-mail está disponível nesta fase.</p><div class="pulse-actions"><button type="button" id="pulse-close">Cancelar</button><button type="button" class="pulse-primary" id="pulse-save">Salvar configuração</button></div></div>';document.body.appendChild(modal);
 const tipo=modal.querySelector('#pulse-type'),kind=modal.querySelector('#pulse-kind');
 const render=()=>{
   const abertos=new Set([...list.querySelectorAll('details.pulse-group[open]')].map(el=>el.dataset.grupo));
   const posicaoRolagem=list.scrollTop;
   if(!itens.length){list.innerHTML='<div class="pulse-empty">Nenhuma automação cadastrada.</div>';return;}
   const nomesTipo={DASHBOARD:'Dashboards',AVALIACAO:'Avaliações',TREINAMENTO:'Treinamentos',RH:'RH',ALERTA:'Alertas',RADAR:'Radar Megavig'};
   const grupos=new Map();
   for(const x of itens){const chave=x.tipo||String(x.codigo||'').split(':')[0]||'OUTROS';if(!grupos.has(chave))grupos.set(chave,[]);grupos.get(chave).push(x);}
   list.innerHTML=[...grupos].map(([chave,registros])=>{
     const linhas=registros.map(x=>{
       const statusNome=({RASCUNHO:'Rascunho',PAUSADA:'Pausada',ATIVA:'Ativa'})[x.status]||x.status;
       const frequenciaNome=({DIARIO:'Diário',UTEIS:'Dias úteis',SEMANAL:'Semanal',MENSAL:'Mensal',EVENTO:'Por evento'})[x.frequencia]||x.frequencia;
       const canalNome=({EMAIL:'E-mail',INTRANET:'Intranet'})[x.canal]||x.canal;
       return '<div class="pulse-subscription"><div class="pulse-subscription-info"><strong title="'+safe(x.nome)+'">'+safe(x.nome)+'</strong><span class="pulse-row-meta">'+safe(frequenciaNome)+' · '+safe(x.horario||'Por evento')+' · '+safe(canalNome)+'</span><span class="pulse-status pulse-status-'+safe(x.status)+'">'+safe(statusNome)+'</span></div><div class="pulse-subscription-actions">'+(x.status==='RASCUNHO'||x.status==='PAUSADA'?'<button type="button" class="pulse-activate" data-id="'+safe(x.id)+'">Ativar</button>':x.status==='ATIVA'?'<button type="button" class="pulse-pause" data-id="'+safe(x.id)+'">Pausar</button>':'')+'<button type="button" class="pulse-edit" data-id="'+safe(x.id)+'">Editar</button><button type="button" class="pulse-remove" data-id="'+safe(x.id)+'" aria-label="Excluir">×</button></div></div>';
     }).join('');
     return '<details class="pulse-group" data-grupo="'+safe(chave)+'"><summary class="pulse-group-title"><span class="pulse-expand-icon" aria-hidden="true">▸</span><b>'+safe(nomesTipo[chave]||chave)+'</b> <span>'+registros.length+'</span></summary><div class="pulse-group-rows">'+linhas+'</div></details>';
   }).join('')+'<details class="pulse-group pulse-demo-only" data-grupo="RADAR_PREVIA"><summary class="pulse-group-title"><span class="pulse-expand-icon" aria-hidden="true">▸</span><b>Radar Megavig</b> <span class="pulse-preview-tag">Prévia visual</span></summary><div class="pulse-group-rows"><div class="pulse-subscription"><div class="pulse-subscription-info"><strong>Notícias e redes sociais</strong><span class="pulse-row-meta">Diário · 15:00 · E-mail</span><span class="pulse-status pulse-status-RASCUNHO">Exemplo</span></div><div class="pulse-subscription-actions"><span class="pulse-preview-tag">Não configurado</span></div></div></div></details>';
   list.querySelectorAll('details.pulse-group').forEach(el=>{if(abertos.has(el.dataset.grupo))el.open=true;});
   list.scrollTop=posicaoRolagem;
 };
 const load=async()=>{try{const [c,a]=await Promise.all([api('/catalogo'),api('/automacoes')]);catalogo=c.itens||[];itens=a.itens||[];render();}catch(e){list.textContent='Pulse indisponível: '+e.message;}};
 const updateKinds=()=>{const opts=catalogo.filter(x=>x.tipo===tipo.value);kind.innerHTML=opts.map(x=>'<option value="'+safe(x.codigo)+'">'+safe(x.nome)+'</option>').join('');};
 list.addEventListener('click',async ev=>{const b=ev.target.closest('.pulse-activate,.pulse-pause');if(!b)return;b.disabled=true;try{await api('/automacoes/'+b.dataset.id+(b.classList.contains('pulse-activate')?'/ativar':'/pausar'),'POST');await load();}catch(e){alert(e.message)}finally{b.disabled=false}});
 panel.querySelector('#pulse-open').addEventListener('click',async()=>{editando=null;modal.querySelector('#pulse-title').textContent='Configurar Megavig Pulse';modal.querySelector('#pulse-save').textContent='Salvar configuração';await load();if(!catalogo.length){alert('Nenhuma automação disponível para seu usuário.');return;}tipo.innerHTML=[...new Set(catalogo.map(x=>x.tipo))].map(x=>'<option value="'+safe(x)+'">'+safe(({DASHBOARD:'Dashboards',AVALIACAO:'Avaliações',TREINAMENTO:'Treinamentos',RH:'Funcionários e RH',ALERTA:'Alertas',RADAR:'Radar Megavig'})[x]||x)+'</option>').join('');updateKinds();modal.hidden=false;tipo.focus();});
 list.addEventListener('click',async e=>{const b=e.target.closest('.pulse-edit[data-id]');if(!b)return;
   const x=itens.find(v=>String(v.id)===String(b.dataset.id));if(!x)return;
   editando=x.id;
   tipo.innerHTML=[...new Set(catalogo.map(v=>v.tipo))].map(v=>'<option value="'+safe(v)+'">'+safe(({DASHBOARD:'Dashboards',AVALIACAO:'Avaliações',TREINAMENTO:'Treinamentos',RH:'Funcionários e RH',ALERTA:'Alertas',RADAR:'Radar Megavig'})[v]||v)+'</option>').join('');
   tipo.value=x.tipo||'DASHBOARD';updateKinds();kind.value=x.codigo;
   modal.querySelector('#pulse-freq').value=x.frequencia;
   modal.querySelector('#pulse-hour').value=x.horario||'08:00';
   modal.querySelector('#pulse-channel').value=x.canal;
   modal.querySelector('#pulse-title').textContent='Editar agendamento';
   modal.querySelector('#pulse-save').textContent='Salvar alterações';
   modal.querySelector('#pulse-notice').textContent='Ao salvar uma edição, o agendamento fica pausado. Revise e clique em Ativar para retomar os envios.';
   modal.hidden=false;tipo.focus();
 });
 tipo.addEventListener('change',updateKinds);
 modal.querySelector('#pulse-close').addEventListener('click',()=>modal.hidden=true);
 modal.querySelector('#pulse-save').addEventListener('click',async()=>{const b=modal.querySelector('#pulse-save');b.disabled=true;try{await api(editando?'/automacoes/'+editando:'/automacoes',editando?'PUT':'POST',{codigo:kind.value,frequencia:modal.querySelector('#pulse-freq').value,horario:modal.querySelector('#pulse-hour').value,canal:modal.querySelector('#pulse-channel').value});const foiEdicao=!!editando;editando=null;modal.hidden=true;await load();if(foiEdicao)alert('Alterações salvas. Clique em Ativar para retomar os envios.');}catch(e){alert(e.message)}finally{b.disabled=false}});
   const confirmar=document.createElement('div');confirmar.className='pulse-confirm';confirmar.hidden=true;
  confirmar.innerHTML='<div class="pulse-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="pulse-confirm-title"><h3 id="pulse-confirm-title">Excluir agendamento?</h3><p id="pulse-confirm-text"></p><div class="pulse-confirm-actions"><button type="button" id="pulse-confirm-cancel">Cancelar</button><button type="button" id="pulse-confirm-delete">Excluir</button></div></div>';
  document.body.appendChild(confirmar);let excluirId=null;
  const fecharConfirmacao=()=>{confirmar.hidden=true;excluirId=null;};
  confirmar.querySelector('#pulse-confirm-cancel').addEventListener('click',fecharConfirmacao);
  confirmar.addEventListener('click',e=>{if(e.target===confirmar)fecharConfirmacao();});
  list.addEventListener('click',e=>{const b=e.target.closest('.pulse-remove[data-id]');if(!b)return;const x=itens.find(v=>String(v.id)===String(b.dataset.id));excluirId=b.dataset.id;confirmar.querySelector('#pulse-confirm-text').textContent='Deseja excluir '+(x?.nome||'esta automação')+'? Esta ação não pode ser desfeita.';confirmar.hidden=false;confirmar.querySelector('#pulse-confirm-cancel').focus();});
  confirmar.querySelector('#pulse-confirm-delete').addEventListener('click',async()=>{if(!excluirId)return;const id=excluirId,b=confirmar.querySelector('#pulse-confirm-delete');b.disabled=true;try{await api('/automacoes/'+encodeURIComponent(id),'DELETE');fecharConfirmacao();await load();informar('Agendamento excluído.');}catch(e){informar('Não foi possível excluir: '+e.message,true);fecharConfirmacao();}finally{b.disabled=false;}});
 modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape'){modal.hidden=true;fecharConfirmacao();}});load();
})();
</script><script id="pulse-sincronizar-altura-v6">
(function(){
  const painel=document.querySelector('#content > .pulse-demo:not(.pulse-empresa-logo)');
  const aval=[...document.querySelectorAll('#content > .section')].find(el=>el!==painel&&el.querySelector('.sectionhead h2')?.textContent.includes('Avaliações de desempenho'));
  if(!painel||!aval)return;
  const ajustar=()=>{
    if(window.matchMedia('(min-width:1151px)').matches){
      const altura=Math.max(150,Math.ceil(aval.getBoundingClientRect().height));
      painel.style.setProperty('height',altura+'px','important');
      painel.style.setProperty('max-height',altura+'px','important');
    }else{
      painel.style.removeProperty('height');
      painel.style.removeProperty('max-height');
    }
  };
  ajustar();
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(ajustar).observe(aval);
  window.addEventListener('resize',ajustar);
})();
</script><script id="pulse-rolagem-funcional-v8">
(function(){
  const lista=document.getElementById('pulse-subscriptions');
  if(!lista)return;
  lista.setAttribute('tabindex','0');
  lista.setAttribute('aria-label','Agendamentos Megavig Pulse: use a roda do mouse ou as setas para percorrer');
  lista.addEventListener('wheel',function(e){
    if(this.scrollHeight<=this.clientHeight+1)return;
    const passo=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*this.clientHeight:e.deltaY;
    const antes=this.scrollTop;
    this.scrollTop+=passo;
    if(this.scrollTop!==antes)e.preventDefault();
  },{passive:false});
  lista.addEventListener('keydown',function(e){
    const passo=e.key==='ArrowDown'?36:e.key==='ArrowUp'?-36:e.key==='PageDown'?this.clientHeight*.8:e.key==='PageUp'?-this.clientHeight*.8:e.key==='Home'?-this.scrollHeight:e.key==='End'?this.scrollHeight:0;
    if(passo){this.scrollTop+=passo;e.preventDefault();}
  });
})();
