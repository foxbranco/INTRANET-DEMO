/* Acesso rápido: quatro cartões alinhados em telas largas */

/* Prioridade das janelas de cadastro */
#modal-root {
    position: relative;
    z-index: 1000;
}
#modal-root .modal-back {
    z-index: 1001 !important;
}

/* V11 - Aproveitamento da largura do monitor */
@media (min-width: 1100px) {
    body .container,
    body .wrap,
    body .content-container,
    body .main-container {
        max-width: none !important;
        width: calc(100% - 60px) !important;
        margin-left: auto !important;
        margin-right: auto !important;
    }

    .admin-nav {
        display: flex !important;
        flex-wrap: nowrap !important;
        justify-content: space-between !important;
        gap: 8px !important;
        overflow-x: auto !important;
        align-items: stretch !important;
    }

    .admin-nav button {
        flex: 0 0 auto !important;
        white-space: nowrap !important;
        padding: 12px 10px !important;
        font-size: 14px !important;
    }
}

@media (max-width: 1099px) {
    .admin-nav {
        display: flex !important;
        flex-wrap: nowrap !important;
        overflow-x: auto !important;
        gap: 8px !important;
    }

    .admin-nav button {
        flex-shrink: 0 !important;
        white-space: nowrap !important;
    }
}

window.abrirPdfProtegido = async function(id) {
  const caminho = pdfPath(id);
  const token = sessionStorage.getItem('intranet_token');

  if (!token) {
    alert('Sessão não encontrada. Faça login novamente.');
    return;
  }

  if (!caminho || caminho === '#') {
    alert('Documento não encontrado.');
    return;
  }

  const janela = window.open('', '_blank');

  try {
    const resposta = await fetch('/api/documentos/' + caminho, {
      headers: { Authorization: 'Bearer ' + token }
    });

    if (!resposta.ok) {
      if (janela) janela.close();
      alert('Erro ao abrir PDF. Status: ' + resposta.status);
      return;
    }

    const blob = await resposta.blob();
    const url = URL.createObjectURL(blob);

    if (janela) {
      janela.location.href = url;
    } else {
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.click();
    }

    setTimeout(() => URL.revokeObjectURL(url), 60000);

  } catch (erro) {
    if (janela) janela.close();
    alert('Erro ao carregar PDF: ' + erro.message);
  }
}

let comunicadoSelecionado = null;

function abrirComunicadoReal(id) {
    const comunicado = comunicadosPublicos.find(
        c => Number(c.id) === Number(id)
    );
    if (!comunicado) return;

    comunicadoSelecionado = comunicado;
    page = 'comunicado-detalhe';
    render();
    window.scrollTo(0,0);

    registrarVisualizacaoDetalhe(comunicado);
}

async function registrarVisualizacaoDetalhe(comunicado) {
    try {
        const resposta = await fetch(
            '/api/comunicados/' + comunicado.id + '/visualizacao',
            {
                method: 'POST',
                headers: {
                    Authorization: 'Bearer ' +
                        sessionStorage.getItem('intranet_token')
                }
            }
        );

        if (!resposta.ok) return;

        const dados = await resposta.json();
        comunicado.visualizacoes = dados.visualizacoes;

        if (page === 'comunicado-detalhe' &&
            comunicadoSelecionado?.id === comunicado.id) {
            render();
        }
    } catch (erro) {
        console.error('Visualizacao nao registrada:', erro);
    }
}

/* PAGINACAO COMUNICADOS V1 */
let paginaComunicados = 1;
const comunicadosPorPagina = 10;

function atualizarPaginacaoComunicados() {
    const area = document.getElementById('content');
    if (!area || page !== 'comunicados') return;

    const artigos = [...area.querySelectorAll('article.card.news')];
    if (!artigos.length) return;

    const filtrados = artigos.filter(artigo => {
    if (!categoriaComunicados) return true;
    const id = Number(
        artigo.querySelector('button[onclick*="abrirComunicadoReal"]')
            ?.getAttribute('onclick')
            ?.match(/\d+/)?.[0]
    );
    const comunicado = comunicadosPublicos.find(x => Number(x.id) === id);
    return comunicado?.categoria === categoriaComunicados;
});

const totalPaginas = Math.max(1,
    Math.ceil(filtrados.length / comunicadosPorPagina));
    paginaComunicados = Math.min(Math.max(1,paginaComunicados),totalPaginas);

    artigos.forEach((artigo,i) => { const posicao = filtrados.indexOf(artigo);
        artigo.style.setProperty('display',
            posicao >= (paginaComunicados-1)*comunicadosPorPagina &&
            posicao >= 0 && posicao < paginaComunicados*comunicadosPorPagina
                ? 'flex'
                : 'none', 'important');
    });

    let navegacao = document.getElementById('paginacao-comunicados');

    if (!navegacao) {
        navegacao = document.createElement('div');
        navegacao.id = 'paginacao-comunicados';
        navegacao.style.cssText =
            'display:flex;justify-content:center;align-items:center;gap:12px;margin:22px 0;flex-wrap:wrap';

        const coluna = artigos[0].parentElement;
        coluna.appendChild(navegacao);
    }

    if (totalPaginas <= 1) {
        navegacao.innerHTML = '';
        return;
    }

    navegacao.innerHTML = `
        <button class="btn secondary"
            ${paginaComunicados===1?'disabled':''}
            onclick="mudarPaginaComunicados(${paginaComunicados-1})">
            Anterior
        </button>

        <span>Página ${paginaComunicados} de ${totalPaginas}</span>

        <button class="btn secondary"
            ${paginaComunicados===totalPaginas?'disabled':''}
            onclick="mudarPaginaComunicados(${paginaComunicados+1})">
            Próxima
        </button>
    `;
}

function mudarPaginaComunicados(numero) {
    paginaComunicados = numero;
    atualizarPaginacaoComunicados();
    window.scrollTo({top:0,behavior:'smooth'});
}

window.mudarPaginaComunicados = mudarPaginaComunicados;

function filtrarCategoriaComunicados(categoria) {
    categoriaComunicados = categoria;
    paginaComunicados = 1;
    atualizarPaginacaoComunicados();

async function salvarNovoUsuario(event){
    event.preventDefault();

    const formulario = document.getElementById('formNovoUsuario');
    const aviso = document.getElementById('erroNovoUsuario');
    const botao = formulario.querySelector('button[type="submit"]');

    if(botao.disabled) return;

    const dados = Object.fromEntries(new FormData(formulario).entries());

    for(const chave of Object.keys(dados)){
        if(typeof dados[chave]==='string'){
            dados[chave]=dados[chave].trim();
            if(!dados[chave]) dados[chave]=null;
        }
    }

    dados.nivel_acesso = Number(dados.nivel_acesso);
    dados.tipo = Number(dados.tipo);
    dados.ativo = dados.ativo === 'true';

    botao.disabled = true;
    aviso.textContent = '';

    try{
        const usuarioId = formulario.dataset.usuarioId;
        if(usuarioId){
            delete dados.cpf;
        }

        const resposta = await fetch(
            usuarioId ? '/api/usuarios/' + encodeURIComponent(usuarioId) : '/api/usuarios',{
            method: usuarioId ? 'PUT' : 'POST',
            headers:{
                'Content-Type':'application/json',
                'Authorization':'Bearer '+sessionStorage.getItem('intranet_token')
            },
            body:JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        if(!resposta.ok){
            const detalhe = resultado.detail;
            throw new Error(typeof detalhe==='string'
                ? detalhe : JSON.stringify(detalhe || 'Erro ao cadastrar'));
        }

        closeModal();
        await carregarUsuariosReais();
        alert(usuarioId ? 'Usuário atualizado com sucesso!' : 'Usuário cadastrado com sucesso!');

    }catch(erro){
        aviso.textContent = erro.message;
    }finally{
        botao.disabled = false;
    }
}

async function dashAdminApi(caminho, metodo='GET', dados=null) {
    const token = sessionStorage.getItem('intranet_token');

    if (!token) throw new Error('Sessao nao encontrada.');

    const opcoes = {
        method: metodo,
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        }
    };

    if (dados !== null) {
        opcoes.body = JSON.stringify(dados);
    }

    const resposta = await fetch('/api/dashboards/admin' + caminho, opcoes);

    const texto = await resposta.text();
    let resultado = {};

    try {
        resultado = texto ? JSON.parse(texto) : {};
    } catch(e) {
        resultado = {detail:texto};
    }

    if (!resposta.ok) {
        throw new Error(resultado.detail || 'Erro na operacao.');
    }

    return resultado;
}

async function dashAdminCarregar() {
    if (dashAdminCarregando) return;

    dashAdminCarregando = true;

    try {
        const [c,d,v,p] = await Promise.all([
            dashAdminApi('/caixinhas'),
            dashAdminApi('/dashboards'),
            dashAdminApi('/vinculos'),
            dashAdminApi('/permissoes')
        ]);

        dashAdminDados = {
            caixinhas:c,
            dashboards:d,
            vinculos:v,
            permissoes:p.permissoes || []
        };

        dashAdminCarregado = true;

    } catch(e) {
        dashAdminErro = e.message;
    } finally {
        dashAdminCarregando = false;
        render();
    }
}

async function dashAdminSalvar(event) {
    event.preventDefault();

    const form = event.target;
    const f = new FormData(form);

    try {
        let caminho = '';
        let metodo = 'POST';
        let dados = {};

        if (dashAdminAba === 'caixinhas') {
            const id = f.get('id');

            caminho = id ? '/caixinhas/' + id : '/caixinhas';
            metodo = id ? 'PUT' : 'POST';

            dados = {
                nome:f.get('nome'),
                descricao:f.get('descricao'),
                icone:f.get('icone'),
                ordem:Number(f.get('ordem') || 0),
                ativo:f.get('ativo') === 'on'
            };

        } else if (dashAdminAba === 'dashboards') {

            const id = f.get('id');
            caminho = id ? '/dashboards/' + id : '/dashboards';
            metodo = id ? 'PUT' : 'POST';

            dados = id ? {
                nome:f.get('nome'),
                descricao:f.get('descricao'),
                ativo:dashAdminDados.dashboards.find(d=>Number(d.id)===Number(id))?.ativo ?? true
            } : {
                nome:f.get('nome'),
                descricao:f.get('descricao'),
                codigo:f.get('codigo')
            };

        } else if (dashAdminAba === 'vinculos') {

            caminho = '/vinculos';

            dados = {
                caixinha_id:Number(f.get('caixinha_id')),
                dashboard_id:Number(f.get('dashboard_id')),
                ordem:Number(f.get('ordem') || 0)
            };

        } else if (dashAdminAba === 'permissoes') {
            caminho = '/permissoes';
            const modalidade = f.get('modalidade');
            dados = {
                vinculo_id: Number(f.get('vinculo_id')),
                modalidade,
                usuario_id: modalidade === 'USUARIO' ? Number(f.get('usuario_id')) : null,
                cargo: modalidade === 'CARGO' ? f.get('cargo') : null,
                departamento: modalidade === 'DEPARTAMENTO' ? f.get('departamento') : null
            };
        }

        await dashAdminApi(caminho, metodo, dados);

        dashAdminErro = '';
        dashAdminCarregado = false;

        alert('Cadastro realizado com sucesso!');

        await dashAdminCarregar();

    } catch(e) {
        alert('Nao foi possivel salvar: ' + e.message);
    }
}

window.dashAdminMoverVinculo = async function(id, direcao) {
    if (window.dashAdminMovendoVinculo) return;

    const atual = dashAdminDados.vinculos.find(
        v => Number(v.id) === Number(id)
    );
    if (!atual) return;

    const grupo = dashAdminDados.vinculos
        .filter(v => Number(v.caixinha_id) === Number(atual.caixinha_id))
        .sort((a,b) =>
            Number(a.ordem) - Number(b.ordem) ||
            Number(a.id) - Number(b.id)
        );

    const indice = grupo.findIndex(v => Number(v.id) === Number(id));
    const destino = indice + direcao;

    if (indice < 0 || destino < 0 || destino >= grupo.length) return;

    // Troca os dashboards de posicao na mesma caixinha
    [grupo[indice], grupo[destino]] =
        [grupo[destino], grupo[indice]];

    window.dashAdminMovendoVinculo = true;

    try {
        // Grava a nova sequencia
        for (let i = 0; i < grupo.length; i++) {
            await dashAdminApi('/vinculos/' + grupo[i].id, 'PUT', {
                ordem: i
            });
        }

        dashAdminCarregado = false;
        await dashAdminCarregar();

    } catch(e) {
        alert('Erro ao reordenar dashboards: ' + e.message);
        dashAdminCarregado = false;
        await dashAdminCarregar();
    } finally {
        window.dashAdminMovendoVinculo = false;
    }
};
window.dashAdminMoverCaixinha = async function(id, direcao) {
    if (window.dashAdminMovendoCaixinha) return;

    const lista = [...dashAdminDados.caixinhas]
        .sort((a,b) => Number(a.ordem) - Number(b.ordem) || Number(a.id) - Number(b.id));

    const indice = lista.findIndex(c => Number(c.id) === Number(id));
    const destino = indice + direcao;

    if (indice < 0 || destino < 0 || destino >= lista.length) return;

    const atual = lista[indice];
    const vizinha = lista[destino];

    const dados = (c, ordem) => ({
        nome: c.nome,

        icone: c.icone || null,
        ordem: ordem,
        ativo: c.ativo
    });

    window.dashAdminMovendoCaixinha = true;

    try {
        // Reorganiza toda a lista para evitar ordens repetidas.
        [lista[indice], lista[destino]] = [lista[destino], lista[indice]];

        for (let i = 0; i < lista.length; i++) {
            await dashAdminApi(
                '/caixinhas/' + lista[i].id,
                'PUT',
                dados(lista[i], i)
            );

        dashAdminCarregado = false;
        await dashAdminCarregar();

    } catch (e) {
        alert('Erro ao reordenar caixinhas: ' + e.message);

        await dashAdminCarregar();
    } finally {
        window.dashAdminMovendoCaixinha = false;
    }
};

const cacheFotosUsuarios = new Map();

async function carregarFotosGridUsuarios(){
    const token = sessionStorage.getItem('intranet_token');
    if(!token) return;

    const imagens = document.querySelectorAll(
        'img[data-foto-usuario]'
    );

    await Promise.all(Array.from(imagens).map(async img => {
        const id = img.dataset.fotoUsuario;
        if(!id) return;

        try {
            if(cacheFotosUsuarios.has(id)){
                img.src = cacheFotosUsuarios.get(id);
                return;
            }

            const resposta = await fetch(
                '/api/admin/usuarios/' + encodeURIComponent(id) + '/foto',
                {
                    headers: {'Authorization': 'Bearer ' + token},
                    cache: 'no-store'
                }
            );

            if(!resposta.ok) return;

            const blob = await resposta.blob();
            if(!blob.type.startsWith('image/')) return;

            const url = URL.createObjectURL(blob);
            cacheFotosUsuarios.set(id, url);
            img.src = url;

        } catch(erro) {
            console.error('Erro ao carregar foto do usuário:', id, erro);
        }
    }));
}

        answered: lista.filter(p => p.situacao === 'answered').length,
        expired: lista.filter(p => p.situacao === 'expired').length,
        all: lista.length
    };

    document.querySelectorAll('[data-pq-user-filter]').forEach(botao => {
        const tipo = botao.dataset.pqUserFilter;
        botao.querySelector('.num').textContent = contagens[tipo] ?? 0;
        botao.classList.toggle('selected', tipo === filtroPesquisasColaborador);
        const nota = botao.querySelector('.selected-note');
        if(nota) nota.textContent = tipo === filtroPesquisasColaborador ? '● Filtro selecionado' : '';
    });

    const titulos = {
        all:'Todas as pesquisas',
        pending:'Pesquisas pendentes',
        answered:'Pesquisas respondidas',
        expired:'Pesquisas não respondidas'
    };

    document.getElementById('pqUserListTitle').textContent =
        titulos[filtroPesquisasColaborador];

    const filtradas = filtroPesquisasColaborador === 'all'
        ? lista
        : lista.filter(p => p.situacao === filtroPesquisasColaborador);

    document.getElementById('pqUserCount').textContent =
        filtradas.length + (filtradas.length === 1 ? ' pesquisa' : ' pesquisas');

    area.innerHTML = filtradas.length ? filtradas.map(p => {
        const situacao = ['pending','answered','expired'].includes(p.situacao)
            ? p.situacao : 'pending';

        const rotulos = {
            pending:'Pendente',
            answered:'Respondida',
            expired:'Não respondida · Prazo encerrado'
        };

        const prazo = p.encerramento_em
            ? new Date(p.encerramento_em).toLocaleDateString('pt-BR')
            : 'Sem prazo definido';

        const acao = situacao === 'pending'
            ? `<button class="pesq-action" type="button" onclick="abrirPesquisaColaborador(${Number(p.id)})">Responder pesquisa</button>`
            : situacao === 'answered'
              ? (p.anonima
                  ? '<span class="pesq-deadline">Participação registrada</span>'
                  : `<button class="pesq-action" type="button"
                       onclick="verRespostasPesquisa(${Number(p.id)})">
                       Ver minhas respostas
                     </button>`)
              : '<div class="pesq-expired-msg">Prazo encerrado — não é possível responder</div>';

        return `<article class="pesq-user-card" data-status="${situacao}">
            <div class="pesq-cardtop">
              <span class="pesq-pill ${situacao === 'answered' ? 'done' : situacao === 'expired' ? 'expired' : ''}">${rotulos[situacao]}</span>
              <span class="pesq-pill">${p.anonima ? '🔒 Anônima' : 'Identificada'}</span>
            </div>
            <h3>${escaparTextoPesquisa(p.titulo)}</h3>
            <p>${escaparTextoPesquisa(p.descricao || '')}</p>
            <div class="pesq-deadline">Prazo: ${escaparTextoPesquisa(prazo)}</div>
            ${acao}
          </article>`;
    }).join('') : '<p>Nenhuma pesquisa encontrada neste filtro.</p>';
}

async function abrirPesquisaColaborador(id){
    try {
        const pesquisa = await requisicaoPesquisas('/api/pesquisas/' + id);
        const perguntas = pesquisa.perguntas || [];

        const conteudo = perguntas.map((p, indice) => {
            const titulo = escaparTextoPesquisa(p.enunciado);
            const obrigatoria = p.obrigatoria ? ' *' : '';
            const nome = 'pergunta_' + Number(p.id);
            let campo = '';

            if(p.tipo === 'NOTA_1_5' || p.tipo === 'NOTA_0_10'){
                const inicio = p.tipo === 'NOTA_1_5' ? 1 : 0;
                const fim = p.tipo === 'NOTA_1_5' ? 5 : 10;

                campo = `<p>Selecione uma nota de ${inicio} a ${fim}.</p>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;margin:15px 0">
                    ${Array.from({length:fim-inicio+1}, (_,i)=>i+inicio).map(n =>
                        `<label style="display:flex;gap:5px;align-items:center">
                            <input type="radio" name="${nome}" value="${n}"> ${n}
                        </label>`
                    ).join('')}
                    </div>`;
            }
            else if(p.tipo === 'SIM_NAO'){
                campo = `<div style="display:flex;gap:20px;margin:15px 0">
                    <label><input type="radio" name="${nome}" value="true"> Sim</label>
                    <label><input type="radio" name="${nome}" value="false"> Não</label>
                </div>`;
            }
            else if(p.tipo === 'ESCOLHA_UNICA' || p.tipo === 'MULTIPLA_ESCOLHA'){
                const alternativas = p.alternativas || [];
                const tipoInput = p.tipo === 'ESCOLHA_UNICA' ? 'radio' : 'checkbox';

                campo = alternativas.map(a =>
                    `<label style="display:block;margin:12px 0">
                        <input type="${tipoInput}" name="${nome}"
                            value="${Number(a.id)}">
                        ${escaparTextoPesquisa(a.texto)}
                    </label>`
                ).join('');

                if(!alternativas.length){
                    campo = '<p>Não há alternativas cadastradas.</p>';
                }
            }
            else if(p.tipo === 'TEXTO'){
                campo = `<textarea name="${nome}" rows="4"
                    style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px"
                    placeholder="Digite sua resposta"></textarea>`;
            }
            else {
                campo = '<p>Tipo de pergunta não reconhecido.</p>';
            }

            return `<div class="pesq-pergunta">
                <h3>${indice + 1}. ${titulo}${obrigatoria}</h3>
                ${campo}
            </div>`;
        }).join('');

        const tiposValidos = [
            'NOTA_1_5','NOTA_0_10','SIM_NAO',
            'ESCOLHA_UNICA','MULTIPLA_ESCOLHA','TEXTO'
        ];

        const habilitado = perguntas.length > 0 &&
            perguntas.every(p =>
                tiposValidos.includes(p.tipo) &&
                (!['ESCOLHA_UNICA','MULTIPLA_ESCOLHA'].includes(p.tipo) ||
                 (p.alternativas || []).length > 0)
            );

        modal(`<div class="pesq-form-modal">
            <div class="pesq-form-top">
                <div>
                    <span class="pesq-form-kicker">MINHAS PESQUISAS</span>
                    <h2>${escaparTextoPesquisa(pesquisa.titulo)}</h2>
                    <p>${escaparTextoPesquisa(pesquisa.descricao || '')}</p>
                </div>
                <button type="button" class="pesq-form-x"
                    onclick="closeModal()" aria-label="Fechar">×</button>
            </div>

            <div style="padding:20px 0">
                ${conteudo || '<p>Nenhuma pergunta cadastrada.</p>'}
            </div>

            <div class="pesq-form-actions">
                <button class="pesq-action" type="button"
                    onclick="enviarPesquisaColaborador(${Number(pesquisa.id)})"
                    ${habilitado ? '' : 'disabled'}>
                    Enviar respostas
                </button>
                <button class="pesq-action secondary" type="button"
                    onclick="closeModal()">Voltar</button>
            </div>

            <p class="pesq-form-feedback">
                As respostas serão registradas após o envio.
            </p>
        </div>`);
    }
    catch(erro){
        alert('Não foi possível abrir a pesquisa: ' + erro.message);
    }
}

async function enviarPesquisaColaborador(id){
    const botao = document.querySelector('.pesq-form-actions .pesq-action:not(.secondary)');
    const respostas = [];

    try {
        if(botao && botao.disabled) return;

        const pesquisa = await requisicaoPesquisas('/api/pesquisas/' + id);

        for(const pergunta of pesquisa.perguntas || []){
            const nome = 'pergunta_' + Number(pergunta.id);
            let valor = null;

            if(['NOTA_1_5','NOTA_0_10','ESCOLHA_UNICA'].includes(pergunta.tipo)){
                const selecionada = document.querySelector(
                    'input[name="' + nome + '"]:checked'
                );
                if(selecionada) valor = Number(selecionada.value);
            }
            else if(pergunta.tipo === 'SIM_NAO'){
                const selecionada = document.querySelector(
                    'input[name="' + nome + '"]:checked'
                );
                if(selecionada) valor = selecionada.value === 'true';
            }
            else if(pergunta.tipo === 'MULTIPLA_ESCOLHA'){
                const selecionadas = document.querySelectorAll(
                    'input[name="' + nome + '"]:checked'
                );
                if(selecionadas.length){
                    valor = Array.from(selecionadas).map(el => Number(el.value));
                }
            }
            else if(pergunta.tipo === 'TEXTO'){
                const campo = document.querySelector(
                    'textarea[name="' + nome + '"]'
                );
                if(campo && campo.value.trim()){
                    valor = campo.value.trim();
                }
            }
            else {
                throw new Error('Tipo de pergunta não reconhecido.');
            }

            if(valor === null){
                if(pergunta.obrigatoria){
                    throw new Error('Responda todas as perguntas obrigatórias.');
                }
                continue;
            }

            respostas.push({
                pergunta_id: Number(pergunta.id),
                valor
            });
        }

        if(!respostas.length){
            throw new Error('Informe pelo menos uma resposta antes de enviar.');
        }

        if(botao) botao.disabled = true;

        await requisicaoPesquisas(
            '/api/pesquisas/' + id + '/enviar',
            'POST',
            {respostas}
        );

        closeModal();
        alert('Pesquisa respondida com sucesso!');

        if(typeof carregarPesquisasColaborador === 'function'){
            await carregarPesquisasColaborador();
        }
    }
    catch(erro){
        alert('Não foi possível enviar: ' + erro.message);
        if(botao) botao.disabled = false;
    }
}

function tokenPesquisas(){
    const token = sessionStorage.getItem('intranet_token');
    if(!token) throw new Error('Sua sessão expirou. Entre novamente na intranet.');
    return token;
}

async function requisicaoPesquisas(url, metodo='GET', corpo=null){
    const headers = {'Authorization':'Bearer '+tokenPesquisas()};
    const op = {method:metodo, headers};
    if(corpo !== null){
        headers['Content-Type'] = 'application/json';
        op.body = JSON.stringify(corpo);
    }
    const resp = await fetch(url, op);
    const texto = await resp.text();
    let dados = {};
    try { dados = texto ? JSON.parse(texto) : {}; } catch(_) { dados = {detail:texto}; }
    if(!resp.ok){
        const detalhe = dados.detail || dados.message || ('Erro HTTP '+resp.status);
        throw new Error(typeof detalhe === 'string' ? detalhe : JSON.stringify(detalhe));
    }
    return dados;
}

async function criarPesquisaPeloFormulario(event){
    event.preventDefault();
    const form = event.currentTarget;
    const botao = document.getElementById('btnCriarPesquisa');
    const feedback = document.getElementById('feedbackNovaPesquisa');
    const fd = new FormData(form);
    const titulo = String(fd.get('titulo') || '').trim();
    if(!titulo){ feedback.textContent='Informe o título da pesquisa.'; return; }
    const inicio = String(fd.get('inicio_em') || '');
    const fim = String(fd.get('encerramento_em') || '');
    if(inicio && fim && new Date(fim) <= new Date(inicio)){
        feedback.textContent='A data de encerramento deve ser posterior à data de início.';
        return;
    }
    const payload = {
        titulo,
        descricao: String(fd.get('descricao') || '').trim() || null,
        anonima: fd.get('anonima') === 'true',
        inicio_em: inicio ? new Date(inicio).toISOString() : null,
        encerramento_em: fim ? new Date(fim).toISOString() : null
    };
    botao.disabled = true;
    feedback.textContent = 'Salvando no PostgreSQL...';
    try{
        const resultado = await requisicaoPesquisas('/api/pesquisas','POST',payload);
        pesquisaAdminAtual = resultado.id;
        pesquisaOrdemAtual = 1;
        pesquisaPerguntasAdicionadas = 0;
        pesquisaPublicoAdicionado = false;
        abrirEditorPerguntasPesquisa(resultado.id, titulo);
        carregarPesquisasAdmin();
    }catch(erro){
        feedback.textContent = 'Não foi possível criar: '+erro.message;
        botao.disabled = false;
    }
}


function mostrarPerguntasRascunho(perguntas){
    const formulario = document.getElementById('formPerguntaPesquisa');
    if(!formulario) return;

    const anterior = document.getElementById('pesqPerguntasExistentes');
    if(anterior) anterior.remove();

    const tipos = {
        NOTA_1_5: 'Nota de 1 a 5',
        NOTA_0_10: 'Nota de 0 a 10',
        ESCOLHA_UNICA: 'Escolha unica',
        MULTIPLA_ESCOLHA: 'Multipla escolha',
        TEXTO: 'Texto livre',
        SIM_NAO: 'Sim / Nao'
    };

    const lista = [...perguntas].sort((a,b) =>
        Number(a.ordem) - Number(b.ordem)
    );

    const bloco = document.createElement('div');
    bloco.id = 'pesqPerguntasExistentes';
    bloco.style.cssText = 'margin:18px 0;padding:16px;background:#f0f6fd;border-radius:10px';

    bloco.innerHTML = `
        <h3 style="margin:0 0 12px">
            Perguntas cadastradas (${lista.length})
        </h3>
        ${lista.length ? lista.map((p,i) => `
            <div style="background:white;padding:12px;border:1px solid #dce5ef;border-radius:8px;margin-bottom:9px">
                <strong>${i+1}. ${escaparTextoPesquisa(p.enunciado)}</strong>
                <p style="margin:6px 0;font-size:12px">
                    ${escaparTextoPesquisa(tipos[p.tipo] || p.tipo)}
                    — Ordem: ${Number(p.ordem)}
                    — ${p.obrigatoria ? 'Obrigatoria' : 'Opcional'}
                </p>
                ${(p.alternativas || []).length ? `
                    <ul style="margin:6px 0;padding-left:22px">
                        ${p.alternativas.map(a => `<li>${escaparTextoPesquisa(a.texto)}</li>`).join('')}
                    </ul>
                ` : ''}
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
                    <button type="button" class="pesq-action secondary"
                        onclick="editarPerguntaRascunho(${Number(p.id)})">
                        Editar
                    </button>
                    <button type="button" class="pesq-action secondary"
                        style="color:#b42318;border-color:#efcaca"
                        onclick="excluirPerguntaRascunho(${Number(p.id)})">
                        Excluir
                    </button>
                </div>
            </div>
        `).join('') : '<p>Nenhuma pergunta cadastrada.</p>'}
    `;

    formulario.parentNode.insertBefore(bloco, formulario);
}

async function editarPerguntaRascunho(id){
    try{
        const pesquisa = await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}`
        );

        if(pesquisa.status !== 'RASCUNHO'){
            alert('Apenas rascunhos podem ser editados.');
            return;
        }

        const pergunta = (pesquisa.perguntas || []).find(
            p => Number(p.id) === Number(id)
        );

        if(!pergunta){
            alert('Pergunta nao encontrada.');
            return;
        }

        const enunciado = prompt(
            'Edite o enunciado da pergunta:',
            pergunta.enunciado
        );

        if(enunciado === null) return;

        if(!enunciado.trim()){
            alert('O enunciado nao pode ficar vazio.');
            return;
        }

        const ordemTexto = prompt(
            'Informe a ordem da pergunta:',
            String(pergunta.ordem)
        );

        if(ordemTexto === null) return;

        const ordem = Number(ordemTexto);

        if(!Number.isInteger(ordem) || ordem < 1){
            alert('Informe uma ordem valida.');
            return;
        }

        await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}/perguntas/${id}`,
            'PUT',
            {enunciado: enunciado.trim(), ordem}
        );

        const atualizado = await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}`
        );

        mostrarPerguntasRascunho(atualizado.perguntas || []);

        pesquisaPerguntasAdicionadas = (atualizado.perguntas || []).length;
        pesquisaOrdemAtual = Math.max(
            0,
            ...(atualizado.perguntas || []).map(p => Number(p.ordem) || 0)
        ) + 1;

        const contador = document.getElementById('pesqPerguntasContador');
        if(contador) contador.textContent = pesquisaPerguntasAdicionadas + ' cadastrada(s)';

        alert('Pergunta atualizada com sucesso!');

    }catch(erro){
        alert('Nao foi possivel editar a pergunta: ' + erro.message);
    }
}

async function excluirPerguntaRascunho(id){
    if(!confirm('Deseja realmente excluir esta pergunta e suas alternativas?'))
        return;

    try{
        await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}/perguntas/${id}`,
            'DELETE'
        );

        const atualizado = await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}`
        );

        mostrarPerguntasRascunho(atualizado.perguntas || []);

        pesquisaPerguntasAdicionadas = (atualizado.perguntas || []).length;
        pesquisaOrdemAtual = Math.max(
            0,
            ...(atualizado.perguntas || []).map(p => Number(p.ordem) || 0)
        ) + 1;

        const contador = document.getElementById('pesqPerguntasContador');
        if(contador) contador.textContent = pesquisaPerguntasAdicionadas + ' cadastrada(s)';

        alert('Pergunta excluida com sucesso!');

    }catch(erro){
        alert('Nao foi possivel excluir: ' + erro.message);
    }
}

        pesquisaPerguntasAdicionadas = (p.perguntas || []).length;
        pesquisaOrdemAtual = Math.max(0,...(p.perguntas || []).map(q=>Number(q.ordem)||0))+1;

        const n=document.getElementById('pesqPerguntasContador');

async function adicionarPerguntaPeloFormulario(event){
    event.preventDefault();
    const form = event.currentTarget;
    const fd = new FormData(form);
    const tipo = String(fd.get('tipo'));
    const alternativas = String(fd.get('alternativas') || '').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    const feedback = document.getElementById('feedbackPerguntaPesquisa');
    const botao = document.getElementById('btnAdicionarPergunta');
    const payload = {
        enunciado: String(fd.get('enunciado') || '').trim(),
        tipo,
        ordem: Number(fd.get('ordem')),
        alternativas
    };
    botao.disabled = true;
    feedback.textContent = 'Salvando pergunta...';
    try{
        await requisicaoPesquisas(`/api/pesquisas/${pesquisaAdminAtual}/perguntas`,'POST',payload);

        const atualizado = await requisicaoPesquisas(`/api/pesquisas/${pesquisaAdminAtual}`);
        mostrarPerguntasRascunho(atualizado.perguntas || []);

        pesquisaPerguntasAdicionadas = (atualizado.perguntas || []).length;
        pesquisaOrdemAtual = Math.max(0,...(atualizado.perguntas || []).map(p=>Number(p.ordem)||0))+1;

        document.getElementById('pesqPerguntasContador').textContent = pesquisaPerguntasAdicionadas+' cadastrada(s)';
        feedback.textContent = 'Pergunta adicionada com sucesso.';
        form.reset();
        form.elements.ordem.value = pesquisaOrdemAtual;
        alternativasPerguntaVisibilidade();
    }catch(erro){
        feedback.textContent = 'Não foi possível adicionar: '+erro.message;
    }finally{ botao.disabled = false; }
}

async function adicionarPublicoPeloFormulario(event){
    event.preventDefault();

    const tipo = document.getElementById('tipoPublicoPesquisa').value;
    const feedback = document.getElementById('feedbackPublicoPesquisa');
    const botao = document.getElementById('btnAdicionarPublico');

    const valores = tipo === 'TODOS'
        ? []
        : [...document.querySelectorAll(
            '#listaValoresPublico input[name="valoresPublico"]:checked'
          )].map(input => input.value);

    if(tipo !== 'TODOS' && valores.length === 0){
        feedback.textContent = 'Selecione pelo menos uma opção.';
        return;
    }

    botao.disabled = true;
    feedback.textContent = 'Salvando público...';

    try {
        await requisicaoPesquisas(
            `/api/pesquisas/${pesquisaAdminAtual}/publico`,
            'PUT',
            {tipo, valores}
        );

        pesquisaPublicoAdicionado = true;

        document.getElementById('pesqPublicoStatus').textContent =
            'Definido';

        feedback.textContent =
            'Público salvo com sucesso. Você pode alterar a seleção enquanto a pesquisa estiver em rascunho.';

        botao.textContent = 'Atualizar público';

    } catch(erro) {
        feedback.textContent =
            'Não foi possível salvar: ' + erro.message;
    } finally {
        botao.disabled = false;
    }
}
async function publicarPesquisaPeloFormulario(){

    if(pesquisaPerguntasAdicionadas < 1){

        }).join('');
        lista.innerHTML = cards || '<div class="pesq-admin-item"><div><h3>Nenhuma pesquisa cadastrada</h3><p class="pesq-admin-desc">Clique em “Nova pesquisa” para começar.</p></div></div>';
        const stats = document.querySelectorAll('.pesq-admin-stat b');
        const vals = [dados.length,contagem.PUBLICADA,contagem.RASCUNHO,contagem.AGENDADA,contagem.ENCERRADA];
        stats.forEach((el,i)=>{ if(vals[i] !== undefined) el.textContent=String(vals[i]).padStart(2,'0'); });
        const note = document.getElementById('pqAdminFeedback');
        if(note) note.textContent = 'Dados carregados do PostgreSQL principal.';
        ativarFiltrosPesquisas(); if(page==='pesquisas')carregarPesquisasColaborador();
    }catch(erro){

        if(note) note.textContent = 'Falha ao consultar a API.';
    }
}

            '/api/pesquisas/' + numero,

        );

        await carregarPesquisasAdmin();

    }catch(erro){
        alert('Não foi possível excluir a pesquisa: ' + erro.message);

}

function ativarFiltrosPesquisas(){
 const uf=[...document.querySelectorAll('[data-pq-user-filter]')];if(uf.length){const labels={all:'Todas as pesquisas',pending:'Pesquisas pendentes',answered:'Pesquisas respondidas',expired:'Pesquisas não respondidas'};uf.forEach(b=>b.addEventListener('click',()=>{const f=b.dataset.pqUserFilter;uf.forEach(x=>{x.classList.toggle('selected',x===b);x.querySelector('.selected-note').textContent=x===b?'● Filtro selecionado':''});let n=0;document.querySelectorAll('#pqUserCards .pesq-user-card').forEach(c=>{const show=f==='all'||c.dataset.status===f;c.hidden=!show;if(show)n++});document.getElementById('pqUserListTitle').textContent=labels[f];document.getElementById('pqUserCount').textContent=n+(n===1?' pesquisa':' pesquisas')}));}
 const area = document.getElementById('app');

 if(area && !area.dataset.pqAdminFiltrosAtivos){
    area.dataset.pqAdminFiltrosAtivos = '1';

    const aplicarFiltroAdmin = () => {
        const busca = document.getElementById('pqAdminSearch');
        const seletor = document.getElementById('pqAdminStatus');
        const lista = document.getElementById('pqAdminList');

        if(!busca || !seletor || !lista) return;

        const termo = busca.value.trim().toLocaleLowerCase('pt-BR');
        const status = seletor.value;

        document.querySelectorAll('[data-pq-admin-filter]').forEach(botao => {
            botao.classList.toggle(
                'active',
                botao.dataset.pqAdminFilter === status
            );
        });

        lista.querySelectorAll('.pesq-admin-item').forEach(cartao => {
            const correspondeStatus =
                status === 'all' || cartao.dataset.status === status;

            const correspondeBusca =
                cartao.innerText.toLocaleLowerCase('pt-BR').includes(termo);

            cartao.hidden = !(correspondeStatus && correspondeBusca);
        });
    };

    area.addEventListener('click', evento => {
        const botao = evento.target.closest('[data-pq-admin-filter]');
        if(!botao || !area.contains(botao)) return;

        const seletor = document.getElementById('pqAdminStatus');
        if(!seletor) return;

        seletor.value = botao.dataset.pqAdminFilter;
        aplicarFiltroAdmin();
    });

    area.addEventListener('input', evento => {
        if(evento.target.id === 'pqAdminSearch'){
            aplicarFiltroAdmin();
        }
    });

    area.addEventListener('change', evento => {
        if(evento.target.id === 'pqAdminStatus'){
            aplicarFiltroAdmin();
        }
    });
 }
}

let dashboardSelecionado = 'auditoria';

let dashUsuarioCarregando=false;
let dashUsuarioCaixinhas=null;
let dashUsuarioErro="";

async function carregarDashboardsUsuario(){
 if(dashUsuarioCarregando)return;
 dashUsuarioCarregando=true;
 try{
  const token=sessionStorage.getItem("intranet_token");
  if(!token)throw new Error("Sessao nao encontrada");
  const headers={Authorization:"Bearer "+token};
  const resposta=await fetch("/api/dashboards/caixinhas",{headers});
  if(!resposta.ok)throw new Error("Erro ao consultar permissoes: "+resposta.status);
  const dados=await resposta.json();
  const caixinhas=Array.isArray(dados)?dados:(dados.caixinhas||[]);
  dashUsuarioCaixinhas=await Promise.all(caixinhas.map(async c=>{
   const r=await fetch("/api/dashboards/caixinhas/"+c.id+"/dashboards",{headers});
   if(!r.ok)throw new Error("Erro ao consultar dashboards: "+r.status);
   const d=await r.json();
   return {...c,dashboards:Array.isArray(d)?d:(d.dashboards||[])};
  }));
  dashUsuarioErro="";
 }catch(e){dashUsuarioErro=e.message;dashUsuarioCaixinhas=[];}
 finally{dashUsuarioCarregando=false;if(page==="dashboards")render();}
}

function paginaDashboards(){
 if(!dashUsuarioCarregando && dashUsuarioCaixinhas!==null && !window.dashUsuarioAtualizado){window.dashUsuarioAtualizado=true;setTimeout(carregarDashboardsUsuario,0);}
 if(dashUsuarioCaixinhas===null&&!dashUsuarioCarregando)setTimeout(carregarDashboardsUsuario,0);
 if(dashUsuarioCarregando||dashUsuarioCaixinhas===null)return `<div class="card"><h3>Dashboards</h3><p>Carregando...</p></div>`;
 if(dashUsuarioErro)return `<div class="card"><h3>Dashboards</h3><p>${esc(dashUsuarioErro)}</p><button class="btn" onclick="carregarDashboardsUsuario()">Tentar novamente</button></div>`;
 if(!dashUsuarioCaixinhas.length)return `<div class="card"><h3>Dashboards</h3><p>Nenhum dashboard disponivel para seu perfil.</p></div>`;
 return `<div class="painel-dashboards"><h2>Dashboards</h2>${dashUsuarioCaixinhas.map(c=>`
  <section class="card" style="margin:15px 0"><h3><span style="margin-right:10px;font-size:24px">${esc(c.icone || "▦")}</span>${esc(c.nome)}</h3>
  ${c.dashboards.length?c.dashboards.map(d=>`
   <button class="btn secondary" style="margin:5px" data-abrir-dashboard="${c.id}:${d.id}">${esc(d.nome)}</button>
  `).join(""):"<p>Nenhum dashboard autorizado nesta caixinha.</p>"}
  </section>`).join("")}<div id="dashUsuarioVisualizacao"></div></div>`;
}

async function abrirDashboardUsuario(caixinhaId,dashboardId){
 const c=(dashUsuarioCaixinhas||[]).find(x=>Number(x.id)===Number(caixinhaId));

async function openGlobalResult(i) {
    const x = (window._globalResults || [])[i];
    if (!x) return;

    clearGlobalSearch();

    if (x.page !== 'documentos' || !x.documentoId) {
        go(x.page);
        if (x.id && x.page !== 'documentos') {
            try { openDetail(x.page, x.id); } catch (e) {}
        }
        return;
    }

    if (!allowed()) return;

    go('documentos');

    const esperar = async (localizar, tentativas = 80) => {
        for (let n = 0; n < tentativas; n++) {
            const elemento = localizar();
            if (elemento) return elemento;
            await new Promise(resolve => setTimeout(resolve, 100));
        }
        return null;
    };

    const area = await esperar(() =>
        document.querySelector('#content details[data-titulo-id="' +
            x.tituloId + '"]')
    );

    if (!area) return;

    area.open = true;

    const subpasta = await esperar(() =>
        area.querySelector('details[data-tipo-id="' + x.tipoId + '"]')
    );

    if (!subpasta) return;

    subpasta.open = true;

    const documento = await esperar(() =>
        subpasta.querySelector('[data-documento-id="' +
            x.documentoId + '"]')
    );

    if (!documento) return;

    documento.style.background = '#fff3bf';
    documento.style.borderRadius = '5px';
    documento.style.padding = '4px 6px';

    documento.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
    });
}

function previewProfilePhoto(input){
  const arquivo = input.files?.[0];
  const preview = document.getElementById('profile-photo-preview');
  const mensagem = document.getElementById('profile-photo-message');

  if(!arquivo || !preview) return;

  if(!['image/jpeg','image/png','image/webp'].includes(arquivo.type) ||
     arquivo.size > 2 * 1024 * 1024){
    input.value = '';
    mensagem.textContent = 'Selecione JPG, PNG ou WebP de até 2 MB.';
    return;
  }

  const url = URL.createObjectURL(arquivo);
  const imagem = document.createElement('img');
  imagem.alt = 'Pré-visualização da foto';
  imagem.style.cssText = 'width:100%;height:100%;object-fit:cover';

  imagem.onload = () => URL.revokeObjectURL(url);
  imagem.onerror = () => {
    URL.revokeObjectURL(url);
    mensagem.textContent = 'Não foi possível visualizar a imagem.';
  };

  imagem.src = url;
  preview.replaceChildren(imagem);
  mensagem.textContent = 'Foto selecionada. Clique em Salvar foto.';
}

async function uploadProfilePhoto(){
  const input = document.getElementById('profile-photo-file');
  const mensagem = document.getElementById('profile-photo-message');
  const arquivo = input?.files?.[0];
  const token = sessionStorage.getItem('intranet_token');

  if(!arquivo){
    mensagem.textContent = 'Selecione uma foto primeiro.';
    return;
  }

  if(!token){
    location.replace('/login.html');
    return;
  }

  const formulario = new FormData();
  formulario.append('arquivo', arquivo);

  mensagem.textContent = 'Enviando foto...';

  try {
    const resposta = await fetch('/api/perfil/foto', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token},
      body: formulario
    });

    const dados = await resposta.json();

    if(!resposta.ok){
      throw new Error(dados.detail || 'Erro ao salvar foto.');
    }

    mensagem.textContent = 'Foto salva com sucesso!';
    mensagem.style.color = 'green';
    input.value = '';

  } catch(erro){
    mensagem.textContent = erro.message;
    mensagem.style.color = 'red';
  }
}

window.salvarDocumentoTitulo = async function(event) {
    event.preventDefault();

    const form = event.currentTarget;
    const botao = form.querySelector('button[type="submit"]');
    const dados = {
        nome: form.elements.nome.value.trim(),
        ordem: Number(form.elements.ordem.value)

    if (!dados.nome || !Number.isInteger(dados.ordem) || dados.ordem < 1) {
        alert('Informe um título e uma posição válida.');
        return;

    botao.disabled = true;

    try {
        const resposta = await fetch('/api/documentos-titulos', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + sessionStorage.getItem('intranet_token'),
                'Content-Type': 'application/json'

        if (!resposta.ok) {
            const erro = await resposta.json();
            throw new Error(erro.detail || 'Erro ao cadastrar título');

        await carregarDocumentosTitulos();

window.visualizarArquivoDocumento = async function(arquivoId) {
    const novaJanela = window.open('about:blank', '_blank');

    if (!novaJanela) {
        alert('Permita a abertura de janelas para visualizar documentos.');
        return;
    }

    novaJanela.document.title = 'Carregando documento...';
    novaJanela.document.body.textContent = 'Carregando documento...';

    try {
        const token = sessionStorage.getItem('intranet_token');

        const resposta = await fetch(
            '/api/documentos-arquivos/' + arquivoId + '/visualizar',
            { headers: { 'Authorization': 'Bearer ' + token } }
        );

        if (!resposta.ok) {
            throw new Error('Erro ao abrir documento');
        }

        const blob = await resposta.blob();

        if (blob.type !== 'application/pdf') {
            throw new Error('Visualização disponível somente para arquivos PDF.');
        }

        const endereco = URL.createObjectURL(blob);
        novaJanela.location.replace(endereco);

        setTimeout(() => URL.revokeObjectURL(endereco), 300000);

    } catch (erro) {
        novaJanela.close();
        alert(erro.message);
    }
};

window.carregarArvoreConsulta = async function() {

    area.textContent = 'Carregando documentos...';

    const headers = {
        Authorization: 'Bearer ' + sessionStorage.getItem('intranet_token')
    };

    async function consultar(url) {
        const resposta = await fetch(url, { headers });
        if (!resposta.ok) {
            throw new Error('Falha na consulta: HTTP ' + resposta.status);
        }
        return resposta.json();
    }

    try {
        const titulos = await consultar('/api/documentos-titulos');

        if (!area.isConnected) return;

        area.replaceChildren();

        if (!titulos.length) {
            area.textContent = 'Nenhum documento disponível.';
            return;

            const pasta = document.createElement('details');
            pasta.dataset.tituloId = String(titulo.id);
            pasta.style.padding = '3px 8px';
            pasta.style.marginBottom = '2px';
            pasta.style.border = '1px solid #ddd';

            area.appendChild(pasta);

            pasta.addEventListener('toggle', async () => {
                if (!pasta.open || pasta.dataset.carregado) return;

                tiposArea.textContent = 'Carregando...';

                try {
                    const tipos = await consultar(
                        '/api/documentos-tipos?titulo_id=' +

                    );

                    }

                    for (const tipo of tipos) {
                        const subpasta = document.createElement('details');
                        subpasta.dataset.tipoId = String(tipo.id);

<script>
function abrirNovoComunicado(comunicado = null) {
    if (document.getElementById('modalNovoComunicado')) return;

    const editando = !!comunicado;
    const modal = document.createElement('div');

    modal.id = 'modalNovoComunicado';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';

    modal.innerHTML = `
        <div style="background:white;border-radius:14px;padding:28px;width:100%;max-width:750px;max-height:90vh;overflow-y:auto;color:#102b49">
            <div style="display:flex;justify-content:space-between;align-items:center">

            </div>
            <form id="formNovoComunicado">
                <p><label>Título *</label><input name="titulo" required maxlength="200" style="width:100%;padding:12px"></p>
                <p><label>Categoria *</label>
                    <select name="categoria" required style="width:100%;padding:12px">
                        <option value="Comunicados Internos">Comunicados Internos</option>
                        <option value="Recursos Humanos">Recursos Humanos</option>
                        <option value="Eventos">Eventos</option>
                        <option value="Treinamentos">Treinamentos</option>
                        <option value="Informativos">Informativos</option>
                    </select>
                </p>
                <p><label>Resumo</label><textarea name="resumo" rows="2" style="width:100%;padding:12px"></textarea></p>
                <p><label>Conteúdo *</label><textarea name="conteudo" rows="6" required style="width:100%;padding:12px"></textarea></p>
                <p>
                    <label>Imagem do comunicado</label>
                    <input type="file" id="imagemComunicado" accept="image/jpeg,image/png,image/webp"
                        style="width:100%;padding:12px"
                        onchange="visualizarImagemComunicado(this)">
                    <small>JPG, PNG ou WebP — máximo 5 MB</small>
                    <img id="previewImagemComunicado"
                        style="display:none;max-width:100%;max-height:220px;margin-top:12px;border-radius:8px">
                </p>
                <p><label>Início da publicação</label><input name="data_inicio" type="datetime-local"></p>
                <p><label>Fim da publicação</label><input name="data_fim" type="datetime-local"></p>
                <p><label><input name="destaque" type="checkbox"> Destacar comunicado</label></p>
                <p><label><input name="permitir_curtidas" type="checkbox" checked> Permitir curtidas</label></p>
                <p><label><input name="permitir_comentarios" type="checkbox" checked> Permitir comentários</label></p>
                <div style="display:flex;gap:12px;justify-content:flex-end">
                    <button type="button" class="btn secondary" onclick="document.getElementById('modalNovoComunicado').remove()">Cancelar</button>
                    <button type="submit" class="btn">${editando ? 'Salvar Alterações' : 'Salvar Rascunho'}</button>
                </div>
            </form>
        </div>`;

    document.body.appendChild(modal);

    if (editando) {
        const form = document.getElementById('formNovoComunicado');

        form.dataset.comunicadoId = comunicado.id;
        form.dataset.imagemAtual = comunicado.imagem_url || '';
        form.dataset.publicado = String(!!comunicado.publicado);
        form.dataset.ativo = String(!!comunicado.ativo);

        form.elements.titulo.value = comunicado.titulo || '';
        form.elements.categoria.value = comunicado.categoria || 'Comunicados Internos';
        form.elements.resumo.value = comunicado.resumo || '';
        form.elements.conteudo.value = comunicado.conteudo || '';
        form.elements.data_inicio.value = converterDataComunicado(comunicado.data_inicio);
        form.elements.data_fim.value = converterDataComunicado(comunicado.data_fim);
        form.elements.destaque.checked = !!comunicado.destaque;
        form.elements.permitir_curtidas.checked = !!comunicado.permitir_curtidas;
        form.elements.permitir_comentarios.checked = !!comunicado.permitir_comentarios;

        if (comunicado.imagem_url) {
            const preview = document.getElementById('previewImagemComunicado');
            preview.src = comunicado.imagem_url;
            preview.style.display = 'block';
        }
    }
}

function converterDataComunicado(valor) {
    if (!valor) return '';
    const data = new Date(valor);
    return new Date(data.getTime() - data.getTimezoneOffset() * 60000)
        .toISOString().slice(0,16);
}

function editarComunicado(id) {
    const comunicado = comunicadosAdmin.find(c => Number(c.id) === Number(id));

    if (!comunicado) {
        alert('Comunicado não encontrado.');
        return;
    }

    abrirNovoComunicado(comunicado);
}

<script>
document.addEventListener('submit', async function(event) {
    if (event.target.id !== 'formNovoComunicado') return;

    event.preventDefault();

    const form = event.target;
    const botao = form.querySelector('button[type="submit"]');
    const dados = new FormData(form);
    const id = form.dataset.comunicadoId;

    const payload = {
        titulo: dados.get('titulo'),
        categoria: dados.get('categoria'),
        resumo: dados.get('resumo') || '',
        conteudo: dados.get('conteudo'),
        imagem_url: '',
        anexo_url: '',
        destinatarios: ['TODOS'],
        destaque: dados.has('destaque'),
        permitir_curtidas: dados.has('permitir_curtidas'),
        permitir_comentarios: dados.has('permitir_comentarios'),
        data_inicio: dados.get('data_inicio') || null,
        data_fim: dados.get('data_fim') || null,
        publicado: id ? form.dataset.publicado === 'true' : false,
        ativo: id ? form.dataset.ativo === 'true' : true
    };

    if (payload.data_inicio && payload.data_fim &&
        payload.data_fim < payload.data_inicio) {
        alert('A data final deve ser posterior à data inicial.');
        return;
    }

    botao.disabled = true;

    try {
        const imagem = document.getElementById('imagemComunicado')?.files[0];

        if (imagem) {
            botao.textContent = 'Enviando imagem...';

            const formularioImagem = new FormData();
            formularioImagem.append('arquivo', imagem);

            const respostaImagem = await fetch(
                '/api/admin/comunicados/upload-imagem',
                {
                    method: 'POST',
                    headers: {
                        Authorization: 'Bearer ' + sessionStorage.getItem('intranet_token')
                    },
                    body: formularioImagem
                }
            );

            if (!respostaImagem.ok) {
                throw new Error('Falha no upload: HTTP ' + respostaImagem.status +
                    ' - ' + await respostaImagem.text());
            }

            const resultadoImagem = await respostaImagem.json();
            payload.imagem_url = resultadoImagem.imagem_url;
        }

        botao.textContent = 'Salvando...';

        const resposta = await fetch(
            id ? '/api/admin/comunicados/' + encodeURIComponent(id)
               : '/api/admin/comunicados',
            {
                method: id ? 'PUT' : 'POST',
                headers: {
                    Authorization: 'Bearer ' + sessionStorage.getItem('intranet_token'),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }
        );

        if (!resposta.ok) {
            throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
        }

        document.getElementById('modalNovoComunicado').remove();

        await carregarComunicadosAdmin();

        alert(id ? 'Comunicado atualizado com sucesso!' :
                    'Comunicado salvo como rascunho!');

    } catch (erro) {
        alert('Erro ao salvar comunicado: ' + erro.message);
    } finally {
        botao.disabled = false;
    }
});
</script>
<script>
function visualizarImagemComunicado(input) {
    const arquivo = input.files[0];
    const preview = document.getElementById('previewImagemComunicado');

    if (!arquivo) {
        preview.removeAttribute('src');
        preview.style.display = 'none';
        return;
    }

    if (!['image/jpeg','image/png','image/webp'].includes(arquivo.type)) {
        alert('Selecione uma imagem JPG, PNG ou WebP.');
        input.value = '';
        return;
    }

    if (arquivo.size > 5 * 1024 * 1024) {
        alert('A imagem deve ter no máximo 5 MB.');
        input.value = '';
        return;
    }

    const leitor = new FileReader();
    leitor.onload = () => {
        preview.src = leitor.result;
        preview.style.display = 'block';
    };
    leitor.readAsDataURL(arquivo);
}
</script>

window.galeriaBlobUrls = window.galeriaBlobUrls || [];

window.liberarImagensGaleria = function() {
    for (const url of window.galeriaBlobUrls) {
        URL.revokeObjectURL(url);
    }
    window.galeriaBlobUrls = [];
};

window.carregarGaleriaNaTela = async function() {
    const destino = document.getElementById('galeria-real');
    if (!destino) return;

    window.liberarImagensGaleria();

    try {
        const imagens = await window.carregarGaleriaPublicada();

        if (!document.getElementById('galeria-real')) return;

        if (!imagens.length) {
            destino.innerHTML = '<div class="empty">Nenhuma imagem publicada.</div>';
            return;
        }

        destino.innerHTML = imagens.map(imagem => `
            <article class="card">
                <div class="photo-frame">
                    <img class="real-photo"
                         id="foto-galeria-${imagem.id}"
                         alt="">
                </div>
                <h3>${esc(imagem.titulo)}</h3>
            </article>
        `).join('');

        await Promise.all(imagens.map(async imagem => {
            try {
                const url = await window.buscarImagemGaleria(imagem.id);
                const elemento = document.getElementById('foto-galeria-' + imagem.id);

                if (elemento && document.getElementById('galeria-real')) {
                    elemento.src = url;
                    elemento.alt = imagem.titulo;
                }
            } catch (erro) {
                console.error('Erro na imagem ' + imagem.id, erro);
            }
        }));

    } catch (erro) {
        const atual = document.getElementById('galeria-real');
        if (atual) {
            atual.innerHTML = '<div class="empty">Nao foi possivel carregar a Galeria.</div>';
        }
        console.error(erro);
    }
};
window.enviarImagemGaleria = async function(evento) {
    evento.preventDefault();

    const formulario = evento.target;
    const titulo = formulario.querySelector('[name="titulo"]').value.trim();
    const arquivo = formulario.querySelector('[name="arquivo"]').files[0];
    const botao = formulario.querySelector('button[type="submit"]');

    if (!titulo || !arquivo) {
        alert('Informe o título e selecione uma imagem.');
        return;
    }

    if (arquivo.size > 10 * 1024 * 1024) {
        alert('A imagem não pode ultrapassar 10 MB.');
        return;
    }

    const dados = new FormData();
    dados.append('titulo', titulo);
    dados.append('arquivo', arquivo);

    botao.disabled = true;
    botao.textContent = 'Enviando...';

    try {
        const resposta = await fetch('/api/galeria/upload', {
            method: 'POST',
            headers: {
                Authorization: 'Bearer ' +
                    sessionStorage.getItem('intranet_token')
            },
            body: dados
        });

        if (!resposta.ok) {
            const erro = await resposta.json();
            throw new Error(
                typeof erro.detail === 'string'
                    ? erro.detail
                    : 'Erro HTTP ' + resposta.status
            );
        }

        alert('Imagem cadastrada com sucesso.');
        await window.carregarGaleriaAdmin();

    } catch (erro) {
        alert('Erro ao enviar imagem: ' + erro.message);
    } finally {
        botao.disabled = false;
        botao.textContent = 'Enviar imagem';
    }
};
window.editarTituloGaleria = async function(id, tituloAtual, publicado) {
    const novoTitulo = prompt('Novo título da imagem:', tituloAtual);

    if (novoTitulo === null) return;

    const titulo = novoTitulo.trim();

    if (!titulo) {
        alert('O título não pode ficar vazio.');
        return;
    }

    if (titulo.length > 200) {
        alert('O título não pode ultrapassar 200 caracteres.');
        return;
    }

    try {
        const resposta = await fetch('/api/galeria/' + encodeURIComponent(id), {
            method: 'PUT',
            headers: {
                Authorization: 'Bearer ' + sessionStorage.getItem('intranet_token'),
                'Content-Type': 'application/json'

            body: JSON.stringify({ titulo, publicado: Boolean(publicado) })

        headers: {
            Authorization: 'Bearer ' + token
        },
        cache: 'no-store'

    }

};
window.buscarImagemGaleria = async function(imagemId) {
    const token = sessionStorage.getItem('intranet_token');

    if (!token) {
        throw new Error('Sessao nao encontrada');
    }

    const resposta = await fetch(
        '/api/galeria/' + encodeURIComponent(imagemId) + '/imagem',
        {
            headers: {
                Authorization: 'Bearer ' + token
            },
            cache: 'no-store'
        }
    );

    if (!resposta.ok) {
        throw new Error('Erro ao carregar imagem: ' + resposta.status);
    }

    const blob = await resposta.blob();
    const url = URL.createObjectURL(blob);

    window.galeriaBlobUrls.push(url);
    return url;
};

        atual.querySelector('#form-novo-video').onsubmit = async function(evento) {
            evento.preventDefault();

            const formulario = evento.currentTarget;
            const botao = formulario.querySelector('button[type="submit"]');

            const dados = {
                titulo: formulario.elements.titulo.value.trim(),
                embed_html: formulario.elements.embed_html.value.trim()
            };

            if (!dados.titulo || !dados.embed_html) {
                alert('Preencha o título e o link ou código Embed.');
                return;
            }

            botao.disabled = true;

            try {
                const resposta = await fetch('/api/videos', {
                    method: 'POST',
                    headers: {
                        Authorization: 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                if (!resposta.ok) {
                    throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
                }

                alert('Vídeo cadastrado com sucesso.');
                await window.carregarVideosAdmin();

            } catch (erro) {
                alert('Erro ao cadastrar vídeo: ' + erro.message);
            } finally {
                botao.disabled = false;
            }
        };

        atual.onclick = async function(evento) {
            const botao = evento.target.closest('button[data-acao]');
            if (!botao || !atual.contains(botao)) return;

            const video = videos.find(item =>
                Number(item.id) === Number(botao.dataset.id)
            );

            if (!video) return;

            const acao = botao.dataset.acao;

            try {
                if (acao === 'editar') {
                    const titulo = prompt('Novo título:', video.titulo);
                    if (titulo === null) return;

                    const embed = prompt(
                        'Cole o link ou código Embed do Instagram:',
                        video.instagram_url
                    );

                    if (embed === null) return;

                    if (!titulo.trim() || !embed.trim()) {
                        alert('Título e Embed são obrigatórios.');
                        return;
                    }

                    const resposta = await fetch('/api/videos/' + video.id, {
                        method: 'PUT',
                        headers: {
                            Authorization: 'Bearer ' + token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            titulo: titulo.trim(),
                            embed_html: embed.trim(),
                            publicado: video.publicado
                        })
                    });

                    if (!resposta.ok) {
                        throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
                    }

                } else if (acao === 'publicar') {
                    const novaSituacao = !video.publicado;

                    if (!confirm('Deseja ' + (novaSituacao ? 'publicar' : 'ocultar') + ' este vídeo?')) return;

                    const resposta = await fetch('/api/videos/' + video.id, {
                        method: 'PUT',
                        headers: {
                            Authorization: 'Bearer ' + token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            titulo: video.titulo,
                            embed_html: video.instagram_url,
                            publicado: novaSituacao
                        })
                    });

                    if (!resposta.ok) {
                        throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
                    }

                } else if (acao === 'subir' || acao === 'descer') {
                    const indice = videos.findIndex(item =>
                        Number(item.id) === Number(video.id)
                    );

                    const posicao = indice + 1 + (acao === 'subir' ? -1 : 1);

                    if (posicao < 1 || posicao > videos.length) return;

                    const resposta = await fetch('/api/videos/' + video.id + '/ordem', {
                        method: 'PUT',
                        headers: {
                            Authorization: 'Bearer ' + token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ posicao })
                    });

                    if (!resposta.ok) {
                        throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
                    }

                } else if (acao === 'excluir') {
                    if (!confirm('Deseja excluir o vídeo "' + video.titulo + '"?')) return;

                    const resposta = await fetch('/api/videos/' + video.id, {
                        method: 'DELETE',
                        headers: {
                            Authorization: 'Bearer ' + token
                        }
                    });

                    if (!resposta.ok) {
                        throw new Error('HTTP ' + resposta.status + ': ' + await resposta.text());
                    }
                }

                await window.carregarVideosAdmin();

            } catch (erro) {
                alert('Erro ao executar ação: ' + erro.message);
            }
        };

    } catch (erro) {
        const atual = document.getElementById('videos-admin');

        if (atual) {
            atual.innerHTML =
                '<div class="notice">Erro ao carregar vídeos: ' +
                esc(erro.message) + '</div>';
        }
    }
};

<script id="AJUSTE_ROLAGEM_DASH_V12">
(function(){
  function ajustar(){
    const frame = document.getElementById('frameDash');
    if (!frame) return;

    try {
      const doc = frame.contentDocument;
      if (!doc || !doc.body) return;

      doc.documentElement.style.overflow = 'hidden';
      doc.body.style.overflow = 'hidden';

      const altura = Math.max(
        doc.body.scrollHeight,
        doc.documentElement.scrollHeight
      );

      frame.style.height = (altura + 24) + 'px';
      frame.style.overflow = 'hidden';
      frame.setAttribute('scrolling','no');
    } catch(e) {
      console.warn('Nao foi possivel ajustar o iframe',e);
    }
  }

  document.addEventListener('load', function(e){
    if(e.target && e.target.id === 'frameDash'){
      ajustar();
      setTimeout(ajustar,300);
      setTimeout(ajustar,1000);
    }
  },true);

  document.addEventListener('click', function(e){
    if(e.target.closest('.aba-dashboard')){
      setTimeout(ajustar,300);
      setTimeout(ajustar,900);
    }
  });

  window.addEventListener('resize',ajustar);

  setInterval(function(){
    if(document.getElementById('frameDash')) ajustar();
  },1500);
})();
</script>

  ];

   botao.type="button";
   botao.textContent=icone;
