<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redefinir senha - Intranet</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#092c50,#17629b);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{background:#fff;width:100%;max-width:420px;padding:38px;border-radius:18px;box-shadow:0 20px 55px #0004;text-align:center}
.logo{width:180px;max-width:100%;margin-bottom:20px}
h2{color:#173b5e}
p{color:#687b8c;font-size:14px;line-height:1.5}
input{width:100%;padding:14px;margin-bottom:15px;border:1px solid #ccd8e3;border-radius:9px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#17629b;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
a{display:block;margin-top:22px;color:#17629b;text-decoration:none}
#mensagem{font-size:14px;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="login">
<img src="/api/empresa/logo-publico" class="logo" alt="Logotipo da empresa" onerror="this.style.display='none'">
<h2>Redefinir senha</h2>
<p>Cadastre uma nova senha com pelo menos 8 caracteres.</p>

<form id="formSenha">
<input id="senha" type="password" placeholder="Nova senha"
       autocomplete="new-password" minlength="8" required>

<input id="confirmar" type="password" placeholder="Confirme a nova senha"
       autocomplete="new-password" minlength="8" required>

<button id="salvar" type="submit">Salvar nova senha</button>
</form>

<div id="mensagem" role="status" aria-live="polite"></div>
<a href="/login.html">Voltar ao login</a>
</div>

<script>
const parametros=new URLSearchParams(location.search);
const token=parametros.get("token");
const mensagem=document.getElementById("mensagem");
const botao=document.getElementById("salvar");

if(!token){
 mensagem.style.color="#bd2525";
 mensagem.textContent="Link de recuperação inválido.";
 botao.disabled=true;
}

document.getElementById("formSenha").addEventListener("submit",async e=>{
 e.preventDefault();

 const senha=document.getElementById("senha").value;
 const confirmar=document.getElementById("confirmar").value;

 if(senha!==confirmar){
  mensagem.style.color="#bd2525";
  mensagem.textContent="As senhas não coincidem.";
  return;
 }

 if(!token)return;

 botao.disabled=true;
 mensagem.textContent="Atualizando senha...";

 try{
  const resposta=await fetch("/api/redefinir-senha",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    token:token,
    nova_senha:senha
   })
  });

  const dados=await resposta.json();

  if(!resposta.ok){
   throw new Error(dados.detail||"Não foi possível redefinir a senha.");
  }

  mensagem.style.color="#237346";
  mensagem.textContent="Senha alterada com sucesso! Volte ao login para entrar.";

  document.getElementById("formSenha").reset();
  history.replaceState(null,"","/redefinir-senha.html");

 }catch(erro){
  mensagem.style.color="#bd2525";
  mensagem.textContent=erro.message;
  botao.disabled=false;
 }
});
</script>
</body>
</html>
